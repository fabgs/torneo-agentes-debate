rtificial deja de lado la intervención humana. En una oficina, eso es una ventaja. En un aula, es el problema, porque en educación esa intervención se llama aprender.\n\nHablamos de la inteligencia artificial generativa, la de ChatGPT, la que, como decía Noelia, ya está en el móvil de cada alumno. Ella no defiende «el móvil a solas». Nosotros juzgamos ese, porque es el que ha entrado en las aulas. Beneficiosa es la que mejora el fin del sistema, que no es entregar deberes, sino que el alumno sepa hacer las cosas solo. Y el sistema es el español de hoy, no un piloto.\n\nDe ahí nuestro criterio, la prueba de los manguitos. ¿Qué sabe hacer el alumno cuando se la quitan? Y aquí coincidimos, porque Noelia le respondió a Marcos que cuenta «lo que sabe cuando se la quitan». Gracias, Noelia. Esa será nuestra vara.\n\nNuestra tesis es que la inteligencia artificial, tal como entra hoy en las aulas, no es beneficiosa, sino un manguito que hace flotar el ejercicio y hunde el aprendizaje. Lo veréis en tres pasos.\n\nEl primero, que esto es un manguito y no una calculadora. La calculadora entra en clase cuando ya sabes sumar. La inteligencia artificial llega antes y hace lo que viniste a aprender, redactar, razonar, resolver. Un ensayo de PNAS de 2025 con casi mil alumnos de instituto lo midió [3852]. Con ChatGPT practicaban mejor, pero cuando se lo quitaron sacaron un diecisiete por ciento menos que quienes nunca lo tuvieron. Como bajar de un seis a un cinco. Y no es un uso raro. Según la OCDE, casi uno de cada tres alumnos europeos, españoles incluidos, le pide la solución completa [3864]. El manguito no es el mal uso. Es el uso.\n\nEl segundo, el efecto GPS, que te hunde sin que lo notes. Según Scientific Reports, quien más usa el GPS peor se orienta sin él, y con los años su memoria espacial cae más [3855]. Con el pensamiento pasa igual. En ese mismo ensayo de PNAS, quienes empeoraron ni lo notaron, y quienes usaron el tutor diseñado no mejoraron en el examen, pero creyeron que sí [3853]. Es el niño que jura que sabe nadar. Y lo que nadie nota, nadie lo corrige.\n\nEl tercero, la imprenta sin alfabetizar. Una imprenta en un pueblo donde nadie sabe leer no reparte cultura, reparte papel. En España la herramienta ha llegado antes que la formación, porque según TALIS 2024 la falta de conocimientos es la primera barrera docente, y en primaria la señalan más de ocho de cada diez [3861]. Antes que una evaluación fiable, porque según Stanford los detectores tomaron por texto de máquina seis de cada diez redacciones reales de alumnos no nativos [3862]. Y antes que las reglas, porque Europa ha aplazado a diciembre de 2027 las obligaciones de la inteligencia artificial que evalúa a los alumnos [3863]. Manguitos hay para todos. Socorristas, todavía no.\n\nAsí que, cada vez que esta tarde os cuenten lo que la inteligencia artificial hace por el alumno, haceos una pregunta. ¿Y qué pasa cuando se la quitan? Porque el sistema educativo no existe para que los alumnos floten. Existe para que aprendan a nadar.", "mio": true}]}, {"ronda": "Ronda 1", "sala": "Sala 1", "enlace": "rondas/R1/R1D1/visor.html", "fase": "Examen cruzado a Kairós (en contra)", "n": 4, "nota": 3.7, "turnos": [{"nombre": "Noelia Cano", "tipo": "pregunta", "texto": "Valeria, en ese ensayo de PNAS, los alumnos que usaron el tutor diseñado, ¿también sacaron un diecisiete por ciento menos cuando se lo quitaron?", "mio": false}, {"nombre": "Valeria Domínguez", "tipo": "respuesta", "texto": "No, Noelia, y lo he dicho: el tutor diseñado frenó la caída. Pero tampoco mejoró. No superaron a quienes nunca lo tuvieron, y aun así creyeron que habían rendido mejor [3853]. Unos manguitos que no hunden, pero que tampoco enseñan a nadar.", "mio": true}, {"nombre": "Óscar Román", "tipo": "pregunta", "texto": "Valeria, si mañana un instituto prohíbe la inteligencia artificial, ¿el alumno deja de tenerla en el móvil por la tarde, o la sigue usando, pero sin ningún profesor delante?", "mio": false}, {"nombre": "Valeria Domínguez", "tipo": "respuesta", "texto": "La sigue usando, Óscar, y no venimos a prohibir. Pero inevitable no es lo mismo que beneficioso. El GPS también está en todos los móviles, y quien más lo usa peor se orienta sin él [3855]. La pregunta es si le enseña.", "mio": true}, {"nombre": "Javier Serrano", "tipo": "pregunta", "texto": "Vuestra vara mira al alumno sin la herramienta. Si el profesor recupera casi una de cada tres tardes de preparación, ¿eso cuenta como beneficio para el sistema o no?", "mio": false}, {"nombre": "Valeria Domínguez", "tipo": "respuesta", "texto": "Cuenta, Javier, y lo concedo, es un beneficio, pero es un medio. La tarde que gana el profesor se pierde si su alumno, en casa, le pide la solución completa, como uno de cada tres [3864]. Lo que el sistema produce se mide en el alumno.", "mio": true}, {"nombre": "Laura Pérez", "tipo": "pregunta", "texto": "Valeria, dijiste que juzgáis el ChatGPT del móvil a solas. Una herramienta que elige el centro y guía un profesor, ¿queda fuera de vuestro debate o también la juzgáis?", "mio": false}, {"nombre": "Valeria Domínguez", "tipo": "respuesta", "texto": "También la juzgamos, Laura. Y tampoco aprueba nuestra prueba, porque en PNAS el tutor diseñado frenó la caída, pero no mejoró el examen [3853]. Y en primaria, más de ocho de cada diez docentes señalan que les faltan conocimientos [3861]. Ese profesor guía, hoy, todavía falta.", "mio": true}]}, {"ronda": "Ronda 1", "sala": "Sala 1", "enlace": "rondas/R1/R1D1/visor.html", "fase": "Primera refutación de Brújula (a favor)", "n": 5, "nota": null, "turnos": [{"nombre": "Javier Serrano", "tipo": "discurso", "texto": "Valeria nos ha traído unos manguitos, y los manguitos tienen algo que ella no ha contado. Nadie se los pone a un niño para dejarlo solo en la piscina. Al lado siempre hay alguien mirando. Y esa es la pregunta de esta tarde, la que os dejaba Noelia, con profesor o sin él. Voy a responder a los manguitos, después volveré al tiempo y al refuerzo, y os haré la pregunta que hago siempre en un claustro, quién lo paga, quién lo forma y cuándo.\n\nEmpiezo por lo que Kairós concedió en el examen cruzado, que es mucho. Valeria le dijo a Óscar que no vienen a prohibir y que el alumno la sigue usando. Y a mí me reconoció que la tarde que gana el profesor «cuenta, y lo concedo, es un beneficio». Añadió que es un medio, y enseguida veremos adónde lleva. Pero fijaos en lo primero. Si nadie le va a quitar la herramienta al alumno, la prueba de los manguitos no compara inteligencia artificial contra nada. Compara un niño con manguitos y socorrista contra un niño con manguitos y solo.\n\nY su dato estrella lo confirma. Ese diecisiete por ciento menos del ensayo de PNAS [3613] sale del ChatGPT sin barreras, el del alumno solo en casa, el que nosotros no defendemos. Con un tutor diseñado para guiar, el mismo estudio dice que ese daño se mitiga en gran medida. Así que su mejor prueba no dice que cerremos la piscina. Dice que pongamos a alguien en el borde. Si Kairós quiere, acepto aquí su pregunta.", "mio": false}, {"nombre": "Julia Arnau", "tipo": "interpelacion", "texto": "Ese diecisiete por ciento salió de sesiones de práctica en un instituto, no de deberes en casa. ¿Dónde dice el estudio que el alumno estuviera solo en casa?", "mio": false}, {"nombre": "Javier Serrano", "tipo": "respuesta", "texto": "Tienes razón, Julia, fueron sesiones en el instituto, no en casa, y lo corrijo. Pero lo que cambió el resultado no fue el sitio, sino el diseño. Con un tutor que guía, el daño se mitiga en gran medida [3613].", "mio": false}, {"nombre": "Javier Serrano", "tipo": "discurso", "texto": "Y fijaos en lo que significa. Si hasta dentro del instituto un ChatGPT sin barreras hace daño, dejarlo solo en el móvil no lo arregla. Lo arregla elegir bien qué herramienta entra en clase y quién la guía.\n\nVamos a lo que Valeria llamó un medio. Lo es, pero ¿un medio para qué? Para corregir con calma, preparar otra ficha al chico que va perdido y llamar a su madre. Eso cuentan los docentes en la encuesta de Gallup, seis semanas por curso para atender mejor a cada alumno y a las familias [3602]. Y con una norma de centro clara, que no cuesta un euro, el ahorro crece una cuarta parte [3603].\n\nLo segundo es el refuerzo, y sobre él Kairós aún no ha dicho nada. En Nigeria, con un profesor guiando, seis semanas valieron por año y medio o dos de escuela normal [3604]. Y en un ensayo de Stanford, con un copiloto de inteligencia artificial para tutores de carne y hueso, ganaron más los alumnos de los tutores más flojos [3606]. Y ahora, mi pregunta de claustro. ¿Quién lo paga? La administración, a nueve dólares por alumno adicional [3605], frente a la academia que hoy pagan casi la mitad de las familias [3607]. Kairós, acepto vuestra segunda pregunta.", "mio": false}, {"nombre": "Valeria Domínguez", "tipo": "interpelacion", "texto": "Habéis preguntado quién lo forma. En primaria, más de ocho de cada diez docentes dicen que les faltan conocimientos. Hoy, en un aula española, ¿quién es ese socorrista en el borde?", "mio": true}, {"nombre": "Javier Serrano", "tipo": "respuesta", "texto": "El profesor que ya está en el aula, Valeria. Que diga que le falta formación no es motivo para cerrar la piscina, sino para formarlo, y en Nigeria bastaron tres días [3610].", "mio": false}, {"nombre": "Javier Serrano", "tipo": "discurso", "texto": "Eso es quién lo forma. ¿Y cuándo? Ya, porque el alumno, como reconoció Valeria, la sigue usando esta tarde. Ella misma lo dijo, «lo que nadie nota, nadie lo corrige». Exacto. Por eso hace falta alguien que lo note, un profesor formado, no un chaval solo con el móvil. Según TALIS, solo uno de cada diez docentes dice que se la prohíben [3609]. El freno es la formación, y eso tiene arreglo.\n\nValeria nos habló de una imprenta en un pueblo donde nadie sabe leer. Es verdad. Pero nadie cerró la imprenta. Se abrieron escuelas.\n\nAsí que la elección no es manguitos sí o no. Es con profesor o sin él. Con profesor, la tarde vuelve, el refuerzo deja de depender del bolsillo y el daño se frena. Sin él, el alumno sigue con manguitos y solo en el agua, y la profesora con su taco de fotocopias, el mismo para los treinta. Por eso, sí.", "mio": false}]}, {"ronda": "Ronda 1", "sala": "Sala 1", "enlace": "rondas/R1/R1D1/visor.html", "fase": "Segunda refutación de Brújula (a favor)", "n": 7, "nota": null, "turnos": [{"nombre": "Laura Pérez", "tipo": "discurso", "texto": "Tomás ha cerrado diciendo que nadie se examina con manguitos. Tiene razón. Pero cualquiera que haya apuntado a un crío a natación en el polideportivo sabe que el primer mes va con manguitos y con un monitor al lado, y que al final del verano nada solo. Esa es nuestra piscina, y Tomás la ha descrito mejor que yo. Cuando le pregunté por Nigeria, me contestó «avanzaron, Laura, no lo discuto», y añadió «eso es una clase con monitor». Exacto, Tomás, eso defendemos desde el principio.\n\nQuedan tres choques abiertos. Primero, si la herramienta enseña o solo hace flotar. Segundo, quién paga el refuerzo de la chica de segundo de la ESO sin academia. Y tercero, quién hace hoy de monitor en España.\n\nEmpiezo por el primero, el placebo con wifi. Kairós dice que el tutor diseñado mitiga, pero no mejora, y Noelia nunca os lo vendió de otra manera. Pero fijaos en lo que prueba ese ensayo de PNAS [3613]. No prueba si la inteligencia artificial sirve, sino que importa cuál entra en clase. Con un ChatGPT sin barreras, el alumno se hunde, y con un tutor que guía, ese daño se frena en gran medida. La mejora la mide otro estudio, el del Banco Mundial en Nigeria [3604], donde con un profesor guiando los chavales avanzaron en seis semanas lo de año y medio o dos de escuela normal. Un placebo es una pastilla de azúcar, y con azúcar nadie avanza año y medio. Y aquí, Kairós, acepto vuestra primera pregunta.", "mio": false}, {"nombre": "Valeria Domínguez", "tipo": "interpelacion", "texto": "Si en PNAS el tutor diseñado no mejoró el examen y en Nigeria sí, ¿no es el profesor que guiaba en Nigeria, y no la máquina, lo que marca la diferencia?", "mio": true}, {"nombre": "Laura Pérez", "tipo": "respuesta", "texto": "Las dos cosas, Valeria, y por eso decimos herramienta. En Stanford todos tenían un tutor de carne y hueso, y aquellos cuyo tutor usaba además la inteligencia artificial dominaron más temas [3606]. El profesor marca la diferencia y la herramienta la multiplica.", "mio": false}, {"nombre": "Laura Pérez", "tipo": "discurso", "texto": "Y fijaos en la pregunta de Valeria, porque nos da la razón. Si lo que marca la diferencia es el profesor que guía, no dejemos la herramienta sola en el bolsillo, pongámosla en sus manos. Y lo mismo vale para lo que decía Tomás, que el alumno sale convencido de haber mejorado. ¿Quién lo baja de esa nube? Su profesora, con un examen sin la máquina delante.\n\nPaso al segundo choque, el del primo listo. Os presento a Lucía. Está en segundo de la ESO, las fracciones se le atragantan y en su casa no llega para academia. Tomás tiene razón en una cosa, la academia funciona porque alguien se sienta a tu lado. Pero ¿qué le ofrece Kairós a Lucía esta noche? No vienen a prohibir, así que le dejan justo el primo listo, el móvil a solas. Nosotros le ofrecemos lo contrario, un tutor en el instituto con su profesora al lado, como en Nigeria, donde costó nueve dólares por cada alumno adicional [3605]. Comparadlo con la academia que hoy pagan casi la mitad de las familias [3607]. A los nueve dólares, Tomás no ha dicho ni una palabra. Porque el primo listo no es nuestro modelo, es lo que le queda a Lucía cuando nadie le ofrece otra cosa. Y aquí, Kairós, os concedo vuestra segunda pregunta.", "mio": false}, {"nombre": "Tomás Lledó", "tipo": "interpelacion", "texto": "En Stanford, quien usaba la inteligencia artificial era el tutor humano, no el alumno. ¿Eso no prueba que ayuda al profesor, no que enseñe al alumno?", "mio": false}, {"nombre": "Laura Pérez", "tipo": "respuesta", "texto": "Prueba justo lo que defendemos, Tomás, una herramienta en manos del profesor. Pero en Nigeria la usaban los propios alumnos, con un profesor guiando [3604], y tú mismo concediste que avanzaron. Ayuda a los dos.", "mio": false}, {"nombre": "Laura Pérez", "tipo": "discurso", "texto": "Y eso me lleva al último choque, quién hace hoy de monitor. Tomás nos dice que ese profesor «todavía no sabe nadar en esta piscina» y que la escuela sigue en obras. Pero esas obras no se terminan esperando, se terminan formando. Según TALIS, solo uno de cada diez docentes la tiene prohibida [3609]. Eso no es una piscina cerrada, es un monitor que espera su cursillo, y en Nigeria bastaron tres días [3610]. Y mientras esperamos, Lucía sigue esta noche sola con el móvil.\n\nRecapitulo los tres choques. La herramienta enseña cuando alguien guía, y Tomás concedió que en Nigeria avanzaron. El refuerzo cuesta nueve dólares, no una academia, y nadie lo ha discutido. Y el monitor se forma en días, no en generaciones.\n\nVolvamos al polideportivo. Primero manguitos y monitor, y al final del verano Lucía nada sola, sin academia y sin la misma fotocopia que los otros veintinueve. Por eso, sí.", "mio": false}]}], "feedbacks": [{"ronda": "Ronda 1", "sala": "Sala 1", "enlace": "rondas/R1/R1D1/visor.html", "contexto": "en contra, contra Brújula", "jueces": [{"juez": "Carmen Llorens", "titulo": "jueza de fondo", "texto": "Valeria Domínguez."}, {"juez": "Álex Moreno", "titulo": "juez de forma", "texto": "Valeria Domínguez: apertura excelente. Los manguitos se entienden al instante y «Manguitos hay para todos. Socorristas, todavía no» es de esos finales que se recuerdan. Capturaste en el acto el criterio que concedió el rival, con mucha agilidad. A mejorar: «El manguito no es el mal uso. Es el uso» convierte un 31 % en la norma. Di «uno de cada tres» y deja que la cifra pese sola. En el examen cruzado, cuando concedas un beneficio, sopésalo en la misma respuesta. «Es un medio» se quedó corto y el rival lo usó todo el debate."}, {"juez": "Isabel Garrigós", "titulo": "jueza principal", "texto": "Valeria Domínguez (introductora). Un comienzo de los que se recuerdan, con los manguitos y una pregunta directa al jurado. Buen aprovechamiento de la carta y de las respuestas del examen cruzado, y tres pasos claros con evidencia bien elegida. A mejorar: en el examen cruzado concediste «es un beneficio» sin un marco preparado, y el rival lo usó todo el debate. Preparad cómo conceder conteniendo, por ejemplo «beneficio para el docente que no llega al alumno sin X». Y cuando generalicéis a partir de una encuesta, anticipad la objeción: la misma ficha de la OCDE dice que la mayoría la usa para informarse y que le expliquen conceptos."}], "equipo": "**Carmen Llorens (jueza de fondo):** **Equipo.** Caso muy coherente, con una imagen central (manguitos) que acabó organizando todo el debate, un estribillo memorable y una lectura precisa de vuestras fichas de PNAS, TALIS y el Ómnibus. Usasteis muy bien la carta («deja de lado la intervención humana») y el marco español. Puntos a mejorar: (1) Las metáforas no pueden cargar con el peso de la inferencia: «placebo», «primo listo» y «ojalá» necesitan un dato debajo. (2) Concedisteis Nigeria, Stanford y el tiempo docente sin tener preparada una ponderación probada de por qué pesan menos. (3) Si exigís datos de España y no de pilotos, aplicad la misma exigencia a vuestro estudio estrella. (4) La repetición del estribillo os quitó tiempo para argumentar.\n\n**Valeria Domínguez.** Exordio excelente, y tomar la respuesta de Noelia como vara común fue una jugada estratégica de primer nivel. Usaste los datos con precisión. A mejorar: «El manguito no es el mal uso. Es el uso» generaliza a todos lo que hace un 31%, y tu propia ficha dice que los usos más comunes son informarse y que les expliquen conceptos. El GPS es una analogía: preséntala como tal y apóyala en evidencia directa sobre IA. En el examen cruzado, conceder el tiempo docente como beneficio sin una respuesta probada de por qué es «solo un medio» os dejó expuestos toda la tarde. El argumento de los detectores se perdió por el camino: si lo traes, que alguien lo recoja.\n\n**Tomás Lledó.** Convertir al socorrista en alguien que «vigila, no enseña» fue un gran giro, y «mitiga, no mejora» va a la raíz de la ficha. Estructura en tres paradas muy clara. A mejorar: «placebo con wifi» exagera, porque un placebo no hace nada y ese tutor mejoró la práctica y no dañó el examen. «Quien cree que ya sabe no pide ayuda» es plausible, pero no lo probaste. Antes de conceder Nigeria sin matices, prepara las distinciones: el contexto de partida, que la prueba incluía conocimientos de IA y que en inglés el efecto fue menor.\n\n**Julia Arnau.** La refutación más técnica del debate: la distinción entre coste marginal y coste de montaje, y el problema de que Nigeria mezcla programa y herramienta, son exactos. Tu interpelación pilló un error de caracterización del rival. A mejorar: dijiste que la máquina «multiplica por uno» y en la misma intervención concediste Stanford, que es justo una comparación con y sin IA manteniendo al humano. Si te retiras a «la usaba el tutor», necesitas un argumento de por qué los beneficios del docente no cuentan para el sistema. En la refutación cruzada, «no hace falta la cifra» es lógicamente correcto: desarróllalo con el dato y no con la frase.\n\n**Marcos Peris.** Tu pregunta en el examen cruzado marcó el debate. La conclusión tuvo una estructura de ponderación clara («¿por qué pesa más lo nuestro?») y un cierre emotivo muy logrado («una mano que sabe cuándo soltarte»). A mejorar: «sus beneficios son de piloto y nuestros daños, del uso que hay el lunes» no se sostiene del todo, porque vuestro PNAS es también un experimento de campo y el ahorro de tiempo docente no dependía de ningún programa. Despachar ese beneficio como «un medio» exigía una prueba de que ese tiempo se pierde.\n\n**Álex Moreno (juez de forma):** Equipo: el marco más coherente de la tarde. Los manguitos atraviesan las cuatro voces, cada orador cita con precisión lo que concedió el rival y el cierre «Flotar no es nadar. Por eso, no» da unidad. A mejorar: el estribillo «la pregunta no es qué hace por el alumno, sino qué sabe cuando se la quitan» sonó demasiadas veces, y repetido deja de cortar. Más allá del diagnóstico, no ofrecisteis una alternativa para el alumno que ya usa la IA en casa, y el rival lo explotó. No respondisteis a la norma de centro [3603] ni sopesasteis de verdad el tiempo del profesor que concedisteis.\n\nValeria Domínguez: apertura excelente. Los manguitos se entienden al instante y «Manguitos hay para todos. Socorristas, todavía no» es de esos finales que se recuerdan. Capturaste en el acto el criterio que concedió el rival, con mucha agilidad. A mejorar: «El manguito no es el mal uso. Es el uso» convierte un 31 % en la norma. Di «uno de cada tres» y deja que la cifra pese sola. En el examen cruzado, cuando concedas un beneficio, sopésalo en la misma respuesta. «Es un medio» se quedó corto y el rival lo usó todo el debate.\n\nTomás Lledó: los mejores giros retóricos del debate. «El socorrista no te enseña a nadar, vigila que no te ahogues», «placebo con wifi», «primo listo», «primero las escuelas». Hoja de ruta clara y recapitulación limpia. A mejorar: «No queda igual: queda igual y convencido…» suena contradictorio. Ensaya la frase para que la idea llegue a la primera. La etiqueta de placebo era vulnerable a Nigeria, que tú mismo concediste: anticipa esa objeción antes de lanzarla.\n\nJulia Arnau: tu interpelación sobre «en casa» fue precisa y cambió el tono del choque. Leer los 9 $ como coste marginal y plantear el problema de atribución en Nigeria fueron argumentos finos. A mejorar: usaste el estribillo cuatro veces en dos turnos; guárdalo para el último golpe. «Multiplicar por uno» choca con Stanford: allí los alumnos aprendieron más sin tocar la herramienta. Respóndelo con tu propia vara en lugar de desplazarte a «la usaba el tutor».\n\nMarcos Peris: tu pregunta del examen cruzado marcó el criterio de todo el debate, y la conclusión tiene la imagen más emotiva de la tarde («una mano que sabe cuándo soltarte», «un manguito que no se desinfla nunca»). La ponderación también es clara (piloto frente a lunes, el daño que no se nota). A mejorar: «sus beneficios son de piloto» deja un flanco abierto, porque PNAS también es un experimento controlado. Anticípalo. Y dedica una frase a explicar por qué el tiempo del profesor pesa menos, en lugar de solo recordar que es un medio.\n\n**Isabel Garrigós (jueza principal):** **En equipo.** Tenéis un sistema de imágenes muy cohesionado (manguitos, GPS, imprenta, socorrista) que todo el equipo mantuvo y que marcó el terreno del debate. Usasteis con inteligencia la definición de la carta («deja de lado la intervención humana») y supisteis fijar el criterio desde el examen cruzado. Las evidencias son fieles a las fichas. Tenéis tres cosas que mejorar. (1) Dependéis mucho de una sola ficha ([3853]): diversificad, porque si os la neutralizan os quedáis sin caso. (2) Restringir el debate a «la IA tal como entra hoy» (el móvil a solas) necesita más justificación: la carta describe también centros que la integran de forma guiada. (3) Algunos saltos lógicos os dejaron expuestos: «multiplicar por uno», «el manguito es el uso» a partir de un 31 %, o «la tarde se pierde si el alumno copia».\n\n**Valeria Domínguez (introductora).** Un comienzo de los que se recuerdan, con los manguitos y una pregunta directa al jurado. Buen aprovechamiento de la carta y de las respuestas del examen cruzado, y tres pasos claros con evidencia bien elegida. A mejorar: en el examen cruzado concediste «es un beneficio» sin un marco preparado, y el rival lo usó todo el debate. Preparad cómo conceder conteniendo, por ejemplo «beneficio para el docente que no llega al alumno sin X». Y cuando generalicéis a partir de una encuesta, anticipad la objeción: la misma ficha de la OCDE dice que la mayoría la usa para informarse y que le expliquen conceptos.\n\n**Tomás Lledó (refutador 1).** Gran pregunta en el examen cruzado (¿mitigó o mejoró?), muy buenas fórmulas («placebo con wifi», «primo listo») y una estructura en tres paradas fácil de seguir. A mejorar: ante la interpelación sobre Nigeria concediste sin tener lista la objeción de fondo (era un programa entero, no se sabe qué parte pone la máquina), que llegó después con Julia. Llevad esa respuesta preparada desde la primera refutación. Y «una tarde libre no compensa un error que nadie ve» necesita un mecanismo que la conecte con el aprendizaje del alumno.\n\n**Julia Arnau (refutadora 2 y de la refutación cruzada).** La interpelación que destapó el «en casa» fue precisa y oportuna, y la lectura de los 9 $ como coste marginal fue de lo más sólido de vuestro caso. La refutación cruzada fue limpia, con la imagen del «ojalá». A mejorar: «multiplicar por uno» mezclaba el tutor de PNAS sin docente con el docente que usa la herramienta, y la pregunta sobre Stanford lo desmontó. Si concedéis que la herramienta funciona en manos del profesor, explicad por qué eso no cuenta como beneficio para el sistema, porque la pregunta habla del sistema y no solo del alumno.\n\n**Marcos Peris (conclusor).** La pregunta que fijó la vara fue estratégica y muy bien formulada. La conclusión pondera de forma explícita (daños del lunes frente a beneficios de piloto, el daño que el alumno no nota) y el cierre de la mano que sabe cuándo soltarte es contundente. A mejorar: «sus beneficios son de piloto» es vulnerable, porque vuestro estudio estrella también es un experimento y algunas pruebas del rival (Inglaterra, Gallup) son uso real. Y afirmar que PNAS es el único sitio donde se midió con y sin la máquina exagera la evidencia: un rival atento os lo habría devuelto."}]}, {"nombre": "Óscar Román", "equipo": "Brújula", "puesto": "conclusor", "puntos": 0, "nominaciones": 0, "notas": [4.3], "media": 4.3, "slug": "oscar-roman", "puesto_txt": "Conclusión", "intervenciones": [{"ronda": "Ronda 1", "sala": "Sala 1", "enlace": "rondas/R1/R1D1/visor.html", "fase": "Examen cruzado a Kairós (en contra)", "n": 4, "nota": null, "turnos": [{"nombre": "Noelia Cano", "tipo": "pregunta", "texto": "Valeria, en ese ensayo de PNAS, los alumnos que usaron el tutor diseñado, ¿también sacaron un diecisiete por ciento menos cuando se lo quitaron?", "mio": false}, {"nombre": "Valeria Domínguez", "tipo": "respuesta", "texto": "No, Noelia, y lo he dicho: el tutor diseñado frenó la caída. Pero tampoco mejoró. No superaron a quienes nunca lo tuvieron, y aun así creyeron que habían rendido mejor [3853]. Unos manguitos que no hunden, pero que tampoco enseñan a nadar.", "mio": false}, {"nombre": "Óscar Román", "tipo": "pregunta", "texto": "Valeria, si mañana un instituto prohíbe la inteligencia artificial, ¿el alumno deja de tenerla en el móvil por la tarde, o la sigue usando, pero sin ningún profesor delante?", "mio": true}, {"nombre": "Valeria Domínguez", "tipo": "respuesta", "texto": "La sigue usando, Óscar, y no venimos a prohibir. Pero inevitable no es lo mismo que beneficioso. El GPS también está en todos los móviles, y quien más lo usa peor se orienta sin él [3855]. La pregunta es si le enseña.", "mio": false}, {"nombre": "Javier Serrano", "tipo": "pregunta", "texto": "Vuestra vara mira al alumno sin la herramienta. Si el profesor recupera casi una de cada tres tardes de preparación, ¿eso cuenta como beneficio para el sistema o no?", "mio": false}, {"nombre": "Valeria Domínguez", "tipo": "respuesta", "texto": "Cuenta, Javier, y lo concedo, es un beneficio, pero es un medio. La tarde que gana el profesor se pierde si su alumno, en casa, le pide la solución completa, como uno de cada tres [3864]. Lo que el sistema produce se mide en el alumno.", "mio": false}, {"nombre": "Laura Pérez", "tipo": "pregunta", "texto": "Valeria, dijiste que juzgáis el ChatGPT del móvil a solas. Una herramienta que elige el centro y guía un profesor, ¿queda fuera de vuestro debate o también la juzgáis?", "mio": false}, {"nombre": "Valeria Domínguez", "tipo": "respuesta", "texto": "También la juzgamos, Laura. Y tampoco aprueba nuestra prueba, porque en PNAS el tutor diseñado frenó la caída, pero no mejoró el examen [3853]. Y en primaria, más de ocho de cada diez docentes señalan que les faltan conocimientos [3861]. Ese profesor guía, hoy, todavía falta.", "mio": false}]}, {"ronda": "Ronda 1", "sala": "Sala 1", "enlace": "rondas/R1/R1D1/visor.html", "fase": "Primera refutación de Kairós (en contra)", "n": 6, "nota": null, "turnos": [{"nombre": "Tomás Lledó", "tipo": "discurso", "texto": "Javier nos ha dicho que a un niño con manguitos nadie lo deja solo, que al lado siempre hay alguien mirando. Tiene razón. Pero fijaos en qué hace ese alguien. El socorrista no te enseña a nadar, vigila que no te ahogues. Y eso, exactamente eso, es lo que Brújula nos ha ofrecido esta tarde.\n\nOs propongo tres paradas. Primero, el socorrista, es decir, su tutor bien diseñado. Después, el refuerzo de Nigeria y quién hace hoy de socorrista en España. Y al final, por qué el manguito sigue intacto.\n\nEmpiezo por el socorrista. Javier dice que con un tutor que guía el daño se mitiga. Mitiga, no mejora. Se lo pregunté a Noelia y me respondió con una honestidad que le agradezco, «se mitigó, Tomás, y no os lo vendo como mejora». El ensayo de PNAS, el mismo que citó Noelia, lo confirma. Los del tutor diseñado no rindieron mejor que quienes nunca lo tuvieron, y aun así creyeron que sí [3853].\n\nY ahora medidlo con su propia vara. Javier dice que nadie le va a quitar la herramienta al alumno. Se la quita cada examen, y Noelia aceptó que eso es lo que cuenta. Pues en su mejor versión, con barreras y en un aula, el examen sin la herramienta no mejora. Y una herramienta que, bien diseñada, te deja igual y encima te convence de que has mejorado no es beneficiosa. Es un placebo con wifi. Y como esto os toca de lleno, Brújula, os dejo la palabra.", "mio": false}, {"nombre": "Laura Pérez", "tipo": "interpelacion", "texto": "Tomás, dices que con barreras el examen no mejora. En Nigeria, con un profesor guiando, ¿los alumnos se quedaron igual o avanzaron lo de año y medio de escuela?", "mio": false}, {"nombre": "Tomás Lledó", "tipo": "respuesta", "texto": "Avanzaron, Laura, no lo discuto. Con un profesor que guiaba y vigilaba, como dijo Noelia. Eso es una clase con monitor, no el manguito del bolsillo. ¿Y dónde está hoy ese monitor en España?", "mio": false}, {"nombre": "Tomás Lledó", "tipo": "discurso", "texto": "Y Laura me lleva a la segunda parada, el refuerzo, que Javier nos echaba en cara. Noelia nos pidió pensar en lo que cuesta una hora de academia. Pensémoslo. La academia cuesta porque alguien se sienta a tu lado y no te deja copiar. Lo gratis, lo que el chaval sin academia tiene esta noche, no es el programa de Nigeria. Es la aplicación del móvil. Y según la OCDE, casi uno de cada tres alumnos europeos, españoles incluidos, le pide la solución completa [3864]. Un profesor particular que te hace los deberes no es un profesor. Es un primo listo.\n\n¿Y quién hace hoy de monitor en España? Javier le contestó a Valeria que el profesor que ya está en el aula. Pero ese profesor nos dice que todavía no sabe nadar en esta piscina. Según TALIS 2024, la falta de conocimientos es su primera barrera, y en primaria la señalan más de ocho de cada diez [3861]. ¿Y quién garantiza que lo formen? Europa no, porque su reglamento, reformado este julio, se conforma con promover la alfabetización, sin garantizar ningún nivel [3863].\n\nJavier decía que nadie cerró la imprenta, que se abrieron escuelas. Exacto, Javier. Primero las escuelas. Lo que nos pedís es aplaudir la imprenta con la escuela todavía en obras. Y como sé que aquí tenéis algo que decir, Brújula, os escucho.", "mio": false}, {"nombre": "Óscar Román", "tipo": "interpelacion", "texto": "Tomás, si con el tutor diseñado el alumno queda igual en el examen y el profesor recupera casi una de cada tres tardes, ¿eso es un placebo o un saldo positivo?", "mio": true}, {"nombre": "Tomás Lledó", "tipo": "respuesta", "texto": "Placebo, Óscar. No queda igual: queda igual y convencido de que ha mejorado [3853], y quien cree que ya sabe no pide ayuda. Una tarde libre no compensa un error que nadie ve.", "mio": false}, {"nombre": "Tomás Lledó", "tipo": "discurso", "texto": "Y eso me lleva a la última parada, por qué el manguito sigue intacto. Javier no negó el dato de Valeria, dijo que no es su herramienta. Con ChatGPT practicaban mejor y, cuando se lo quitaron, sacaron un diecisiete por ciento menos que quienes nunca lo tuvieron [3852]. Y no en casa, sino en un instituto, como Julia le recordó a Javier. Ese ChatGPT no es una caricatura, es el que casi uno de cada tres usa para pedir la solución completa [3864]. Su tutor diseñado es de piloto. Lo que hay el lunes es el manguito.\n\nRecapitulo. El socorrista frena el daño, pero no enseña. El refuerzo gratis es un primo listo. Y el monitor prometido dice hoy que le falta formación.\n\nBrújula nos ha demostrado lo bien que flota un alumno con inteligencia artificial. No se lo discutimos. Pero nadie se examina con manguitos. Y el día que se los quitan, flotar no es nadar. Por eso, no.", "mio": false}]}, {"ronda": "Ronda 1", "sala": "Sala 1", "enlace": "rondas/R1/R1D1/visor.html", "fase": "Conclusión de Brújula (a favor)", "n": 12, "nota": 4.3, "turnos": [{"nombre": "Óscar Román", "tipo": "discurso", "texto": "Llevamos toda la tarde en una piscina, entre manguitos, monitores y socorristas. Pero este debate empezó en una fotocopiadora, un lunes a las ocho menos diez. Y ahí se decide.\n\nOs recuerdo nuestra tesis. Con el profesor al mando, la inteligencia artificial le devuelve tiempo y pone al alcance de cualquier alumno el refuerzo que hoy se paga en la academia. Nuestro criterio era la prueba del lunes, el aula real frente a la alternativa real. Y Noelia aceptó la vara de Marcos, lo que sabe el alumno cuando se la quitan. Con ella, pesad dos choques.\n\nEl primero, si la herramienta enseña o solo hace flotar. Kairós ha concedido nuestras pruebas. Valeria, que la tarde que recupera el profesor es un beneficio. Tomás, que en Nigeria los chavales avanzaron año y medio de escuela [3604]. Y Julia, que en Stanford los alumnos dominaron más temas [3606]. Responden que el mérito es del profesor. Pero nunca defendimos una máquina que enseña sola, así que eso nos da la razón. Hasta el estudio de PNAS dice que sin barreras el alumno se hunde y con un tutor que guía el daño se frena [3613]. No es un motivo para el no, es el manual de instrucciones.\n\nEl segundo choque, la alternativa real, es el que más pesa. Julia llamó a nuestro sí un ojalá, porque el monitor todavía no ha llegado. ¿Y qué propone Kairós para que llegue? No prohíben ni ponen a nadie que la guíe. Su mundo lo resumió la propia Julia, Lucía sola con el móvil. El nuestro le pone a su profesora al lado, formada en días [3610], a nueve dólares por alumno adicional [3605], cuando hoy la academia la paga casi la mitad de las familias [3607]. Esperar sin hacer nada es un ojalá. Formar al profesor que ya está en el aula es un plan.\n\nDe un lado, beneficios medidos y concedidos, para el alumno sin academia y para el profesor sin tiempo. Del otro, riesgos que dependen del diseño y tienen arreglo. Con profesor o sin él.\n\nNoelia empezó con este taco, treinta copias de la misma ficha. Imaginad ahora el lunes que defendemos. La profesora sigue llegando a las ocho menos diez, pero ya no hace cola en la fotocopiadora. Trae tres fichas distintas, la de Lucía, con las fracciones paso a paso, la de Hugo, que se aburre, y la del resto. Y le sobra media hora para llamar a la madre de Aitana, que esta semana no ha venido. Eso no lo ha hecho una máquina, sino una profesora con una herramienta. Y en el examen de junio, sin el móvil delante, Lucía sabrá hacer fracciones sin haber pisado una academia. Este taco, por fin, ha dejado de ser el mismo para los treinta. Por eso, sí.", "mio": true}]}], "feedbacks": [{"ronda": "Ronda 1", "sala": "Sala 1", "enlace": "rondas/R1/R1D1/visor.html", "contexto": "a favor, contra Kairós", "jueces": [{"juez": "Carmen Llorens", "titulo": "jueza de fondo", "texto": "Óscar Román."}, {"juez": "Álex Moreno", "titulo": "juez de forma", "texto": "Óscar Román: gran cierre. Volviste a la fotocopiadora y la escena de Lucía, Hugo y Aitana se recuerda. «Esperar sin hacer nada es un ojalá. Formar al profesor que ya está en el aula es un plan» es un giro excelente. Tu interpelación («¿placebo o saldo positivo?») fue de las mejores preguntas del debate. A mejorar: no vuelvas a aceptar en la conclusión la vara del rival, reformúlala. Recupera tu propia interpelación para sopesar el tiempo del profesor frente a la ilusión de aprendizaje, que fue el punto en el que el rival os apretó."}, {"juez": "Isabel Garrigós", "titulo": "jueza principal", "texto": "Óscar Román (conclusor). Buena pregunta en el examen cruzado (prohibir no quita la herramienta) y un final muy visual y emotivo: tres fichas, la madre de Aitana, Lucía en junio. Cerraste el círculo con el taco. A mejorar: pondera de forma explícita contra el marco del rival. Si os dicen «beneficios de piloto», contestad que PNAS también es un experimento y que Inglaterra y Gallup son uso real. Apoyarse en «el rival no propone nada» rinde poco, porque el en contra no necesita plan. Lo que convence es demostrar por qué el saldo ya es positivo hoy."}], "equipo": "**Carmen Llorens (jueza de fondo):** **Equipo.** Construisteis el caso sobre evidencias sólidas y variadas (varios ensayos aleatorizados, datos oficiales españoles) y las usasteis con prudencia: «saldo positivo, no riesgo cero», «se mitigó, no os lo vendo como mejora». Sacasteis concesiones claras y las recordasteis hasta el final. Puntos a mejorar: (1) Vuestra definición compara «con IA frente a sin IA», pero vuestro criterio compara «con profesor frente a sin profesor». Son comparaciones distintas, y el rival os lo señaló con «inevitable no es beneficioso». Elegid una y justificadla. (2) Jugasteis casi todo el debate en la imagen del rival, los manguitos. Volved antes a la vuestra. (3) Cuando el rival matiza un dato vuestro, reconoced el dato completo en lugar de pedirle una cifra a él.\n\n**Noelia Cano.** Exordio muy original: dar la vuelta a la portada (el blíster es la fotocopia, no el chatbot) es contextualizar de verdad, no repetir la carta. Definiciones claras y tres pasos fáciles de seguir. En el examen cruzado respondiste con honestidad y con dato. A mejorar: al aceptar «lo que sabe cuando se la quitan» le diste al rival su vara. Puedes aceptarla, pero añade «y también lo que gana el sistema a través del profesor», para que el tiempo docente entre en el criterio. «De cada tres tardes, casi una vuelve» estira el dato del 31% de planificación: cíñete a él.\n\n**Javier Serrano.** Recoger las concesiones del examen cruzado y darle la vuelta al estudio de PNAS fue muy eficaz, y tu interpelación sobre el grupo de control de Nigeria fue la pregunta más afilada del debate. A mejorar: el «solo en casa» no estaba en la ficha. Comprueba el contexto de cada estudio antes de caracterizarlo (la rectificación, eso sí, fue impecable). Respondiste a pocas piezas del rival: el GPS es una analogía y el 31% no es «el uso». «No cuesta un euro» es un añadido sin prueba.\n\n**Laura Pérez.** Muy buena organización por choques, y Lucía hace concreto el argumento de equidad. Tu pregunta sobre Stanford fue decisiva. A mejorar: «el profesor marca la diferencia y la herramienta la multiplica» le regaló al rival el «multiplica por uno». Tu propia ficha [3610] dice que en Nigeria los docentes no impartían instrucción directa: úsala. En el choque de los 9 dólares, reconoce los 48 y 124 dólares de tu ficha; seguían siendo más baratos que una academia y habrías cerrado el choque con honestidad. El rival aplica una doble vara («vuestros pilotos, nuestro lunes», cuando PNAS también es un experimento) y no la aprovechaste.\n\n**Óscar Román.** Cierre circular con el taco de fotocopias, y la imagen de las tres fichas y la llamada a la familia de Aitana es concreta y emotiva. Repasaste bien las concesiones. Tu pregunta en el examen cruzado sacó un «no venimos a prohibir» muy útil. A mejorar: «formada en días» exagera, porque esos tres días eran para un programa ya montado. Contra el «ojalá» tenías la mejor respuesta y no la pusiste delante: el ensayo inglés solo necesitó ChatGPT y una guía. Es un beneficio de hoy que no depende de ningún monitor. «Esperar sin hacer nada» atribuye al rival una carga que no tiene.\n\n**Álex Moreno (juez de forma):** Equipo: muy cohesionados. Os citáis entre vosotros (el «con profesor o sin él» de Noelia vuelve en todos) y el taco de fotocopias abre y cierra el debate. El mayor margen de mejora está en el marco. Dejasteis que la metáfora del rival (manguitos, socorristas) ocupara toda la tarde. Reclamad antes vuestra imagen en las refutaciones, no solo en la conclusión. Os quedaron sin responder los detectores [3862], el GPS y el aplazamiento europeo [3863]. Tampoco usasteis que PNAS también es un experimento controlado, igual que los «pilotos» que os reprochaban.\n\nNoelia Cano: apertura brillante. Usar la portada de la carta para decir que lo que trata a todos igual es la fotocopia, y no el chatbot, es original y engancha desde la primera frase. Definiciones limpias («saldo positivo, no riesgo cero»). A mejorar: el bloque central amontona ocho fichas en cuatro minutos. Elegid cuatro o cinco y dejad que cada una respire, como hiciste con «de cada tres tardes, casi una vuelve». En el examen cruzado, antes de aceptar un criterio del rival, reformúlalo en vuestros términos (por ejemplo: «lo que sabe sin ella, y también lo que gana el sistema con el tiempo del profesor»). Aceptarlo tal cual le dio al rival la vara para todo el debate.\n\nJavier Serrano: muy buena estructura con la «pregunta de claustro» (quién lo paga, quién lo forma, cuándo), y la réplica a los manguitos («nadie deja al niño solo») es eficaz. «Nadie cerró la imprenta. Se abrieron escuelas» es la mejor frase de tu turno. Corregiste el error con elegancia. A mejorar: revisa la ficha antes de describirla, porque PNAS eran sesiones en el instituto y no deberes en casa, y el rival lo recordó varias veces. Usa menos citas seguidas. Cuando el rival concede un beneficio, sopésalo de forma explícita frente a su daño en lugar de solo anotarlo.\n\nLaura Pérez: la oradora más completa de vuestro lado. Lucía convierte la estadística en una persona, el polideportivo le da la vuelta a la metáfora del rival y respondiste a las interpelaciones con evidencia (Stanford) sin perder el hilo. A mejorar: en la refutación cruzada citaste seis fichas en 90 segundos, y en ese turno el jurado necesita una idea por choque. El argumento de Stanford es vuestra mejor arma contra la vara del rival: dilo pronto y sin rodeos («esos alumnos nunca tocaron la IA y aprendieron más: pasan vuestra prueba»).\n\nÓscar Román: gran cierre. Volviste a la fotocopiadora y la escena de Lucía, Hugo y Aitana se recuerda. «Esperar sin hacer nada es un ojalá. Formar al profesor que ya está en el aula es un plan» es un giro excelente. Tu interpelación («¿placebo o saldo positivo?») fue de las mejores preguntas del debate. A mejorar: no vuelvas a aceptar en la conclusión la vara del rival, reformúlala. Recupera tu propia interpelación para sopesar el tiempo del profesor frente a la ilusión de aprendizaje, que fue el punto en el que el rival os apretó.\n\n**Isabel Garrigós (jueza principal):** **En equipo.** El caso es sólido y muy bien estructurado: tiempo, refuerzo e implantación, con un criterio claro (la prueba del lunes) y evidencias variadas y de peso (Inglaterra, Gallup, Banco Mundial, Stanford, EsadeEcPol, TALIS). Supisteis sacar concesiones en los exámenes cruzados y en las interpelaciones y volver a ellas en cada turno. Tenéis tres cosas que mejorar. (1) Acabasteis debatiendo dentro de la metáfora del rival (la piscina): si traéis una imagen propia (el taco de fotocopias, que era muy buena), mantenedla viva en las refutaciones. (2) Vuestra mejor respuesta al «es un ojalá» era que el ahorro de tiempo docente es de hoy y no necesita formación especial (Inglaterra: solo ChatGPT y una guía). Apareció en el examen cruzado y luego desapareció. (3) La carta habla de evaluación, de normativa europea y de protección de datos de menores, y teníais fichas para eso ([3612], [3614]) que no usasteis.\n\n**Noelia Cano (introductora).** El comienzo es excelente: resignificar la portada (lo que uniforma es la fotocopia, no el chatbot) contextualiza y engancha a la vez. Las definiciones son precisas y el criterio es claro, y las respuestas del examen cruzado fueron honestas y con evidencia («Hoy, Julia», y separar mitigación de mejora). A mejorar: cuando os pregunten por la vara, respondedla sin entregarla del todo. Algo como «las dos cosas: lo que sabe sin ella y lo que aprende con ella guiado» os habría evitado que el rival construyera todo su caso con vuestras palabras.\n\n**Javier Serrano (refutador 1).** Muy buen giro de los manguitos (al lado siempre hay alguien mirando), gran uso de las concesiones y una estructura memorable: quién lo paga, quién lo forma y cuándo. A mejorar, y es lo más importante: no adornéis nunca una evidencia. Lo de «solo en casa» no estaba en el estudio, y la corrección en directo os costó credibilidad justo en vuestra respuesta a la prueba central del rival. Antes de describir el contexto de un estudio (dónde, quién, cómo), comprobadlo en la ficha. Supiste rectificar con elegancia, y eso está bien.\n\n**Laura Pérez (refutadora 2 y de la refutación cruzada).** La interpelación sobre Stanford es de lo mejor del debate: corta, cerrada y con una concesión que pesó. Recorriste los choques en orden, devolviste la pregunta de Valeria y Lucía funciona como relato. A mejorar: cuando el rival ataca una cifra (los 9 $ marginales), contestad con la cifra completa, que también está en vuestra ficha: 48 $ por alumno en el piloto frente al coste de una academia. «No han dado ninguna cifra» traslada la carga. Y en la refutación cruzada no recortéis la precisión («por alumno adicional»), porque ahí es donde más se nota.\n\n**Óscar Román (conclusor).** Buena pregunta en el examen cruzado (prohibir no quita la herramienta) y un final muy visual y emotivo: tres fichas, la madre de Aitana, Lucía en junio. Cerraste el círculo con el taco. A mejorar: pondera de forma explícita contra el marco del rival. Si os dicen «beneficios de piloto», contestad que PNAS también es un experimento y que Inglaterra y Gallup son uso real. Apoyarse en «el rival no propone nada» rinde poco, porque el en contra no necesita plan. Lo que convence es demostrar por qué el saldo ya es positivo hoy."}]}, {"nombre": "Javier Serrano", "equipo": "Brújula", "puesto": "refutador1", "puntos": 0, "nominaciones": 0, "notas": [3.7], "media": 3.7, "slug": "javier-serrano", "puesto_txt": "Refutación 1", "intervenciones": [{"ronda": "Ronda 1", "sala": "Sala 1", "enlace": "rondas/R1/R1D1/visor.html", "fase": "Examen cruzado a Kairós (en contra)", "n": 4, "nota": null, "turnos": [{"nombre": "Noelia Cano", "tipo": "pregunta", "texto": "Valeria, en ese ensayo de PNAS, los alumnos que usaron el tutor diseñado, ¿también sacaron un diecisiete por ciento menos cuando se lo quitaron?", "mio": false}, {"nombre": "Valeria Domínguez", "tipo": "respuesta", "texto": "No, Noelia, y lo he dicho: el tutor diseñado frenó la caída. Pero tampoco mejoró. No superaron a quienes nunca lo tuvieron, y aun así creyeron que habían rendido mejor [3853]. Unos manguitos que no hunden, pero que tampoco enseñan a nadar.", "mio": false}, {"nombre": "Óscar Román", "tipo": "pregunta", "texto": "Valeria, si mañana un instituto prohíbe la inteligencia artificial, ¿el alumno deja de tenerla en el móvil por la tarde, o la sigue usando, pero sin ningún profesor delante?", "mio": false}, {"nombre": "Valeria Domínguez", "tipo": "respuesta", "texto": "La sigue usando, Óscar, y no venimos a prohibir. Pero inevitable no es lo mismo que beneficioso. El GPS también está en todos los móviles, y quien más lo usa peor se orienta sin él [3855]. La pregunta es si le enseña.", "mio": false}, {"nombre": "Javier Serrano", "tipo": "pregunta", "texto": "Vuestra vara mira al alumno sin la herramienta. Si el profesor recupera casi una de cada tres tardes de preparación, ¿eso cuenta como beneficio para el sistema o no?", "mio": true}, {"nombre": "Valeria Domínguez", "tipo": "respuesta", "texto": "Cuenta, Javier, y lo concedo, es un beneficio, pero es un medio. La tarde que gana el profesor se pierde si su alumno, en casa, le pide la solución completa, como uno de cada tres [3864]. Lo que el sistema produce se mide en el alumno.", "mio": false}, {"nombre": "Laura Pérez", "tipo": "pregunta", "texto": "Valeria, dijiste que juzgáis el ChatGPT del móvil a solas. Una herramienta que elige el centro y guía un profesor, ¿queda fuera de vuestro debate o también la juzgáis?", "mio": false}, {"nombre": "Valeria Domínguez", "tipo": "respuesta", "texto": "También la juzgamos, Laura. Y tampoco aprueba nuestra prueba, porque en PNAS el tutor diseñado frenó la caída, pero no mejoró el examen [3853]. Y en primaria, más de ocho de cada diez docentes señalan que les faltan conocimientos [3861]. Ese profesor guía, hoy, todavía falta.", "mio": false}]}, {"ronda": "Ronda 1", "sala": "Sala 1", "enlace": "rondas/R1/R1D1/visor.html", "fase": "Primera refutación de Brújula (a favor)", "n": 5, "nota": 3.7, "turnos": [{"nombre": "Javier Serrano", "tipo": "discurso", "texto": "Valeria nos ha traído unos manguitos, y los manguitos tienen algo que ella no ha contado. Nadie se los pone a un niño para dejarlo solo en la piscina. Al lado siempre hay alguien mirando. Y esa es la pregunta de esta tarde, la que os dejaba Noelia, con profesor o sin él. Voy a responder a los manguitos, después volveré al tiempo y al refuerzo, y os haré la pregunta que hago siempre en un claustro, quién lo paga, quién lo forma y cuándo.\n\nEmpiezo por lo que Kairós concedió en el examen cruzado, que es mucho. Valeria le dijo a Óscar que no vienen a prohibir y que el alumno la sigue usando. Y a mí me reconoció que la tarde que gana el profesor «cuenta, y lo concedo, es un beneficio». Añadió que es un medio, y enseguida veremos adónde lleva. Pero fijaos en lo primero. Si nadie le va a quitar la herramienta al alumno, la prueba de los manguitos no compara inteligencia artificial contra nada. Compara un niño con manguitos y socorrista contra un niño con manguitos y solo.\n\nY su dato estrella lo confirma. Ese diecisiete por ciento menos del ensayo de PNAS [3613] sale del ChatGPT sin barreras, el del alumno solo en casa, el que nosotros no defendemos. Con un tutor diseñado para guiar, el mismo estudio dice que ese daño se mitiga en gran medida. Así que su mejor prueba no dice que cerremos la piscina. Dice que pongamos a alguien en el borde. Si Kairós quiere, acepto aquí su pregunta.", "mio": true}, {"nombre": "Julia Arnau", "tipo": "interpelacion", "texto": "Ese diecisiete por ciento salió de sesiones de práctica en un instituto, no de deberes en casa. ¿Dónde dice el estudio que el alumno estuviera solo en casa?", "mio": false}, {"nombre": "Javier Serrano", "tipo": "respuesta", "texto": "Tienes razón, Julia, fueron sesiones en el instituto, no en casa, y lo corrijo. Pero lo que cambió el resultado no fue el sitio, sino el diseño. Con un tutor que guía, el daño se mitiga en gran medida [3613].", "mio": true}, {"nombre": "Javier Serrano", "tipo": "discurso", "texto": "Y fijaos en lo que significa. Si hasta dentro del instituto un ChatGPT sin barreras hace daño, dejarlo solo en el móvil no lo arregla. Lo arregla elegir bien qué herramienta entra en clase y quién la guía.\n\nVamos a lo que Valeria llamó un medio. Lo es, pero ¿un medio para qué? Para corregir con calma, preparar otra ficha al chico que va perdido y llamar a su madre. Eso cuentan los docentes en la encuesta de Gallup, seis semanas por curso para atender mejor a cada alumno y a las familias [3602]. Y con una norma de centro clara, que no cuesta un euro, el ahorro crece una cuarta parte [3603].\n\nLo segundo es el refuerzo, y sobre él Kairós aún no ha dicho nada. En Nigeria, con un profesor guiando, seis semanas valieron por año y medio o dos de escuela normal [3604]. Y en un ensayo de Stanford, con un copiloto de inteligencia artificial para tutores de carne y hueso, ganaron más los alumnos de los tutores más flojos [3606]. Y ahora, mi pregunta de claustro. ¿Quién lo paga? La administración, a nueve dólares por alumno adicional [3605], frente a la academia que hoy pagan casi la mitad de las familias [3607]. Kairós, acepto vuestra segunda pregunta.", "mio": true}, {"nombre": "Valeria Domínguez", "tipo": "interpelacion", "texto": "Habéis preguntado quién lo forma. En primaria, más de ocho de cada diez docentes dicen que les faltan conocimientos. Hoy, en un aula española, ¿quién es ese socorrista en el borde?", "mio": false}, {"nombre": "Javier Serrano", "tipo": "respuesta", "texto": "El profesor que ya está en el aula, Valeria. Que diga que le falta formación no es motivo para cerrar la piscina, sino para formarlo, y en Nigeria bastaron tres días [3610].", "mio": true}, {"nombre": "Javier Serrano", "tipo": "discurso", "texto": "Eso es quién lo forma. ¿Y cuándo? Ya, porque el alumno, como reconoció Valeria, la sigue usando esta tarde. Ella misma lo dijo, «lo que nadie nota, nadie lo corrige». Exacto. Por eso hace falta alguien que lo note, un profesor formado, no un chaval solo con el móvil. Según TALIS, solo uno de cada diez docentes dice que se la prohíben [3609]. El freno es la formación, y eso tiene arreglo.\n\nValeria nos habló de una imprenta en un pueblo donde nadie sabe leer. Es verdad. Pero nadie cerró la imprenta. Se abrieron escuelas.\n\nAsí que la elección no es manguitos sí o no. Es con profesor o sin él. Con profesor, la tarde vuelve, el refuerzo deja de depender del bolsillo y el daño se frena. Sin él, el alumno sigue con manguitos y solo en el agua, y la profesora con su taco de fotocopias, el mismo para los treinta. Por eso, sí.", "mio": true}]}, {"ronda": "Ronda 1", "sala": "Sala 1", "enlace": "rondas/R1/R1D1/visor.html", "fase": "Segunda refutación de Kairós (en contra)", "n": 8, "nota": null, "turnos": [{"nombre": "Julia Arnau", "tipo": "discurso", "texto": "Laura nos ha llevado al polideportivo, y allí, al final del verano, hay una prueba muy sencilla. El monitor le quita los manguitos al niño y mira si nada. No le pregunta cuánto ha flotado ni cuánto costó el cursillo. Mira si nada. Y ahí está todo este debate. La pregunta no es qué hace la inteligencia artificial por el alumno, sino qué sabe el alumno cuando se la quitan.\n\nLaura ha dejado tres choques y los recojo en su orden, si enseña o solo hace flotar, quién paga lo de Lucía y quién hace hoy de monitor.\n\nEl primero lo ha resuelto la propia Laura. Valeria le preguntó qué marcaba la diferencia en Nigeria, y Laura respondió que «el profesor marca la diferencia y la herramienta la multiplica». Pero cuando se midió la herramienta frente a quienes no la tenían, en el ensayo de PNAS, ni el tutor diseñado para guiar mejoró el examen [3853]. Y algo que multiplica y deja el examen igual está multiplicando por uno. Dicho de otra forma, lo que enseña a nadar es el monitor, no el manguito.\n\nLaura le respondió a Tomás que con azúcar nadie avanza año y medio. Cierto, pero el placebo de Tomás no era Nigeria. Era ese tutor de PNAS, que dejó el examen igual y al alumno convencido de haber mejorado [3853]. Y la única prueba que han traído de que el alumno acabe nadando solo es Nigeria, y en Nigeria, como dice Laura, el profesor marca la diferencia. Brújula, si queréis, os dejo la palabra.", "mio": false}, {"nombre": "Javier Serrano", "tipo": "interpelacion", "texto": "Julia, en Nigeria se comparó con escuela normal, que también tiene profesor. Si el profesor estaba en los dos grupos, ¿qué produjo el año y medio de diferencia?", "mio": true}, {"nombre": "Julia Arnau", "tipo": "respuesta", "texto": "Todo un programa, Javier. Sesiones de tutoría, un profesor formado y una herramienta diseñada, frente a clase normal. Así contado, no sabemos qué parte pone la máquina. Donde se comparó con y sin ella, en PNAS, el tutor diseñado no mejoró el examen [3853].", "mio": false}, {"nombre": "Julia Arnau", "tipo": "discurso", "texto": "Y fijaos en lo que revela la pregunta de Javier. Para defender Nigeria hace falta un programa entero alrededor de la máquina. Esa es la clave del segundo choque, el de Lucía y los nueve dólares.\n\nLaura dice que a los nueve dólares nadie ha contestado. Contesto. Es un precio por alumno adicional, lo que cuesta sumar un chaval más a un programa ya montado, con su diseño y su profesor formado. Montar el programa es otra cuenta, y en España está sin hacer, porque el profesor dice que su primera barrera es la falta de conocimientos [3861]. Nueve dólares es el precio del manguito cuando el socorrista ya está en el borde. Aquí todavía no ha llegado.\n\nLaura nos acusa de dejarle a Lucía el primo listo. No, Laura. El primo listo ya está en su móvil, como dijo Noelia, y casi uno de cada tres alumnos europeos le pide la solución completa [3864]. Que sea inevitable no lo hace beneficioso. En junio nadie le preguntará a Lucía qué entregó con el móvil, sino si sabe hacer fracciones. Porque la pregunta no es qué hace la inteligencia artificial por Lucía, sino qué sabe Lucía cuando se la quitan. Brújula, os dejo la palabra.", "mio": false}, {"nombre": "Laura Pérez", "tipo": "interpelacion", "texto": "Julia, dices que donde se comparó con y sin máquina no mejoró. En Stanford, con el mismo tutor humano, ¿sus alumnos dominaron más temas cuando ese tutor usaba inteligencia artificial, sí o no?", "mio": false}, {"nombre": "Julia Arnau", "tipo": "respuesta", "texto": "Sí, Laura, no lo discuto. Pero la usaba el tutor, que ya sabe nadar, no el alumno. Es la calculadora en manos de quien ya sabe sumar. Con el manguito en el brazo del alumno, en PNAS, el examen no mejoró [3853].", "mio": false}, {"nombre": "Julia Arnau", "tipo": "discurso", "texto": "Y si la máquina funciona en manos de quien ya sabe, queda el último choque, quién hace hoy de monitor. Que casi nadie la tenga prohibida no significa saber usarla, y en primaria más de ocho de cada diez docentes dicen que les faltan conocimientos [3861]. Los tres días de Nigeria formaban para un programa ya montado. Aquí no hay programa, y Europa no garantiza ningún nivel de formación [3863]. Y mientras tanto, dice Laura, Lucía sigue sola con el móvil. Exacto. Esa es la inteligencia artificial que hoy entra en el sistema.\n\nRecapitulo. Enseña el monitor, no el manguito. Los nueve dólares pagan un programa que aquí no existe. Y el monitor dice que aún no sabe.\n\nAl final del verano le quitarán los manguitos a Lucía. Y la pregunta no es qué hace la inteligencia artificial por el alumno, sino qué sabe el alumno cuando se la quitan. Flotar no es nadar. Por eso, no.", "mio": false}]}], "feedbacks": [{"ronda": "Ronda 1", "sala": "Sala 1", "enlace": "rondas/R1/R1D1/visor.html", "contexto": "a favor, contra Kairós", "jueces": [{"juez": "Carmen Llorens", "titulo": "jueza de fondo", "texto": "Javier Serrano."}, {"juez": "Álex Moreno", "titulo": "juez de forma", "texto": "Javier Serrano: muy buena estructura con la «pregunta de claustro» (quién lo paga, quién lo forma, cuándo), y la réplica a los manguitos («nadie deja al niño solo») es eficaz. «Nadie cerró la imprenta. Se abrieron escuelas» es la mejor frase de tu turno. Corregiste el error con elegancia. A mejorar: revisa la ficha antes de describirla, porque PNAS eran sesiones en el instituto y no deberes en casa, y el rival lo recordó varias veces. Usa menos citas seguidas. Cuando el rival concede un beneficio, sopésalo de forma explícita frente a su daño en lugar de solo anotarlo."}, {"juez": "Isabel Garrigós", "titulo": "jueza principal", "texto": "Javier Serrano (refutador 1). Muy buen giro de los manguitos (al lado siempre hay alguien mirando), gran uso de las concesiones y una estructura memorable: quién lo paga, quién lo forma y cuándo. A mejorar, y es lo más importante: no adornéis nunca una evidencia. Lo de «solo en casa» no estaba en el estudio, y la corrección en directo os costó credibilidad justo en vuestra respuesta a la prueba central del rival. Antes de describir el contexto de un estudio (dónde, quién, cómo), comprobadlo en la ficha. Supiste rectificar con elegancia, y eso está bien."}], "equipo": "**Carmen Llorens (jueza de fondo):** **Equipo.** Construisteis el caso sobre evidencias sólidas y variadas (varios ensayos aleatorizados, datos oficiales españoles) y las usasteis con prudencia: «saldo positivo, no riesgo cero», «se mitigó, no os lo vendo como mejora». Sacasteis concesiones claras y las recordasteis hasta el final. Puntos a mejorar: (1) Vuestra definición compara «con IA frente a sin IA», pero vuestro criterio compara «con profesor frente a sin profesor». Son comparaciones distintas, y el rival os lo señaló con «inevitable no es beneficioso». Elegid una y justificadla. (2) Jugasteis casi todo el debate en la imagen del rival, los manguitos. Volved antes a la vuestra. (3) Cuando el rival matiza un dato vuestro, reconoced el dato completo en lugar de pedirle una cifra a él.\n\n**Noelia Cano.** Exordio muy original: dar la vuelta a la portada (el blíster es la fotocopia, no el chatbot) es contextualizar de verdad, no repetir la carta. Definiciones claras y tres pasos fáciles de seguir. En el examen cruzado respondiste con honestidad y con dato. A mejorar: al aceptar «lo que sabe cuando se la quitan» le diste al rival su vara. Puedes aceptarla, pero añade «y también lo que gana el sistema a través del profesor», para que el tiempo docente entre en el criterio. «De cada tres tardes, casi una vuelve» estira el dato del 31% de planificación: cíñete a él.\n\n**Javier Serrano.** Recoger las concesiones del examen cruzado y darle la vuelta al estudio de PNAS fue muy eficaz, y tu interpelación sobre el grupo de control de Nigeria fue la pregunta más afilada del debate. A mejorar: el «solo en casa» no estaba en la ficha. Comprueba el contexto de cada estudio antes de caracterizarlo (la rectificación, eso sí, fue impecable). Respondiste a pocas piezas del rival: el GPS es una analogía y el 31% no es «el uso». «No cuesta un euro» es un añadido sin prueba.\n\n**Laura Pérez.** Muy buena organización por choques, y Lucía hace concreto el argumento de equidad. Tu pregunta sobre Stanford fue decisiva. A mejorar: «el profesor marca la diferencia y la herramienta la multiplica» le regaló al rival el «multiplica por uno». Tu propia ficha [3610] dice que en Nigeria los docentes no impartían instrucción directa: úsala. En el choque de los 9 dólares, reconoce los 48 y 124 dólares de tu ficha; seguían siendo más baratos que una academia y habrías cerrado el choque con honestidad. El rival aplica una doble vara («vuestros pilotos, nuestro lunes», cuando PNAS también es un experimento) y no la aprovechaste.\n\n**Óscar Román.** Cierre circular con el taco de fotocopias, y la imagen de las tres fichas y la llamada a la familia de Aitana es concreta y emotiva. Repasaste bien las concesiones. Tu pregunta en el examen cruzado sacó un «no venimos a prohibir» muy útil. A mejorar: «formada en días» exagera, porque esos tres días eran para un programa ya montado. Contra el «ojalá» tenías la mejor respuesta y no la pusiste delante: el ensayo inglés solo necesitó ChatGPT y una guía. Es un beneficio de hoy que no depende de ningún monitor. «Esperar sin hacer nada» atribuye al rival una carga que no tiene.\n\n**Álex Moreno (juez de forma):** Equipo: muy cohesionados. Os citáis entre vosotros (el «con profesor o sin él» de Noelia vuelve en todos) y el taco de fotocopias abre y cierra el debate. El mayor margen de mejora está en el marco. Dejasteis que la metáfora del rival (manguitos, socorristas) ocupara toda la tarde. Reclamad antes vuestra imagen en las refutaciones, no solo en la conclusión. Os quedaron sin responder los detectores [3862], el GPS y el aplazamiento europeo [3863]. Tampoco usasteis que PNAS también es un experimento controlado, igual que los «pilotos» que os reprochaban.\n\nNoelia Cano: apertura brillante. Usar la portada de la carta para decir que lo que trata a todos igual es la fotocopia, y no el chatbot, es original y engancha desde la primera frase. Definiciones limpias («saldo positivo, no riesgo cero»). A mejorar: el bloque central amontona ocho fichas en cuatro minutos. Elegid cuatro o cinco y dejad que cada una respire, como hiciste con «de cada tres tardes, casi una vuelve». En el examen cruzado, antes de aceptar un criterio del rival, reformúlalo en vuestros términos (por ejemplo: «lo que sabe sin ella, y también lo que gana el sistema con el tiempo del profesor»). Aceptarlo tal cual le dio al rival la vara para todo el debate.\n\nJavier Serrano: muy buena estructura con la «pregunta de claustro» (quién lo paga, quién lo forma, cuándo), y la réplica a los manguitos («nadie deja al niño solo») es eficaz. «Nadie cerró la imprenta. Se abrieron escuelas» es la mejor frase de tu turno. Corregiste el error con elegancia. A mejorar: revisa la ficha antes de describirla, porque PNAS eran sesiones en el instituto y no deberes en casa, y el rival lo recordó varias veces. Usa menos citas seguidas. Cuando el rival concede un beneficio, sopésalo de forma explícita frente a su daño en lugar de solo anotarlo.\n\nLaura Pérez: la oradora más completa de vuestro lado. Lucía convierte la estadística en una persona, el polideportivo le da la vuelta a la metáfora del rival y respondiste a las interpelaciones con evidencia (Stanford) sin perder el hilo. A mejorar: en la refutación cruzada citaste seis fichas en 90 segundos, y en ese turno el jurado necesita una idea por choque. El argumento de Stanford es vuestra mejor arma contra la vara del rival: dilo pronto y sin rodeos («esos alumnos nunca tocaron la IA y aprendieron más: pasan vuestra prueba»).\n\nÓscar Román: gran cierre. Volviste a la fotocopiadora y la escena de Lucía, Hugo y Aitana se recuerda. «Esperar sin hacer nada es un ojalá. Formar al profesor que ya está en el aula es un plan» es un giro excelente. Tu interpelación («¿placebo o saldo positivo?») fue de las mejores preguntas del debate. A mejorar: no vuelvas a aceptar en la conclusión la vara del rival, reformúlala. Recupera tu propia interpelación para sopesar el tiempo del profesor frente a la ilusión de aprendizaje, que fue el punto en el que el rival os apretó.\n\n**Isabel Garrigós (jueza principal):** **En equipo.** El caso es sólido y muy bien estructurado: tiempo, refuerzo e implantación, con un criterio claro (la prueba del lunes) y evidencias variadas y de peso (Inglaterra, Gallup, Banco Mundial, Stanford, EsadeEcPol, TALIS). Supisteis sacar concesiones en los exámenes cruzados y en las interpelaciones y volver a ellas en cada turno. Tenéis tres cosas que mejorar. (1) Acabasteis debatiendo dentro de la metáfora del rival (la piscina): si traéis una imagen propia (el taco de fotocopias, que era muy buena), mantenedla viva en las refutaciones. (2) Vuestra mejor respuesta al «es un ojalá» era que el ahorro de tiempo docente es de hoy y no necesita formación especial (Inglaterra: solo ChatGPT y una guía). Apareció en el examen cruzado y luego desapareció. (3) La carta habla de evaluación, de normativa europea y de protección de datos de menores, y teníais fichas para eso ([3612], [3614]) que no usasteis.\n\n**Noelia Cano (introductora).** El comienzo es excelente: resignificar la portada (lo que uniforma es la fotocopia, no el chatbot) contextualiza y engancha a la vez. Las definiciones son precisas y el criterio es claro, y las respuestas del examen cruzado fueron honestas y con evidencia («Hoy, Julia», y separar mitigación de mejora). A mejorar: cuando os pregunten por la vara, respondedla sin entregarla del todo. Algo como «las dos cosas: lo que sabe sin ella y lo que aprende con ella guiado» os habría evitado que el rival construyera todo su caso con vuestras palabras.\n\n**Javier Serrano (refutador 1).** Muy buen giro de los manguitos (al lado siempre hay alguien mirando), gran uso de las concesiones y una estructura memorable: quién lo paga, quién lo forma y cuándo. A mejorar, y es lo más importante: no adornéis nunca una evidencia. Lo de «solo en casa» no estaba en el estudio, y la corrección en directo os costó credibilidad justo en vuestra respuesta a la prueba central del rival. Antes de describir el contexto de un estudio (dónde, quién, cómo), comprobadlo en la ficha. Supiste rectificar con elegancia, y eso está bien.\n\n**Laura Pérez (refutadora 2 y de la refutación cruzada).** La interpelación sobre Stanford es de lo mejor del debate: corta, cerrada y con una concesión que pesó. Recorriste los choques en orden, devolviste la pregunta de Valeria y Lucía funciona como relato. A mejorar: cuando el rival ataca una cifra (los 9 $ marginales), contestad con la cifra completa, que también está en vuestra ficha: 48 $ por alumno en el piloto frente al coste de una academia. «No han dado ninguna cifra» traslada la carga. Y en la refutación cruzada no recortéis la precisión («por alumno adicional»), porque ahí es donde más se nota.\n\n**Óscar Román (conclusor).** Buena pregunta en el examen cruzado (prohibir no quita la herramienta) y un final muy visual y emotivo: tres fichas, la madre de Aitana, Lucía en junio. Cerraste el círculo con el taco. A mejorar: pondera de forma explícita contra el marco del rival. Si os dicen «beneficios de piloto», contestad que PNAS también es un experimento y que Inglaterra y Gallup son uso real. Apoyarse en «el rival no propone nada» rinde poco, porque el en contra no necesita plan. Lo que convence es demostrar por qué el saldo ya es positivo hoy."}]}, {"nombre": "Clara Benlloch", "equipo": "Ágora", "puesto": "introductor", "puntos": 0, "nominaciones": 0, "notas": [], "media": null, "slug": "clara-benlloch", "puesto_txt": "Introducción", "intervenciones": [], "feedbacks": []}, {"nombre": "Íñigo Saldaña", "equipo": "Ágora", "puesto": "refutador1", "puntos": 0, "nominaciones": 0, "notas": [], "media": null, "slug": "inigo-saldana", "puesto_txt": "Refutación 1", "intervenciones": [], "feedbacks": []}, {"nombre": "Marta Quiles", "equipo": "Ágora", "puesto": "refutador2", "puntos": 0, "nominaciones": 0, "notas": [], "media": null, "slug": "marta-quiles", "puesto_txt": "Refutación 2 y 3", "intervenciones": [], "feedbacks": []}, {"nombre": "Joaquín Ferrándiz", "equipo": "Ágora", "puesto": "conclusor", "puntos": 0, "nominaciones": 0, "notas": [], "media": null, "slug": "joaquin-ferrandiz", "puesto_txt": "Conclusión", "intervenciones": [], "feedbacks": []}, {"nombre": "Sofía Llorca", "equipo": "Método", "puesto": "introductor", "puntos": 0, "nominaciones": 0, "notas": [], "media": null, "slug": "sofia-llorca", "puesto_txt": "Introducción", "intervenciones": [], "feedbacks": []}, {"nombre": "Daniel Mira", "equipo": "Método", "puesto": "refutador1", "puntos": 0, "nominaciones": 0, "notas": [], "media": null, "slug": "daniel-mira", "puesto_txt": "Refutación 1", "intervenciones": [], "feedbacks": []}, {"nombre": "Paula Esteve", "equipo": "Método", "puesto": "refutador2", "puntos": 0, "nominaciones": 0, "notas": [], "media": null, "slug": "paula-esteve", "puesto_txt": "Refutación 2 y 3", "intervenciones": [], "feedbacks": []}, {"nombre": "Héctor Molina", "equipo": "Método", "puesto": "conclusor", "puntos": 0, "nominaciones": 0, "notas": [], "media": null, "slug": "hector-molina", "puesto_txt": "Conclusión", "intervenciones": [], "fe , "puesto_txt": "Introducción", "intervenciones": [], "feedbacks": []}, {"nombre": "Sergio Mas", "equipo": "Contrapunto", "puesto": "refutador1", "puntos": 0, "nominaciones": 0, "notas": [], "media": null, "slug": "sergio-mas", "puesto_txt": "Refutación 1", "intervenciones": [], "feedbacks": []}, {"nombre": "Alba Ruiz", "equipo": "Contrapunto", "puesto": "refutador2", "puntos": 0, "nominaciones": 0, "notas": [], "media": null, "slug": "alba-ruiz", "puesto_txt": "Refutación 2 y 3", "intervenciones": [], "feedbacks": []}, {"nombre": "Víctor Ortega", "equipo": "Contrapunto", "puesto": "conclusor", "puntos": 0, "nominaciones": 0, "notas": [], "media": null, "slug": "victor-ortega", "puesto_txt": "Conclusión", "intervenciones": [], "feedbacks": []}, {"nombre": "Ainhoa Martí", "equipo": "Faro", "puesto": "introductor", "puntos": 0, "nominaciones": 0, "notas": [], "media": null, "slug": "ainhoa-marti", "puesto_txt": "Introducción", "intervenciones": [], "feedbacks": []}, {"nombre": "Hugo Bravo", "equipo": "Faro", "puesto": "refutador1", "puntos": 0, "nominaciones": 0, "notas": [], "media": null, "slug": "hugo-bravo", "puesto_txt": "Refutación 1", "intervenciones": [], "feedbacks": []}, {"nombre": "Candela Ríos", "equipo": "Faro", "puesto": "refutador2", "puntos": 0, "nominaciones": 0, "notas": [], "media": null, "slug": "candela-rios", "puesto_txt": "Refutación 2 y 3", "intervenciones": [], "feedbacks": []}, {"nombre": "Samuel Ibarra", "equipo": "Faro", "puesto": "conclusor", "puntos": 0, "nominaciones": 0, "notas": [], "media": null, "slug": "samuel-ibarra", "puesto_txt": "Conclusión", "intervenciones": [], "feedbacks": []}], "volver": "torneo.html"}</script>
<script>
(function(){
  var D = JSON.parse(document.getElementById('datos').textContent);
  document.getElementById('volver').href = D.volver;
  var esc = function(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
  var ACC = {pregunta:'pregunta', respuesta:'responde', interpelacion:'interpela'};
  var porEquipo = {};
  D.oradores.forEach(function(o){ (porEquipo[o.equipo] = porEquipo[o.equipo] || []).push(o); });
  var lista = document.getElementById('lista'), elegir = document.getElementById('elegir');
  Object.keys(porEquipo).sort().forEach(function(eq){
    lista.insertAdjacentHTML('beforeend', '<div class=eq>' + esc(eq) + '</div>' + porEquipo[eq].map(function(o){
      return '<a href="#' + o.slug + '" data-s="' + o.slug + '">' + esc(o.nombre) + ' <small>' + o.puntos + ' pts</small></a>'; }).join(''));
    elegir.insertAdjacentHTML('beforeend', '<optgroup label="' + esc(eq) + '">' + porEquipo[eq].map(function(o){
      return '<option value="' + o.slug + '">' + esc(o.nombre) + ' · ' + o.puntos + ' pts</option>'; }).join('') + '</optgroup>');
  });
  elegir.addEventListener('change', function(){ location.hash = elegir.value; });
  function texto(t){ return esc(t).split(/\n\s*\n/).join('<br><br>'); }
  function pinta(){
    var s = location.hash.slice(1) || (D.oradores[0] && D.oradores[0].slug);
    var o = D.oradores.filter(function(x){ return x.slug === s; })[0] || D.oradores[0];
    if (!o) return;
    Array.prototype.forEach.call(lista.querySelectorAll('a'), function(a){ a.classList.toggle('on', a.dataset.s === o.slug); });
    elegir.value = o.slug;
    var h = '<section class=ficha><h2>' + esc(o.nombre) + '</h2><p class=muted>' + esc(o.equipo) + ' · ' + esc(o.puesto_txt) + ' · ' + o.puntos + ' puntos de orador · ' + o.nominaciones + ' nominaciones a mejor de su puesto · nota media ' + (o.media == null ? '–' : o.media) + '</p></section>';
    if (!o.intervenciones.length) h += '<p class=muted>Todavía no tiene intervenciones en debates terminados.</p>';
    function md(t){ return esc(t).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').split(/\n\s*\n|\n(?=\s*[-•])/).join('<br>'); }
    (o.feedbacks || []).forEach(function(fb){
      h += '<article class=fb><h3>Feedback de los jueces · ' + esc(fb.ronda) + ' · ' + esc(fb.sala) + ' <span class=muted>(' + esc(fb.contexto) + ')</span> <a href="' + esc(fb.enlace) + '">Ver en la sala</a></h3>' +
        (fb.jueces.length ? fb.jueces.map(function(j){ return '<div class="tu juez"><span class=who>' + esc(j.juez) + ' · ' + esc(j.titulo) + '</span>' + md(j.texto) + '</div>'; }).join('')
          : '<p class=muted>Ningún juez le dedicó un comentario con su nombre; mira el feedback al equipo.</p>') +
        '<details><summary>Feedback completo al equipo</summary><div class="tu otro">' + md(fb.equipo) + '</div></details></article>';
    });
    o.intervenciones.forEach(function(iv){
      h += '<article><h3>' + esc(iv.ronda) + ' · ' + esc(iv.sala) + ' · ' + esc(iv.fase) + (iv.nota != null ? ' <span class=nota>' + iv.nota + '/5</span>' : '') + ' <a href="' + esc(iv.enlace) + '">Ver en la sala</a></h3>' +
        iv.turnos.map(function(t){ return '<div class="tu ' + (t.mio ? 'mio' : 'otro') + '"><span class=who>' + esc(t.nombre) + (ACC[t.tipo] ? ' · ' + ACC[t.tipo] : '') + '</span>' + texto(t.texto) + '</div>'; }).join('') + '</article>';
    });
    document.getElementById('detalle').innerHTML = h;
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', pinta); pinta();
})();
</script></body></html>
