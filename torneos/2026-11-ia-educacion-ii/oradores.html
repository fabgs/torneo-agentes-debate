<script type="application/json" id=datos>{"oradores": [{"nombre": "Laura Pérez", "equipo": "Brújula", "puesto": "refutador2", "puntos": 7, "nominaciones": 1, "notas": [4.7, 4.0], "media": 4.35, "slug": "laura-perez", "puesto_txt": "Refutación 2 y 3", "intervenciones": [{"ronda": "Ronda 1", "sala": "Sala 1", "enlace": "rondas/R1/R1D1/visor.html", "fase": "Examen cruzado a Kairós (en contra)", "n": 4, "nota": null, "turnos": [{"nombre": "Noelia Cano", "tipo": "pregunta", "texto": "Valeria, en ese ensayo de PNAS, los alumnos que usaron el tutor diseñado, ¿también sacaron un diecisiete por ciento menos cuando se lo quitaron?", "mio": false}, {"nombre": "Valeria Domínguez", "tipo": "respuesta", "texto": "No, Noelia, y lo he dicho: el tutor diseñado frenó la caída. Pero tampoco mejoró. No superaron a quienes nunca lo tuvieron, y aun así creyeron que habían rendido mejor [3853]. Unos manguitos que no hunden, pero que tampoco enseñan a nadar.", "mio": false}, {"nombre": "Óscar Román", "tipo": "pregunta", "texto": "Valeria, si mañana un instituto prohíbe la inteligencia artificial, ¿el alumno deja de tenerla en el móvil por la tarde, o la sigue usando, pero sin ningún profesor delante?", "mio": false}, {"nombre": "Valeria Domínguez", "tipo": "respuesta", "texto": "La sigue usando, Óscar, y no venimos a prohibir. Pero inevitable no es lo mismo que beneficioso. El GPS también está en todos los móviles, y quien más lo usa peor se orienta sin él [3855]. La pregunta es si le enseña.", "mio": false}, {"nombre": "Javier Serrano", "tipo": "pregunta", "texto": "Vuestra vara mira al alumno sin la herramienta. Si el profesor recupera casi una de cada tres tardes de preparación, ¿eso cuenta como beneficio para el sistema o no?", "mio": false}, {"nombre": "Valeria Domínguez", "tipo": "respuesta", "texto": "Cuenta, Javier, y lo concedo, es un beneficio, pero es un medio. La tarde que gana el profesor se pierde si su alumno, en casa, le pide la solución completa, como uno de cada tres [3864]. Lo que el sistema produce se mide en el alumno.", "mio": false}, {"nombre": "Laura Pérez", "tipo": "pregunta", "texto": "Valeria, dijiste que juzgáis el ChatGPT del móvil a solas. Una herramienta que elige el centro y guía un profesor, ¿queda fuera de vuestro debate o también la juzgáis?", "mio": true}, {"nombre": "Valeria Domínguez", "tipo": "respuesta", "texto": "También la juzgamos, Laura. Y tampoco aprueba nuestra prueba, porque en PNAS el tutor diseñado frenó la caída, pero no mejoró el examen [3853]. Y en primaria, más de ocho de cada diez docentes señalan que les faltan conocimientos [3861]. Ese profesor guía, hoy, todavía falta.", "mio": false}]}, {"ronda": "Ronda 1", "sala": "Sala 1", "enlace": "rondas/R1/R1D1/visor.html", "fase": "Primera refutación de Kairós (en contra)", "n": 6, "nota": null, "turnos": [{"nombre": "Tomás Lledó", "tipo": "discurso", "texto": "Javier nos ha dicho que a un niño con manguitos nadie lo deja solo, que al lado siempre hay alguien mirando. Tiene razón. Pero fijaos en qué hace ese alguien. El socorrista no te enseña a nadar, vigila que no te ahogues. Y eso, exactamente eso, es lo que Brújula nos ha ofrecido esta tarde.\n\nOs propongo tres paradas. Primero, el socorrista, es decir, su tutor bien diseñado. Después, el refuerzo de Nigeria y quién hace hoy de socorrista en España. Y al final, por qué el manguito sigue intacto.\n\nEmpiezo por el socorrista. Javier dice que con un tutor que guía el daño se mitiga. Mitiga, no mejora. Se lo pregunté a Noelia y me respondió con una honestidad que le agradezco, «se mitigó, Tomás, y no os lo vendo como mejora». El ensayo de PNAS, el mismo que citó Noelia, lo confirma. Los del tutor diseñado no rindieron mejor que quienes nunca lo tuvieron, y aun así creyeron que sí [3853].\n\nY ahora medidlo con su propia vara. Javier dice que nadie le va a quitar la herramienta al alumno. Se la quita cada examen, y Noelia aceptó que eso es lo que cuenta. Pues en su mejor versión, con barreras y en un aula, el examen sin la herramienta no mejora. Y una herramienta que, bien diseñada, te deja igual y encima te convence de que has mejorado no es beneficiosa. Es un placebo con wifi. Y como esto os toca de lleno, Brújula, os dejo la palabra.", "mio": false}, {"nombre": "Laura Pérez", "tipo": "interpelacion", "texto": "Tomás, dices que con barreras el examen no mejora. En Nigeria, con un profesor guiando, ¿los alumnos se quedaron igual o avanzaron lo de año y medio de escuela?", "mio": true}, {"nombre": "Tomás Lledó", "tipo": "respuesta", "texto": "Avanzaron, Laura, no lo discuto. Con un profesor que guiaba y vigilaba, como dijo Noelia. Eso es una clase con monitor, no el manguito del bolsillo. ¿Y dónde está hoy ese monitor en España?", "mio": false}, {"nombre": "Tomás Lledó", "tipo": "discurso", "texto": "Y Laura me lleva a la segunda parada, el refuerzo, que Javier nos echaba en cara. Noelia nos pidió pensar en lo que cuesta una hora de academia. Pensémoslo. La academia cuesta porque alguien se sienta a tu lado y no te deja copiar. Lo gratis, lo que el chaval sin academia tiene esta noche, no es el programa de Nigeria. Es la aplicación del móvil. Y según la OCDE, casi uno de cada tres alumnos europeos, españoles incluidos, le pide la solución completa [3864]. Un profesor particular que te hace los deberes no es un profesor. Es un primo listo.\n\n¿Y quién hace hoy de monitor en España? Javier le contestó a Valeria que el profesor que ya está en el aula. Pero ese profesor nos dice que todavía no sabe nadar en esta piscina. Según TALIS 2024, la falta de conocimientos es su primera barrera, y en primaria la señalan más de ocho de cada diez [3861]. ¿Y quién garantiza que lo formen? Europa no, porque su reglamento, reformado este julio, se conforma con promover la alfabetización, sin garantizar ningún nivel [3863].\n\nJavier decía que nadie cerró la imprenta, que se abrieron escuelas. Exacto, Javier. Primero las escuelas. Lo que nos pedís es aplaudir la imprenta con la escuela todavía en obras. Y como sé que aquí tenéis algo que decir, Brújula, os escucho.", "mio": false}, {"nombre": "Óscar Román", "tipo": "interpelacion", "texto": "Tomás, si con el tutor diseñado el alumno queda igual en el examen y el profesor recupera casi una de cada tres tardes, ¿eso es un placebo o un saldo positivo?", "mio": false}, {"nombre": "Tomás Lledó", "tipo": "respuesta", "texto": "Placebo, Óscar. No queda igual: queda igual y convencido de que ha mejorado [3853], y quien cree que ya sabe no pide ayuda. Una tarde libre no compensa un error que nadie ve.", "mio": false}, {"nombre": "Tomás Lledó", "tipo": "discurso", "texto": "Y eso me lleva a la última parada, por qué el manguito sigue intacto. Javier no negó el dato de Valeria, dijo que no es su herramienta. Con ChatGPT practicaban mejor y, cuando se lo quitaron, sacaron un diecisiete por ciento menos que quienes nunca lo tuvieron [3852]. Y no en casa, sino en un instituto, como Julia le recordó a Javier. Ese ChatGPT no es una caricatura, es el que casi uno de cada tres usa para pedir la solución completa [3864]. Su tutor diseñado es de piloto. Lo que hay el lunes es el manguito.\n\nRecapitulo. El socorrista frena el daño, pero no enseña. El refuerzo gratis es un primo listo. Y el monitor prometido dice hoy que le falta formación.\n\nBrújula nos ha demostrado lo bien que flota un alumno con inteligencia artificial. No se lo discutimos. Pero nadie se examina con manguitos. Y el día que se los quitan, flotar no es nadar. Por eso, no.", "mio": false}]}, {"ronda": "Ronda 1", "sala": "Sala 1", "enlace": "rondas/R1/R1D1/visor.html", "fase": "Segunda refutación de Brújula (a favor)", "n": 7, "nota": 4.7, "turnos": [{"nombre": "Laura Pérez", "tipo": "discurso", "texto": "Tomás ha cerrado diciendo que nadie se examina con manguitos. Tiene razón. Pero cualquiera que haya apuntado a un crío a natación en el polideportivo sabe que el primer mes va con manguitos y con un monitor al lado, y que al final del verano nada solo. Esa es nuestra piscina, y Tomás la ha descrito mejor que yo. Cuando le pregunté por Nigeria, me contestó «avanzaron, Laura, no lo discuto», y añadió «eso es una clase con monitor». Exacto, Tomás, eso defendemos desde el principio.\n\nQuedan tres choques abiertos. Primero, si la herramienta enseña o solo hace flotar. Segundo, quién paga el refuerzo de la chica de segundo de la ESO sin academia. Y tercero, quién hace hoy de monitor en España.\n\nEmpiezo por el primero, el placebo con wifi. Kairós dice que el tutor diseñado mitiga, pero no mejora, y Noelia nunca os lo vendió de otra manera. Pero fijaos en lo que prueba ese ensayo de PNAS [3613]. No prueba si la inteligencia artificial sirve, sino que importa cuál entra en clase. Con un ChatGPT sin barreras, el alumno se hunde, y con un tutor que guía, ese daño se frena en gran medida. La mejora la mide otro estudio, el del Banco Mundial en Nigeria [3604], donde con un profesor guiando los chavales avanzaron en seis semanas lo de año y medio o dos de escuela normal. Un placebo es una pastilla de azúcar, y con azúcar nadie avanza año y medio. Y aquí, Kairós, acepto vuestra primera pregunta.", "mio": true}, {"nombre": "Valeria Domínguez", "tipo": "interpelacion", "texto": "Si en PNAS el tutor diseñado no mejoró el examen y en Nigeria sí, ¿no es el profesor que guiaba en Nigeria, y no la máquina, lo que marca la diferencia?", "mio": false}, {"nombre": "Laura Pérez", "tipo": "respuesta", "texto": "Las dos cosas, Valeria, y por eso decimos herramienta. En Stanford todos tenían un tutor de carne y hueso, y aquellos cuyo tutor usaba además la inteligencia artificial dominaron más temas [3606]. El profesor marca la diferencia y la herramienta la multiplica.", "mio": true}, {"nombre": "Laura Pérez", "tipo": "discurso", "texto": "Y fijaos en la pregunta de Valeria, porque nos da la razón. Si lo que marca la diferencia es el profesor que guía, no dejemos la herramienta sola en el bolsillo, pongámosla en sus manos. Y lo mismo vale para lo que decía Tomás, que el alumno sale convencido de haber mejorado. ¿Quién lo baja de esa nube? Su profesora, con un examen sin la máquina delante.\n\nPaso al segundo choque, el del primo listo. Os presento a Lucía. Está en segundo de la ESO, las fracciones se le atragantan y en su casa no llega para academia. Tomás tiene razón en una cosa, la academia funciona porque alguien se sienta a tu lado. Pero ¿qué le ofrece Kairós a Lucía esta noche? No vienen a prohibir, así que le dejan justo el primo listo, el móvil a solas. Nosotros le ofrecemos lo contrario, un tutor en el instituto con su profesora al lado, como en Nigeria, donde costó nueve dólares por cada alumno adicional [3605]. Comparadlo con la academia que hoy pagan casi la mitad de las familias [3607]. A los nueve dólares, Tomás no ha dicho ni una palabra. Porque el primo listo no es nuestro modelo, es lo que le queda a Lucía cuando nadie le ofrece otra cosa. Y aquí, Kairós, os concedo vuestra segunda pregunta.", "mio": true}, {"nombre": "Tomás Lledó", "tipo": "interpelacion", "texto": "En Stanford, quien usaba la inteligencia artificial era el tutor humano, no el alumno. ¿Eso no prueba que ayuda al profesor, no que enseñe al alumno?", "mio": false}, {"nombre": "Laura Pérez", "tipo": "respuesta", "texto": "Prueba justo lo que defendemos, Tomás, una herramienta en manos del profesor. Pero en Nigeria la usaban los propios alumnos, con un profesor guiando [3604], y tú mismo concediste que avanzaron. Ayuda a los dos.", "mio": true}, {"nombre": "Laura Pérez", "tipo": "discurso", "texto": "Y eso me lleva al último choque, quién hace hoy de monitor. Tomás nos dice que ese profesor «todavía no sabe nadar en esta piscina» y que la escuela sigue en obras. Pero esas obras no se terminan esperando, se terminan formando. Según TALIS, solo uno de cada diez docentes la tiene prohibida [3609]. Eso no es una piscina cerrada, es un monitor que espera su cursillo, y en Nigeria bastaron tres días [3610]. Y mientras esperamos, Lucía sigue esta noche sola con el móvil.\n\nRecapitulo los tres choques. La herramienta enseña cuando alguien guía, y Tomás concedió que en Nigeria avanzaron. El refuerzo cuesta nueve dólares, no una academia, y nadie lo ha discutido. Y el monitor se forma en días, no en generaciones.\n\nVolvamos al polideportivo. Primero manguitos y monitor, y al final del verano Lucía nada sola, sin academia y sin la misma fotocopia que los otros veintinueve. Por eso, sí.", "mio": true}]}, {"ronda": "Ronda 1", "sala": "Sala 1", "enlace": "rondas/R1/R1D1/visor.html", "fase": "Segunda refutación de Kairós (en contra)", "n": 8, "nota": null, "turnos": [{"nombre": "Julia Arnau", "tipo": "discurso", "texto": "Laura nos ha llevado al polideportivo, y allí, al final del verano, hay una prueba muy sencilla. El monitor le quita los manguitos al niño y mira si nada. No le pregunta cuánto ha flotado ni cuánto costó el cursillo. Mira si nada. Y ahí está todo este debate. La pregunta no es qué hace la inteligencia artificial por el alumno, sino qué sabe el alumno cuando se la quitan.\n\nLaura ha dejado tres choques y los recojo en su orden, si enseña o solo hace flotar, quién paga lo de Lucía y quién hace hoy de monitor.\n\nEl primero lo ha resuelto la propia Laura. Valeria le preguntó qué marcaba la diferencia en Nigeria, y Laura respondió que «el profesor marca la diferencia y la herramienta la multiplica». Pero cuando se midió la herramienta frente a quienes no la tenían, en el ensayo de PNAS, ni el tutor diseñado para guiar mejoró el examen [3853]. Y algo que multiplica y deja el examen igual está multiplicando por uno. Dicho de otra forma, lo que enseña a nadar es el monitor, no el manguito.\n\nLaura le respondió a Tomás que con azúcar nadie avanza año y medio. Cierto, pero el placebo de Tomás no era Nigeria. Era ese tutor de PNAS, que dejó el examen igual y al alumno convencido de haber mejorado [3853]. Y la única prueba que han traído de que el alumno acabe nadando solo es Nigeria, y en Nigeria, como dice Laura, el profesor marca la diferencia. Brújula, si queréis, os dejo la palabra.", "mio": false}, {"nombre": "Javier Serrano", "tipo": "interpelacion", "texto": "Julia, en Nigeria se comparó con escuela normal, que también tiene profesor. Si el profesor estaba en los dos grupos, ¿qué produjo el año y medio de diferencia?", "mio": false}, {"nombre": "Julia Arnau", "tipo": "respuesta", "texto": "Todo un programa, Javier. Sesiones de tutoría, un profesor formado y una herramienta diseñada, frente a clase normal. Así contado, no sabemos qué parte pone la máquina. Donde se comparó con y sin ella, en PNAS, el tutor diseñado no mejoró el examen [3853].", "mio": false}, {"nombre": "Julia Arnau", "tipo": "discurso", "texto": "Y fijaos en lo que revela la pregunta de Javier. Para defender Nigeria hace falta un programa entero alrededor de la máquina. Esa es la clave del segundo choque, el de Lucía y los nueve dólares.\n\nLaura dice que a los nueve dólares nadie ha contestado. Contesto. Es un precio por alumno adicional, lo que cuesta sumar un chaval más a un programa ya montado, con su diseño y su profesor formado. Montar el programa es otra cuenta, y en España está sin hacer, porque el profesor dice que su primera barrera es la falta de conocimientos [3861]. Nueve dólares es el precio del manguito cuando el socorrista ya está en el borde. Aquí todavía no ha llegado.\n\nLaura nos acusa de dejarle a Lucía el primo listo. No, Laura. El primo listo ya está en su móvil, como dijo Noelia, y casi uno de cada tres alumnos europeos le pide la solución completa [3864]. Que sea inevitable no lo hace beneficioso. En junio nadie le preguntará a Lucía qué entregó con el móvil, sino si sabe hacer fracciones. Porque la pregunta no es qué hace la inteligencia artificial por Lucía, sino qué sabe Lucía cuando se la quitan. Brújula, os dejo la palabra.", "mio": false}, {"nombre": "Laura Pérez", "tipo": "interpelacion", "texto": "Julia, dices que donde se comparó con y sin máquina no mejoró. En Stanford, con el mismo tutor humano, ¿sus alumnos dominaron más temas cuando ese tutor usaba inteligencia artificial, sí o no?", "mio": true}, {"nombre": "Julia Arnau", "tipo": "respuesta", "texto": "Sí, Laura, no lo discuto. Pero la usaba el tutor, que ya sabe nadar, no el alumno. Es la calculadora en manos de quien ya sabe sumar. Con el manguito en el brazo del alumno, en PNAS, el examen no mejoró [3853].", "mio": false}, {"nombre": "Julia Arnau", "tipo": "discurso", "texto": "Y si la máquina funciona en manos de quien ya sabe, queda el último choque, quién hace hoy de monitor. Que casi nadie la tenga prohibida no significa saber usarla, y en primaria más de ocho de cada diez docentes dicen que les faltan conocimientos [3861]. Los tres días de Nigeria formaban para un programa ya montado. Aquí no hay programa, y Europa no garantiza ningún nivel de formación [3863]. Y mientras tanto, dice Laura, Lucía sigue sola con el móvil. Exacto. Esa es la inteligencia artificial que hoy entra en el sistema.\n\nRecapitulo. Enseña el monitor, no el manguito. Los nueve dólares pagan un programa que aquí no existe. Y el monitor dice que aún no sabe.\n\nAl final del verano le quitarán los manguitos a Lucía. Y la pregunta no es qué hace la inteligencia artificial por el alumno, sino qué sabe el alumno cuando se la quitan. Flotar no es nadar. Por eso, no.", "mio": false}]}, {"ronda": "Ronda 1", "sala": "Sala 1", "enlace": "rondas/R1/R1D1/visor.html", "fase": "Refutación cruzada de Brújula (a favor)", "n": 9, "nota": 4.0, "turnos": [{"nombre": "Laura Pérez", "tipo": "discurso", "texto": "Julia nos llevó al final del verano, cuando el monitor quita los manguitos y mira si el niño nada. Miremos quién nada, en dos choques.\n\nPrimero, ¿enseña o solo hace flotar? Julia dijo que multiplica por uno. Pero sobre Stanford me contestó «sí, Laura, no lo discuto». Con el mismo tutor humano usando inteligencia artificial, sus alumnos dominaron más temas [3606]. Eso no es multiplicar por uno. Y Tomás concedió Nigeria, «avanzaron, Laura» [3604]. Su prueba estrella, PNAS, dice que sin barreras el alumno se hunde y que con un tutor que guía el daño se frena [3613]. Importa quién la guía, que es justo nuestra tesis. Este choque es nuestro, porque Kairós concedió nuestras dos pruebas y la suya solo dice cómo implantarla.\n\nSegundo, la alternativa real. Julia cerró diciendo que Lucía sigue sola con el móvil, «exacto, esa es la inteligencia artificial que hoy entra en el sistema». Ese es el mundo de Kairós. No prohíben ni proponen quién la guíe, así que a Lucía le dejan el primo listo. Nosotros le ponemos a su profesora al lado, formada en tres días [3610], por nueve dólares por alumno [3605]. ¿Que montarlo cuesta más? Kairós no ha dado ninguna cifra, y la academia la paga casi la mitad de las familias [3607].\n\nLa elección no es manguitos sí o no, sino monitor o soledad. Con monitor, Lucía acaba nadando sola. Sin él, sigue flotando, y su profesora con la misma fotocopia para los treinta. Por eso, sí.", "mio": true}]}], "feedbacks": [{"ronda": "Ronda 1", "sala": "Sala 1", "enlace": "rondas/R1/R1D1/visor.html", "contexto": "a favor, contra Kairós", "jueces": [{"juez": "Carmen Llorens", "titulo": "jueza de fondo", "texto": "Laura Pérez."}, {"juez": "Álex Moreno", "titulo": "juez de forma", "texto": "Laura Pérez: la oradora más completa de vuestro lado. Lucía convierte la estadística en una persona, el polideportivo le da la vuelta a la metáfora del rival y respondiste a las interpelaciones con evidencia (Stanford) sin perder el hilo. A mejorar: en la refutación cruzada citaste seis fichas en 90 segundos, y en ese turno el jurado necesita una idea por choque. El argumento de Stanford es vuestra mejor arma contra la vara del rival: dilo pronto y sin rodeos («esos alumnos nunca tocaron la IA y aprendieron más: pasan vuestra prueba»)."}, {"juez": "Isabel Garrigós", "titulo": "jueza principal", "texto": "Laura Pérez (refutadora 2 y de la refutación cruzada). La interpelación sobre Stanford es de lo mejor del debate: corta, cerrada y con una concesión que pesó. Recorriste los choques en orden, devolviste la pregunta de Valeria y Lucía funciona como relato. A mejorar: cuando el rival ataca una cifra (los 9 $ marginales), contestad con la cifra completa, que también está en vuestra ficha: 48 $ por alumno en el piloto frente al coste de una academia. «No han dado ninguna cifra» traslada la carga. Y en la refutación cruzada no recortéis la precisión («por alumno adicional»), porque ahí es donde más se nota."}], "equipo": "**Carmen Llorens (jueza de fondo):** **Equipo.** Construisteis el caso sobre evidencias sólidas y variadas (varios ensayos aleatorizados, datos oficiales españoles) y las usasteis con prudencia: «saldo positivo, no riesgo cero», «se mitigó, no os lo vendo como mejora». Sacasteis concesiones claras y las recordasteis hasta el final. Puntos a mejorar: (1) Vuestra definición compara «con IA frente a sin IA», pero vuestro criterio compara «con profesor frente a sin profesor». Son comparaciones distintas, y el rival os lo señaló con «inevitable no es beneficioso». Elegid una y justificadla. (2) Jugasteis casi todo el debate en la imagen del rival, los manguitos. Volved antes a la vuestra. (3) Cuando el rival matiza un dato vuestro, reconoced el dato completo en lugar de pedirle una cifra a él.\n\n**Noelia Cano.** Exordio muy original: dar la vuelta a la portada (el blíster es la fotocopia, no el chatbot) es contextualizar de verdad, no repetir la carta. Definiciones claras y tres pasos fáciles de seguir. En el examen cruzado respondiste con honestidad y con dato. A mejorar: al aceptar «lo que sabe cuando se la quitan» le diste al rival su vara. Puedes aceptarla, pero añade «y también lo que gana el sistema a través del profesor», para que el tiempo docente entre en el criterio. «De cada tres tardes, casi una vuelve» estira el dato del 31% de planificación: cíñete a él.\n\n**Javier Serrano.** Recoger las concesiones del examen cruzado y darle la vuelta al estudio de PNAS fue muy eficaz, y tu interpelación sobre el grupo de control de Nigeria fue la pregunta más afilada del debate. A mejorar: el «solo en casa» no estaba en la ficha. Comprueba el contexto de cada estudio antes de caracterizarlo (la rectificación, eso sí, fue impecable). Respondiste a pocas piezas del rival: el GPS es una analogía y el 31% no es «el uso». «No cuesta un euro» es un añadido sin prueba.\n\n**Laura Pérez.** Muy buena organización por choques, y Lucía hace concreto el argumento de equidad. Tu pregunta sobre Stanford fue decisiva. A mejorar: «el profesor marca la diferencia y la herramienta la multiplica» le regaló al rival el «multiplica por uno». Tu propia ficha [3610] dice que en Nigeria los docentes no impartían instrucción directa: úsala. En el choque de los 9 dólares, reconoce los 48 y 124 dólares de tu ficha; seguían siendo más baratos que una academia y habrías cerrado el choque con honestidad. El rival aplica una doble vara («vuestros pilotos, nuestro lunes», cuando PNAS también es un experimento) y no la aprovechaste.\n\n**Óscar Román.** Cierre circular con el taco de fotocopias, y la imagen de las tres fichas y la llamada a la familia de Aitana es concreta y emotiva. Repasaste bien las concesiones. Tu pregunta en el examen cruzado sacó un «no venimos a prohibir» muy útil. A mejorar: «formada en días» exagera, porque esos tres días eran para un programa ya montado. Contra el «ojalá» tenías la mejor respuesta y no la pusiste delante: el ensayo inglés solo necesitó ChatGPT y una guía. Es un beneficio de hoy que no depende de ningún monitor. «Esperar sin hacer nada» atribuye al rival una carga que no tiene.\n\n**Álex Moreno (juez de forma):** Equipo: muy cohesionados. Os citáis entre vosotros (el «con profesor o sin él» de Noelia vuelve en todos) y el taco de fotocopias abre y cierra el debate. El mayor margen de mejora está en el marco. Dejasteis que la metáfora del rival (manguitos, socorristas) ocupara toda la tarde. Reclamad antes vuestra imagen en las refutaciones, no solo en la conclusión. Os quedaron sin responder los detectores [3862], el GPS y el aplazamiento europeo [3863]. Tampoco usasteis que PNAS también es un experimento controlado, igual que los «pilotos» que os reprochaban.\n\nNoelia Cano: apertura brillante. Usar la portada de la carta para decir que lo que trata a todos igual es la fotocopia, y no el chatbot, es original y engancha desde la primera frase. Definiciones limpias («saldo positivo, no riesgo cero»). A mejorar: el bloque central amontona ocho fichas en cuatro minutos. Elegid cuatro o cinco y dejad que cada una respire, como hiciste con «de cada tres tardes, casi una vuelve». En el examen cruzado, antes de aceptar un criterio del rival, reformúlalo en vuestros términos (por ejemplo: «lo que sabe sin ella, y también lo que gana el sistema con el tiempo del profesor»). Aceptarlo tal cual le dio al rival la vara para todo el debate.\n\nJavier Serrano: muy buena estructura con la «pregunta de claustro» (quién lo paga, quién lo forma, cuándo), y la réplica a los manguitos («nadie deja al niño solo») es eficaz. «Nadie cerró la imprenta. Se abrieron escuelas» es la mejor frase de tu turno. Corregiste el error con elegancia. A mejorar: revisa la ficha antes de describirla, porque PNAS eran sesiones en el instituto y no deberes en casa, y el rival lo recordó varias veces. Usa menos citas seguidas. Cuando el rival concede un beneficio, sopésalo de forma explícita frente a su daño en lugar de solo anotarlo.\n\nLaura Pérez: la oradora más completa de vuestro lado. Lucía convierte la estadística en una persona, el polideportivo le da la vuelta a la metáfora del rival y respondiste a las interpelaciones con evidencia (Stanford) sin perder el hilo. A mejorar: en la refutación cruzada citaste seis fichas en 90 segundos, y en ese turno el jurado necesita una idea por choque. El argumento de Stanford es vuestra mejor arma contra la vara del rival: dilo pronto y sin rodeos («esos alumnos nunca tocaron la IA y aprendieron más: pasan vuestra prueba»).\n\nÓscar Román: gran cierre. Volviste a la fotocopiadora y la escena de Lucía, Hugo y Aitana se recuerda. «Esperar sin hacer nada es un ojalá. Formar al profesor que ya está en el aula es un plan» es un giro excelente. Tu interpelación («¿placebo o saldo positivo?») fue de las mejores preguntas del debate. A mejorar: no vuelvas a aceptar en la conclusión la vara del rival, reformúlala. Recupera tu propia interpelación para sopesar el tiempo del profesor frente a la ilusión de aprendizaje, que fue el punto en el que el rival os apretó.\n\n**Isabel Garrigós (jueza principal):** **En equipo.** El caso es sólido y muy bien estructurado: tiempo, refuerzo e implantación, con un criterio claro (la prueba del lunes) y evidencias variadas y de peso (Inglaterra, Gallup, Banco Mundial, Stanford, EsadeEcPol, TALIS). Supisteis sacar concesiones en los exámenes cruzados y en las interpelaciones y volver a ellas en cada turno. Tenéis tres cosas que mejorar. (1) Acabasteis debatiendo dentro de la metáfora del rival (la piscina): si traéis una imagen propia (el taco de fotocopias, que era muy buena), mantenedla viva en las refutaciones. (2) Vuestra mejor respuesta al «es un ojalá» era que el ahorro de tiempo docente es de hoy y no necesita formación especial (Inglaterra: solo ChatGPT y una guía). Apareció en el examen cruzado y luego desapareció. (3) La carta habla de evaluación, de normativa europea y de protección de datos de menores, y teníais fichas para eso ([3612], [3614]) que no usasteis.\n\n**Noelia Cano (introductora).** El comienzo es excelente: resignificar la portada (lo que uniforma es la fotocopia, no el chatbot) contextualiza y engancha a la vez. Las definiciones son precisas y el criterio es claro, y las respuestas del examen cruzado fueron honestas y con evidencia («Hoy, Julia», y separar mitigación de mejora). A mejorar: cuando os pregunten por la vara, respondedla sin entregarla del todo. Algo como «las dos cosas: lo que sabe sin ella y lo que aprende con ella guiado» os habría evitado que el rival construyera todo su caso con vuestras palabras.\n\n**Javier Serrano (refutador 1).** Muy buen giro de los manguitos (al lado siempre hay alguien mirando), gran uso de las concesiones y una estructura memorable: quién lo paga, quién lo forma y cuándo. A mejorar, y es lo más importante: no adornéis nunca una evidencia. Lo de «solo en casa» no estaba en el estudio, y la corrección en directo os costó credibilidad justo en vuestra respuesta a la prueba central del rival. Antes de describir el contexto de un estudio (dónde, quién, cómo), comprobadlo en la ficha. Supiste rectificar con elegancia, y eso está bien.\n\n**Laura Pérez (refutadora 2 y de la refutación cruzada).** La interpelación sobre Stanford es de lo mejor del debate: corta, cerrada y con una concesión que pesó. Recorriste los choques en orden, devolviste la pregunta de Valeria y Lucía funciona como relato. A mejorar: cuando el rival ataca una cifra (los 9 $ marginales), contestad con la cifra completa, que también está en vuestra ficha: 48 $ por alumno en el piloto frente al coste de una academia. «No han dado ninguna cifra» traslada la carga. Y en la refutación cruzada no recortéis la precisión («por alumno adicional»), porque ahí es donde más se nota.\n\n**Óscar Román (conclusor).** Buena pregunta en el examen cruzado (prohibir no quita la herramienta) y un final muy visual y emotivo: tres fichas, la madre de Aitana, Lucía en junio. Cerraste el círculo con el taco. A mejorar: pondera de forma explícita contra el marco del rival. Si os dicen «beneficios de piloto», contestad que PNAS también es un experimento y que Inglaterra y Gallup son uso real. Apoyarse en «el rival no propone nada» rinde poco, porque el en contra no necesita plan. Lo que convence es demostrar por qué el saldo ya es positivo hoy."}]}, {"nombre": "Julia Arnau", "equipo": "Kairós", "puesto": "refutador2", "puntos": 4, "nominaciones": 0, "notas": [4.3, 4.3], "media": 4.3, "slug": "julia-arnau", "puesto_txt": "Refutación 2 y 3", "intervenciones": [{"ronda": "Ronda 1", "sala": "Sala 1", "enlace": "rondas/R1/R1D1/visor.html", "fase": "Examen cruzado a Brújula (a favor)", "n": 2, "nota": null, "turnos": [{"nombre": "Marcos Peris", "tipo": "pregunta", "texto": "Vuestra prueba del lunes, ¿mira lo que el alumno entrega con la inteligencia artificial delante o lo que sabe hacer cuando se la quitan?", "mio": false}, {"nombre": "Noelia Cano", "tipo": "respuesta", "texto": "Lo que sabe cuando se la quitan, Marcos. Por eso no defendemos el ChatGPT sin barreras. El ensayo de la Academia de Ciencias [3613] mide justo eso, y con un tutor que guía y un profesor detrás, el daño se mitiga en gran medida.", "mio": false}, {"nombre": "Julia Arnau", "tipo": "pregunta", "texto": "Si tres de cada cuatro profesores de secundaria dicen no saber enseñar con ella, ¿la inteligencia artificial es beneficiosa hoy en España o lo será cuando estén formados?", "mio": true}, {"nombre": "Noelia Cano", "tipo": "respuesta", "texto": "Hoy, Julia. En el ensayo inglés solo les dieron ChatGPT y una guía, y ya prepararon las clases en casi un tercio menos de tiempo [3601]. Formar al resto cuesta tres días [3610], no una generación. Beneficiosa hoy, y más cuando estén formados.", "mio": false}, {"nombre": "Tomás Lledó", "tipo": "pregunta", "texto": "En ese ensayo de la Academia de Ciencias, con el tutor diseñado, ¿el examen sin inteligencia artificial mejoró o solo se mitigó el daño?", "mio": false}, {"nombre": "Noelia Cano", "tipo": "respuesta", "texto": "Se mitigó, Tomás, y no os lo vendo como mejora. Ese estudio prueba que decide el diseño, porque sin barreras hay daño y con tutor se frena en gran medida [3613]. La mejora la mide el Banco Mundial en Nigeria, año y medio en seis semanas [3604].", "mio": false}, {"nombre": "Valeria Domínguez", "tipo": "pregunta", "texto": "Noelia, la tutoría de Nigeria que citáis, ¿era el ChatGPT que el alumno ya lleva en el móvil o un programa diseñado y supervisado a propósito?", "mio": false}, {"nombre": "Noelia Cano", "tipo": "respuesta", "texto": "Supervisado a propósito, Valeria, y eso es justo nuestra tesis. Los chavales iban a sesiones con un profesor formado en tres días que guiaba y vigilaba el uso [3610]. No defendemos el móvil a solas, sino eso, que cuesta nueve dólares por alumno adicional [3605].", "mio": false}]}, {"ronda": "Ronda 1", "sala": "Sala 1", "enlace": "rondas/R1/R1D1/visor.html", "fase": "Primera refutación de Brújula (a favor)", "n": 5, "nota": null, "turnos": [{"nombre": "Javier Serrano", "tipo": "discurso", "texto": "Valeria nos ha traído unos manguitos, y los manguitos tienen algo que ella no ha contado. Nadie se los pone a un niño para dejarlo solo en la piscina. Al lado siempre hay alguien mirando. Y esa es la pregunta de esta tarde, la que os dejaba Noelia, con profesor o sin él. Voy a responder a los manguitos, después volveré al tiempo y al refuerzo, y os haré la pregunta que hago siempre en un claustro, quién lo paga, quién lo forma y cuándo.\n\nEmpiezo por lo que Kairós concedió en el examen cruzado, que es mucho. Valeria le dijo a Óscar que no vienen a prohibir y que el alumno la sigue usando. Y a mí me reconoció que la tarde que gana el profesor «cuenta, y lo concedo, es un beneficio». Añadió que es un medio, y enseguida veremos adónde lleva. Pero fijaos en lo primero. Si nadie le va a quitar la herramienta al alumno, la prueba de los manguitos no compara inteligencia artificial contra nada. Compara un niño con manguitos y socorrista contra un niño con manguitos y solo.\n\nY su dato estrella lo confirma. Ese diecisiete por ciento menos del ensayo de PNAS [3613] sale del ChatGPT sin barreras, el del alumno solo en casa, el que nosotros no defendemos. Con un tutor diseñado para guiar, el mismo estudio dice que ese daño se mitiga en gran medida. Así que su mejor prueba no dice que cerremos la piscina. Dice que pongamos a alguien en el borde. Si Kairós quiere, acepto aquí su pregunta.", "mio": false}, {"nombre": "Julia Arnau", "tipo": "interpelacion", "texto": "Ese diecisiete por ciento salió de sesiones de práctica en un instituto, no de deberes en casa. ¿Dónde dice el estudio que el alumno estuviera solo en casa?", "mio": true}, {"nombre": "Javier Serrano", "tipo": "respuesta", "texto": "Tienes razón, Julia, fueron sesiones en el instituto, no en casa, y lo corrijo. Pero lo que cambió el resultado no fue el sitio, sino el diseño. Con un tutor que guía, el daño se mitiga en gran medida [3613].", "mio": false}, {"nombre": "Javier Serrano", "tipo": "discurso", "texto": "Y fijaos en lo que significa. Si hasta dentro del instituto un ChatGPT sin barreras hace daño, dejarlo solo en el móvil no lo arregla. Lo arregla elegir bien qué herramienta entra en clase y quién la guía.\n\nVamos a lo que Valeria llamó un medio. Lo es, pero ¿un medio para qué? Para corregir con calma, preparar otra ficha al chico que va perdido y llamar a su madre. Eso cuentan los docentes en la encuesta de Gallup, seis semanas por curso para atender mejor a cada alumno y a las familias [3602]. Y con una norma de centro clara, que no cuesta un euro, el ahorro crece una cuarta parte [3603].\n\nLo segundo es el refuerzo, y sobre él Kairós aún no ha dicho nada. En Nigeria, con un profesor guiando, seis semanas valieron por año y medio o dos de escuela normal [3604]. Y en un ensayo de Stanford, con un copiloto de inteligencia artificial para tutores de carne y hueso, ganaron más los alumnos de los tutores más flojos [3606]. Y ahora, mi pregunta de claustro. ¿Quién lo paga? La administración, a nueve dólares por alumno adicional [3605], frente a la academia que hoy pagan casi la mitad de las familias [3607]. Kairós, acepto vuestra segunda pregunta.", "mio": false}, {"nombre": "Valeria Domínguez", "tipo": "interpelacion", "texto": "Habéis preguntado quién lo forma. En primaria, más de ocho de cada diez docentes dicen que les faltan conocimientos. Hoy, en un aula española, ¿quién es ese socorrista en el borde?", "mio": false}, {"nombre": "Javier Serrano", "tipo": "respuesta", "texto": "El profesor que ya está en el aula, Valeria. Que diga que le falta formación no es motivo para cerrar la piscina, sino para formarlo, y en Nigeria bastaron tres días [3610].", "mio": false}, {"nombre": "Javier Serrano", "tipo": "discurso", "texto": "Eso es quién lo forma. ¿Y cuándo? Ya, porque el alumno, como reconoció Valeria, la sigue usando esta tarde. Ella misma lo dijo, «lo que nadie nota, nadie lo corrige». Exacto. Por eso hace falta alguien que lo note, un profesor formado, no un chaval solo con el móvil. Según TALIS, solo uno de cada diez docentes dice que se la prohíben [3609]. El freno es la formación, y eso tiene arreglo.\n\nValeria nos habló de una imprenta en un pueblo donde nadie sabe leer. Es verdad. Pero nadie cerró la imprenta. Se abrieron escuelas.\n\nAsí que la elección no es manguitos sí o no. Es con profesor o sin él. Con profesor, la tarde vuelve, el refuerzo deja de depender del bolsillo y el daño se frena. Sin él, el alumno sigue con manguitos y solo en el agua, y la profesora con su taco de fotocopias, el mismo para los treinta. Por eso, sí.", "mio": false}]}, {"ronda": "Ronda 1", "sala": "Sala 1", "enlace": "rondas/R1/R1D1/visor.html", "fase": "Segunda refutación de Kairós (en contra)", "n": 8, "nota": 4.3, "turnos": [{"nombre": "Julia Arnau", "tipo": "discurso", "texto": "Laura nos ha llevado al polideportivo, y allí, al final del verano, hay una prueba muy sencilla. El monitor le quita los manguitos al niño y mira si nada. No le pregunta cuánto ha flotado ni cuánto costó el cursillo. Mira si nada. Y ahí está todo este debate. La pregunta no es qué hace la inteligencia artificial por el alumno, sino qué sabe el alumno cuando se la quitan.\n\nLaura ha dejado tres choques y los recojo en su orden, si enseña o solo hace flotar, quién paga lo de Lucía y quién hace hoy de monitor.\n\nEl primero lo ha resuelto la propia Laura. Valeria le preguntó qué marcaba la diferencia en Nigeria, y Laura respondió que «el profesor marca la diferencia y la herramienta la multiplica». Pero cuando se midió la herramienta frente a quienes no la tenían, en el ensayo de PNAS, ni el tutor diseñado para guiar mejoró el examen [3853]. Y algo que multiplica y deja el examen igual está multiplicando por uno. Dicho de otra forma, lo que enseña a nadar es el monitor, no el manguito.\n\nLaura le respondió a Tomás que con azúcar nadie avanza año y medio. Cierto, pero el placebo de Tomás no era Nigeria. Era ese tutor de PNAS, que dejó el examen igual y al alumno convencido de haber mejorado [3853]. Y la única prueba que han traído de que el alumno acabe nadando solo es Nigeria, y en Nigeria, como dice Laura, el profesor marca la diferencia. Brújula, si queréis, os dejo la palabra.", "mio": true}, {"nombre": "Javier Serrano", "tipo": "interpelacion", "texto": "Julia, en Nigeria se comparó con escuela normal, que también tiene profesor. Si el profesor estaba en los dos grupos, ¿qué produjo el año y medio de diferencia?", "mio": false}, {"nombre": "Julia Arnau", "tipo": "respuesta", "texto": "Todo un programa, Javier. Sesiones de tutoría, un profesor formado y una herramienta diseñada, frente a clase normal. Así contado, no sabemos qué parte pone la máquina. Donde se comparó con y sin ella, en PNAS, el tutor diseñado no mejoró el examen [3853].", "mio": true}, {"nombre": "Julia Arnau", "tipo": "discurso", "texto": "Y fijaos en lo que revela la pregunta de Javier. Para defender Nigeria hace falta un programa entero alrededor de la máquina. Esa es la clave del segundo choque, el de Lucía y los nueve dólares.\n\nLaura dice que a los nueve dólares nadie ha contestado. Contesto. Es un precio por alumno adicional, lo que cuesta sumar un chaval más a un programa ya montado, con su diseño y su profesor formado. Montar el programa es otra cuenta, y en España está sin hacer, porque el profesor dice que su primera barrera es la falta de conocimientos [3861]. Nueve dólares es el precio del manguito cuando el socorrista ya está en el borde. Aquí todavía no ha llegado.\n\nLaura nos acusa de dejarle a Lucía el primo listo. No, Laura. El primo listo ya está en su móvil, como dijo Noelia, y casi uno de cada tres alumnos europeos le pide la solución completa [3864]. Que sea inevitable no lo hace beneficioso. En junio nadie le preguntará a Lucía qué entregó con el móvil, sino si sabe hacer fracciones. Porque la pregunta no es qué hace la inteligencia artificial por Lucía, sino qué sabe Lucía cuando se la quitan. Brújula, os dejo la palabra.", "mio": true}, {"nombre": "Laura Pérez", "tipo": "interpelacion", "texto": "Julia, dices que donde se comparó con y sin máquina no mejoró. En Stanford, con el mismo tutor humano, ¿sus alumnos dominaron más temas cuando ese tutor usaba inteligencia artificial, sí o no?", "mio": false}, {"nombre": "Julia Arnau", "tipo": "respuesta", "texto": "Sí, Laura, no lo discuto. Pero la usaba el tutor, que ya sabe nadar, no el alumno. Es la calculadora en manos de quien ya sabe sumar. Con el manguito en el brazo del alumno, en PNAS, el examen no mejoró [3853].", "mio": true}, {"nombre": "Julia Arnau", "tipo": "discurso", "texto": "Y si la máquina funciona en manos de quien ya sabe, queda el último choque, quién hace hoy de monitor. Que casi nadie la tenga prohibida no significa saber usarla, y en primaria más de ocho de cada diez docentes dicen que les faltan conocimientos [3861]. Los tres días de Nigeria formaban para un programa ya montado. Aquí no hay programa, y Europa no garantiza ningún nivel de formación [3863]. Y mientras tanto, dice Laura, Lucía sigue sola con el móvil. Exacto. Esa es la inteligencia artificial que hoy entra en el sistema.\n\nRecapitulo. Enseña el monitor, no el manguito. Los nueve dólares pagan un programa que aquí no existe. Y el monitor dice que aún no sabe.\n\nAl final del verano le quitarán los manguitos a Lucía. Y la pregunta no es qué hace la inteligencia artificial por el alumno, sino qué sabe el alumno cuando se la quitan. Flotar no es nadar. Por eso, no.", "mio": true}]}, {"ronda": "Ronda 1", "sala": "Sala 1", "enlace": "rondas/R1/R1D1/visor.html", "fase": "Refutación cruzada de Kairós (en contra)", "n": 10, "nota": 4.3, "turnos": [{"nombre": "Julia Arnau", "tipo": "discurso", "texto": "Laura ha cerrado diciendo que la elección es monitor o soledad. Me quedo con esas palabras, porque deciden los dos choques.\n\nEl primero, si la herramienta enseña o solo hace flotar. Laura dice que concedimos sus dos pruebas. Las concedimos, y las dos dicen lo mismo. En Stanford la usaba el tutor, que ya sabe nadar, no el alumno. En Nigeria avanzaron con un profesor guiando, y Laura reconoció que el profesor marca la diferencia. Y donde se comparó al alumno con manguito y sin él, en PNAS, ni el tutor diseñado mejoró el examen, y encima creyeron que sí [3853]. Su mejor prueba de la herramienta es una prueba del monitor. Ese choque es nuestro.\n\nEl segundo, monitor o soledad. Laura nos pide la cifra del montaje. No hace falta. Basta con demostrar que hoy ese monitor no está, y en primaria más de ocho de cada diez docentes dicen que les faltan conocimientos [3861]. Y lo dijo la propia Laura, esta noche Lucía sigue sola con el móvil. Ese es el sistema de hoy. Su sí depende de un monitor que todavía no ha llegado, y eso no es un sí, es un ojalá. También es nuestro.\n\nY la vara la puso Noelia, cuando aceptó que cuenta «lo que sabe cuando se la quitan». Porque la pregunta no es qué hace la inteligencia artificial por el alumno, sino qué sabe el alumno cuando se la quitan. Flotar no es nadar. Por eso, no.", "mio": true}]}], "feedbacks": [{"ronda": "Ronda 1", "sala": "Sala 1", "enlace": "rondas/R1/R1D1/visor.html", "contexto": "en contra, contra Brújula", "jueces": [{"juez": "Carmen Llorens", "titulo": "jueza de fondo", "texto": "Julia Arnau."}, {"juez": "Álex Moreno", "titulo": "juez de forma", "texto": "Julia Arnau: tu interpelación sobre «en casa» fue precisa y cambió el tono del choque. Leer los 9 $ como coste marginal y plantear el problema de atribución en Nigeria fueron argumentos finos. A mejorar: usaste el estribillo cuatro veces en dos turnos; guárdalo para el último golpe. «Multiplicar por uno» choca con Stanford: allí los alumnos aprendieron más sin tocar la herramienta. Respóndelo con tu propia vara en lugar de desplazarte a «la usaba el tutor»."}, {"juez": "Isabel Garrigós", "titulo": "jueza principal", "texto": "Julia Arnau (refutadora 2 y de la refutación cruzada). La interpelación que destapó el «en casa» fue precisa y oportuna, y la lectura de los 9 $ como coste marginal fue de lo más sólido de vuestro caso. La refutación cruzada fue limpia, con la imagen del «ojalá». A mejorar: «multiplicar por uno» mezclaba el tutor de PNAS sin docente con el docente que usa la herramienta, y la pregunta sobre Stanford lo desmontó. Si concedéis que la herramienta funciona en manos del profesor, explicad por qué eso no cuenta como beneficio para el sistema, porque la pregunta habla del sistema y no solo del alumno."}], "equipo": "**Carmen Llorens (jueza de fondo):** **Equipo.** Caso muy coherente, con una imagen central (manguitos) que acabó organizando todo el debate, un estribillo memorable y una lectura precisa de vuestras fichas de PNAS, TALIS y el Ómnibus. Usasteis muy bien la carta («deja de lado la intervención humana») y el marco español. Puntos a mejorar: (1) Las metáforas no pueden cargar con el peso de la inferencia: «placebo», «primo listo» y «ojalá» necesitan un dato debajo. (2) Concedisteis Nigeria, Stanford y el tiempo docente sin tener preparada una ponderación probada de por qué pesan menos. (3) Si exigís datos de España y no de pilotos, aplicad la misma exigencia a vuestro estudio estrella. (4) La repetición del estribillo os quitó tiempo para argumentar.\n\n**Valeria Domínguez.** Exordio excelente, y tomar la respuesta de Noelia como vara común fue una jugada estratégica de primer nivel. Usaste los datos con precisión. A mejorar: «El manguito no es el mal uso. Es el uso» generaliza a todos lo que hace un 31%, y tu propia ficha dice que los usos más comunes son informarse y que les expliquen conceptos. El GPS es una analogía: preséntala como tal y apóyala en evidencia directa sobre IA. En el examen cruzado, conceder el tiempo docente como beneficio sin una respuesta probada de por qué es «solo un medio» os dejó expuestos toda la tarde. El argumento de los detectores se perdió por el camino: si lo traes, que alguien lo recoja.\n\n**Tomás Lledó.** Convertir al socorrista en alguien que «vigila, no enseña» fue un gran giro, y «mitiga, no mejora» va a la raíz de la ficha. Estructura en tres paradas muy clara. A mejorar: «placebo con wifi» exagera, porque un placebo no hace nada y ese tutor mejoró la práctica y no dañó el examen. «Quien cree que ya sabe no pide ayuda» es plausible, pero no lo probaste. Antes de conceder Nigeria sin matices, prepara las distinciones: el contexto de partida, que la prueba incluía conocimientos de IA y que en inglés el efecto fue menor.\n\n**Julia Arnau.** La refutación más técnica del debate: la distinción entre coste marginal y coste de montaje, y el problema de que Nigeria mezcla programa y herramienta, son exactos. Tu interpelación pilló un error de caracterización del rival. A mejorar: dijiste que la máquina «multiplica por uno» y en la misma intervención concediste Stanford, que es justo una comparación con y sin IA manteniendo al humano. Si te retiras a «la usaba el tutor», necesitas un argumento de por qué los beneficios del docente no cuentan para el sistema. En la refutación cruzada, «no hace falta la cifra» es lógicamente correcto: desarróllalo con el dato y no con la frase.\n\n**Marcos Peris.** Tu pregunta en el examen cruzado marcó el debate. La conclusión tuvo una estructura de ponderación clara («¿por qué pesa más lo nuestro?») y un cierre emotivo muy logrado («una mano que sabe cuándo soltarte»). A mejorar: «sus beneficios son de piloto y nuestros daños, del uso que hay el lunes» no se sostiene del todo, porque vuestro PNAS es también un experimento de campo y el ahorro de tiempo docente no dependía de ningún programa. Despachar ese beneficio como «un medio» exigía una prueba de que ese tiempo se pierde.\n\n**Álex Moreno (juez de forma):** Equipo: el marco más coherente de la tarde. Los manguitos atraviesan las cuatro voces, cada orador cita con precisión lo que concedió el rival y el cierre «Flotar no es nadar. Por eso, no» da unidad. A mejorar: el estribillo «la pregunta no es qué hace por el alumno, sino qué sabe cuando se la quitan» sonó demasiadas veces, y repetido deja de cortar. Más allá del diagnóstico, no ofrecisteis una alternativa para el alumno que ya usa la IA en casa, y el rival lo explotó. No respondisteis a la norma de centro [3603] ni sopesasteis de verdad el tiempo del profesor que concedisteis.\n\nValeria Domínguez: apertura excelente. Los manguitos se entienden al instante y «Manguitos hay para todos. Socorristas, todavía no» es de esos finales que se recuerdan. Capturaste en el acto el criterio que concedió el rival, con mucha agilidad. A mejorar: «El manguito no es el mal uso. Es el uso» convierte un 31 % en la norma. Di «uno de cada tres» y deja que la cifra pese sola. En el examen cruzado, cuando concedas un beneficio, sopésalo en la misma respuesta. «Es un medio» se quedó corto y el rival lo usó todo el debate.\n\nTomás Lledó: los mejores giros retóricos del debate. «El socorrista no te enseña a nadar, vigila que no te ahogues», «placebo con wifi», «primo listo», «primero las escuelas». Hoja de ruta clara y recapitulación limpia. A mejorar: «No queda igual: queda igual y convencido…» suena contradictorio. Ensaya la frase para que la idea llegue a la primera. La etiqueta de placebo era vulnerable a Nigeria, que tú mismo concediste: anticipa esa objeción antes de lanzarla.\n\nJulia Arnau: tu interpelación sobre «en casa» fue precisa y cambió el tono del choque. Leer los 9 $ como coste marginal y plantear el problema de atribución en Nigeria fueron argumentos finos. A mejorar: usaste el estribillo cuatro veces en dos turnos; guárdalo para el último golpe. «Multiplicar por uno» choca con Stanford: allí los alumnos aprendieron más sin tocar la herramienta. Respóndelo con tu propia vara en lugar de desplazarte a «la usaba el tutor».\n\nMarcos Peris: tu pregunta del examen cruzado marcó el criterio de todo el debate, y la conclusión tiene la imagen más emotiva de la tarde («una mano que sabe cuándo soltarte», «un manguito que no se desinfla nunca»). La ponderación también es clara (piloto frente a lunes, el daño que no se nota). A mejorar: «sus beneficios son de piloto» deja un flanco abierto, porque PNAS también es un experimento controlado. Anticípalo. Y dedica una frase a explicar por qué el tiempo del profesor pesa menos, en lugar de solo recordar que es un medio.\n\n**Isabel Garrigós (jueza principal):** **En equipo.** Tenéis un sistema de imágenes muy cohesionado (manguitos, GPS, imprenta, socorrista) que todo el equipo mantuvo y que marcó el terreno del debate. Usasteis con inteligencia la definición de la carta («deja de lado la intervención humana») y supisteis fijar el criterio desde el examen cruzado. Las evidencias son fieles a las fichas. Tenéis tres cosas que mejorar. (1) Dependéis mucho de una sola ficha ([3853]): diversificad, porque si os la neutralizan os quedáis sin caso. (2) Restringir el debate a «la IA tal como entra hoy» (el móvil a solas) necesita más justificación: la carta describe también centros que la integran de forma guiada. (3) Algunos saltos lógicos os dejaron expuestos: «multiplicar por uno», «el manguito es el uso» a partir de un 31 %, o «la tarde se pierde si el alumno copia».\n\n**Valeria Domínguez (introductora).** Un comienzo de los que se recuerdan, con los manguitos y una pregunta directa al jurado. Buen aprovechamiento de la carta y de las respuestas del examen cruzado, y tres pasos claros con evidencia bien elegida. A mejorar: en el examen cruzado concediste «es un beneficio» sin un marco preparado, y el rival lo usó todo el debate. Preparad cómo conceder conteniendo, por ejemplo «beneficio para el docente que no llega al alumno sin X». Y cuando generalicéis a partir de una encuesta, anticipad la objeción: la misma ficha de la OCDE dice que la mayoría la usa para informarse y que le expliquen conceptos.\n\n**Tomás Lledó (refutador 1).** Gran pregunta en el examen cruzado (¿mitigó o mejoró?), muy buenas fórmulas («placebo con wifi», «primo listo») y una estructura en tres paradas fácil de seguir. A mejorar: ante la interpelación sobre Nigeria concediste sin tener lista la objeción de fondo (era un programa entero, no se sabe qué parte pone la máquina), que llegó después con Julia. Llevad esa respuesta preparada desde la primera refutación. Y «una tarde libre no compensa un error que nadie ve» necesita un mecanismo que la conecte con el aprendizaje del alumno.\n\n**Julia Arnau (refutadora 2 y de la refutación cruzada).** La interpelación que destapó el «en casa» fue precisa y oportuna, y la lectura de los 9 $ como coste marginal fue de lo más sólido de vuestro caso. La refutación cruzada fue limpia, con la imagen del «ojalá». A mejorar: «multiplicar por uno» mezclaba el tutor de PNAS sin docente con el docente que usa la herramienta, y la pregunta sobre Stanford lo desmontó. Si concedéis que la herramienta funciona en manos del profesor, explicad por qué eso no cuenta como beneficio para el sistema, porque la pregunta habla del sistema y no solo del alumno.\n\n**Marcos Peris (conclusor).** La pregunta que fijó la vara fue estratégica y muy bien formulada. La conclusión pondera de forma explícita (daños del lunes frente a beneficios de piloto, el daño que el alumno no nota) y el cierre de la mano que sabe cuándo soltarte es contundente. A mejorar: «sus beneficios son de piloto» es vulnerable, porque vuestro estudio estrella también es un experimento y algunas pruebas del rival (Inglaterra, Gallup) son uso real. Y afirmar que PNAS es el único sitio donde se midió con y sin la máquina exagera la evidencia: un rival atento os lo habría devuelto."}]}, {"nombre": "Noelia Cano", "equipo": "Brújula", "puesto": "introductor", "puntos": 3, "nominaciones": 0, "notas": [4.7, 3.7], "media": 4.2, "slug": "noelia-cano", "puesto_txt": "Introducción", "intervenciones": [{"ronda": "Ronda 1", "sala": "Sala 1", "enlace": "rondas/R1/R1D1/visor.html", "fase": "Exposición inicial de Brújula (a favor)", "n": 1, "nota": 4.7, "turnos": [{"nombre": "Noelia Cano", "tipo": "discurso", "texto": "Os he traído lo primero que coge una profesora un lunes a las ocho menos diez. Un taco de fotocopias, treinta copias de la misma ficha. La portada de este torneo nos enseña una máquina expendedora llena de alumnos iguales, en blíster. Pero lo que lleva décadas tratando a todos los alumnos igual no es un chatbot. Es esta ficha, la misma para la chica que va sobrada y para el chico que va perdido. Y no porque la profesora no quiera, sino porque no le da la vida.\n\nBuenas tardes al jurado y al equipo de Kairós. La pregunta de hoy no es si la inteligencia artificial es perfecta, sino si es una herramienta beneficiosa para el sistema educativo.\n\nHablamos sobre todo de la inteligencia artificial generativa, la que explica y prepara materiales. Una herramienta la maneja alguien, así que la juzgamos en manos de docentes y alumnos, no como máquina que enseña sola. Y beneficiosa quiere decir que, con el presupuesto y la plantilla de hoy, el aula queda mejor con ella que sin ella. Saldo positivo, no riesgo cero.\n\nNuestro criterio es la prueba del lunes, qué cambia de verdad en un aula real frente a la alternativa realista. Y esa alternativa no es un mundo sin inteligencia artificial, que ya está en el móvil de cada alumno. La elección es con profesor o sin él.\n\nPor eso nuestra respuesta es sí. Con el profesor al mando, la inteligencia artificial le devuelve tiempo y pone al alcance de cualquier alumno el refuerzo que hoy se paga en la academia. Lo veréis en tres pasos, el tiempo, el refuerzo y la implantación.\n\nPrimero, seis semanas para lo que importa. En Inglaterra dieron ChatGPT y una guía a profesores elegidos al azar [3601], y prepararon sus clases en casi un tercio menos de tiempo, sin que bajara la calidad. De cada tres tardes, casi una vuelve. Y en Estados Unidos, quienes la usan cada semana calculan que ganan seis semanas por curso, según Gallup [3602], para corregir mejor y hablar con las familias. Justo el tiempo que hoy no da para más de una ficha.\n\nSegundo, el refuerzo de la academia, al alcance de todos. En España, casi la mitad de las familias con escolares paga clases particulares, según EsadeEcPol [3607]. ¿Y la otra mitad? Se queda con la fotocopia. El Banco Mundial probó en institutos públicos de Nigeria seis semanas de tutoría con inteligencia artificial, con un profesor guiando [3604], y esos chavales avanzaron lo que otros en año y medio o dos de escuela normal. ¿El coste? Nueve dólares por cada alumno adicional [3605]. Pensad en lo que cuesta una hora de academia en vuestro barrio.\n\nY tercero, el lunes se decide en la implantación, no en la máquina. Lo demuestra un ensayo con casi mil alumnos, publicado en la revista de la Academia de Ciencias de Estados Unidos [3613]. Con un ChatGPT sin barreras, el alumno lo usa de muleta y, cuando se lo quitan, rinde peor. Con un tutor diseñado para guiar, ese daño se mitiga en gran medida. Ante cualquier riesgo, preguntaos si se arregla cerrando la puerta o enseñando a usarla. Y en España el freno no es una prohibición, sino que tres de cada cuatro profesores de secundaria dicen no saber enseñar con ella, según TALIS [3609]. Eso no se arregla con un candado, sino con formación, y en Nigeria bastaron tres días [3610].\n\nOs dejo una pregunta para toda la tarde. El lunes, ¿quién recibe la ficha que necesita? Sin inteligencia artificial, el que puede pagarse la academia. Con ella y un profesor al mando, cualquiera. Y este taco, por fin, deja de ser el mismo para los treinta.", "mio": true}]}, {"ronda": "Ronda 1", "sala": "Sala 1", "enlace": "rondas/R1/R1D1/visor.html", "fase": "Examen cruzado a Brújula (a favor)", "n": 2, "nota": 3.7, "turnos": [{"nombre": "Marcos Peris", "tipo": "pregunta", "texto": "Vuestra prueba del lunes, ¿mira lo que el alumno entrega con la inteligencia artificial delante o lo que sabe hacer cuando se la quitan?", "mio": false}, {"nombre": "Noelia Cano", "tipo": "respuesta", "texto": "Lo que sabe cuando se la quitan, Marcos. Por eso no defendemos el ChatGPT sin barreras. El ensayo de la Academia de Ciencias [3613] mide justo eso, y con un tutor que guía y un profesor detrás, el daño se mitiga en gran medida.", "mio": true}, {"nombre": "Julia Arnau", "tipo": "pregunta", "texto": "Si tres de cada cuatro profesores de secundaria dicen no saber enseñar con ella, ¿la inteligencia artificial es beneficiosa hoy en España o lo será cuando estén formados?", "mio": false}, {"nombre": "Noelia Cano", "tipo": "respuesta", "texto": "Hoy, Julia. En el ensayo inglés solo les dieron ChatGPT y una guía, y ya prepararon las clases en casi un tercio menos de tiempo [3601]. Formar al resto cuesta tres días [3610], no una generación. Beneficiosa hoy, y más cuando estén formados.", "mio": true}, {"nombre": "Tomás Lledó", "tipo": "pregunta", "texto": "En ese ensayo de la Academia de Ciencias, con el tutor diseñado, ¿el examen sin inteligencia artificial mejoró o solo se mitigó el daño?", "mio": false}, {"nombre": "Noelia Cano", "tipo": "respuesta", "texto": "Se mitigó, Tomás, y no os lo vendo como mejora. Ese estudio prueba que decide el diseño, porque sin barreras hay daño y con tutor se frena en gran medida [3613]. La mejora la mide el Banco Mundial en Nigeria, año y medio en seis semanas [3604].", "mio": true}, {"nombre": "Valeria Domínguez", "tipo": "pregunta", "texto": "Noelia, la tutoría de Nigeria que citáis, ¿era el ChatGPT que el alumno ya lleva en el móvil o un programa diseñado y supervisado a propósito?", "mio": false}, {"nombre": "Noelia Cano", "tipo": "respuesta", "texto": "Supervisado a propósito, Valeria, y eso es justo nuestra tesis. Los chavales iban a sesiones con un profesor formado en tres días que guiaba y vigilaba el uso [3610]. No defendemos el móvil a solas, sino eso, que cuesta nueve dólares por alumno adicional [3605].", "mio": true}]}, {"ronda": "Ronda 1", "sala": "Sala 1", "enlace": "rondas/R1/R1D1/visor.html", "fase": "Examen cruzado a Kairós (en contra)", "n": 4, "nota": null, "turnos": [{"nombre": "Noelia Cano", "tipo": "pregunta", "texto": "Valeria, en ese ensayo de PNAS, los alumnos que usaron el tutor diseñado, ¿también sacaron un diecisiete por ciento menos cuando se lo quitaron?", "mio": true}, {"nombre": "Valeria Domínguez", "tipo": "respuesta", "texto": "No, Noelia, y lo he dicho: el tutor diseñado frenó la caída. Pero tampoco mejoró. No superaron a quienes nunca lo tuvieron, y aun así creyeron que habían rendido mejor [3853]. Unos manguitos que no hunden, pero que tampoco enseñan a nadar.", "mio": false}, {"nombre": "Óscar Román", "tipo": "pregunta", "texto": "Valeria, si mañana un instituto prohíbe la inteligencia artificial, ¿el alumno deja de tenerla en el móvil por la tarde, o la sigue usando, pero sin ningún profesor delante?", "mio": false}, {"nombre": "Valeria Domínguez", "tipo": "respuesta", "texto": "La sigue usando, Óscar, y no venimos a prohibir. Pero inevitable no es lo mismo que beneficioso. El GPS también está en todos los móviles, y quien más lo usa peor se orienta sin él [3855]. La pregunta es si le enseña.", "mio": false}, {"nombre": "Javier Serrano", "tipo": "pregunta", "texto": "Vuestra vara mira al alumno sin la herramienta. Si el profesor recupera casi una de cada tres tardes de preparación, ¿eso cuenta como beneficio para el sistema o no?", "mio": false}, {"nombre": "Valeria Domínguez", "tipo": "respuesta", "texto": "Cuenta, Javier, y lo concedo, es un beneficio, pero es un medio. La tarde que gana el profesor se pierde si su alumno, en casa, le pide la solución completa, como uno de cada tres [3864]. Lo que el sistema produce se mide en el alumno.", "mio": false}, {"nombre": "Laura Pérez", "tipo": "pregunta", "texto": "Valeria, dijiste que juzgáis el ChatGPT del móvil a solas. Una herramienta que elige el centro y guía un profesor, ¿queda fuera de vuestro debate o también la juzgáis?", "mio": false}, {"nombre": "Valeria Domínguez", "tipo": "respuesta", "texto": "También la juzgamos, Laura. Y tampoco aprueba nuestra prueba, porque en PNAS el tutor diseñado frenó la caída, pero no mejoró el examen [3853]. Y en primaria, más de ocho de cada diez docentes señalan que les faltan conocimientos [3861]. Ese profesor guía, hoy, todavía falta.", "mio": false}]}], "feedbacks": [{"ronda": "Ronda 1", "sala": "Sala 1", "enlace": "rondas/R1/R1D1/visor.html", "contexto": "a favor, contra Kairós", "jueces": [{"juez": "Carmen Llorens", "titulo": "jueza de fondo", "texto": "Noelia Cano."}, {"juez": "Álex Moreno", "titulo": "juez de forma", "texto": "Noelia Cano: apertura brillante. Usar la portada de la carta para decir que lo que trata a todos igual es la fotocopia, y no el chatbot, es original y engancha desde la primera frase. Definiciones limpias («saldo positivo, no riesgo cero»). A mejorar: el bloque central amontona ocho fichas en cuatro minutos. Elegid cuatro o cinco y dejad que cada una respire, como hiciste con «de cada tres tardes, casi una vuelve». En el examen cruzado, antes de aceptar un criterio del rival, reformúlalo en vuestros términos (por ejemplo: «lo que sabe sin ella, y también lo que gana el sistema con el tiempo del profesor»). Aceptarlo tal cual le dio al rival la vara para todo el debate."}, {"juez": "Isabel Garrigós", "titulo": "jueza principal", "texto": "Noelia Cano (introductora). El comienzo es excelente: resignificar la portada (lo que uniforma es la fotocopia, no el chatbot) contextualiza y engancha a la vez. Las definiciones son precisas y el criterio es claro, y las respuestas del examen cruzado fueron honestas y con evidencia («Hoy, Julia», y separar mitigación de mejora). A mejorar: cuando os pregunten por la vara, respondedla sin entregarla del todo. Algo como «las dos cosas: lo que sabe sin ella y lo que aprende con ella guiado» os habría evitado que el rival construyera todo su caso con vuestras palabras."}], "equipo": "**Carmen Llorens (jueza de fondo):** **Equipo.** Construisteis el caso sobre evidencias sólidas y variadas (varios ensayos aleatorizados, datos oficiales españoles) y las usasteis con prudencia: «saldo positivo, no riesgo cero», «se mitigó, no os lo vendo como mejora». Sacasteis concesiones claras y las recordasteis hasta el final. Puntos a mejorar: (1) Vuestra definición compara «con IA frente a sin IA», pero vuestro criterio compara «con profesor frente a sin profesor». Son comparaciones distintas, y el rival os lo señaló con «inevitable no es beneficioso». Elegid una y justificadla. (2) Jugasteis casi todo el debate en la imagen del rival, los manguitos. Volved antes a la vuestra. (3) Cuando el rival matiza un dato vuestro, reconoced el dato completo en lugar de pedirle una cifra a él.\n\n**Noelia Cano.** Exordio muy original: dar la vuelta a la portada (el blíster es la fotocopia, no el chatbot) es contextualizar de verdad, no repetir la carta. Definiciones claras y tres pasos fáciles de seguir. En el examen cruzado respondiste con honestidad y con dato. A mejorar: al aceptar «lo que sabe cuando se la quitan» le diste al rival su vara. Puedes aceptarla, pero añade «y también lo que gana el sistema a través del profesor», para que el tiempo docente entre en el criterio. «De cada tres tardes, casi una vuelve» estira el dato del 31% de planificación: cíñete a él.\n\n**Javier Serrano.** Recoger las concesiones del examen cruzado y darle la vuelta al estudio de PNAS fue muy eficaz, y tu interpelación sobre el grupo de control de Nigeria fue la pregunta más afilada del debate. A mejorar: el «solo en casa» no estaba en la ficha. Comprueba el contexto de cada estudio antes de caracterizarlo (la rectificación, eso sí, fue impecable). Respondiste a pocas piezas del rival: el GPS es una analogía y el 31% no es «el uso». «No cuesta un euro» es un añadido sin prueba.\n\n**Laura Pérez.** Muy buena organización por choques, y Lucía hace concreto el argumento de equidad. Tu pregunta sobre Stanford fue decisiva. A mejorar: «el profesor marca la diferencia y la herramienta la multiplica» le regaló al rival el «multiplica por uno». Tu propia ficha [3610] dice que en Nigeria los docentes no impartían instrucción directa: úsala. En el choque de los 9 dólares, reconoce los 48 y 124 dólares de tu ficha; seguían siendo más baratos que una academia y habrías cerrado el choque con honestidad. El rival aplica una doble vara («vuestros pilotos, nuestro lunes», cuando PNAS también es un experimento) y no la aprovechaste.\n\n**Óscar Román.** Cierre circular con el taco de fotocopias, y la imagen de las tres fichas y la llamada a la familia de Aitana es concreta y emotiva. Repasaste bien las concesiones. Tu pregunta en el examen cruzado sacó un «no venimos a prohibir» muy útil. A mejorar: «formada en días» exagera, porque esos tres días eran para un programa ya montado. Contra el «ojalá» tenías la mejor respuesta y no la pusiste delante: el ensayo inglés solo necesitó ChatGPT y una guía. Es un beneficio de hoy que no depende de ningún monitor. «Esperar sin hacer nada» atribuye al rival una carga que no tiene.\n\n**Álex Moreno (juez de forma):** Equipo: muy cohesionados. Os citáis entre vosotros (el «con profesor o sin él» de Noelia vuelve en todos) y el taco de fotocopias abre y cierra el debate. El mayor margen de mejora está en el marco. Dejasteis que la metáfora del rival (manguitos, socorristas) ocupara toda la tarde. Reclamad antes vuestra imagen en las refutaciones, no solo en la conclusión. Os quedaron sin responder los detectores [3862], el GPS y el aplazamiento europeo [3863]. Tampoco usasteis que PNAS también es un experimento controlado, igual que los «pilotos» que os reprochaban.\n\nNoelia Cano: apertura brillante. Usar la portada de la carta para decir que lo que trata a todos igual es la fotocopia, y no el chatbot, es original y engancha desde la primera frase. Definiciones limpias («saldo positivo, no riesgo cero»). A mejorar: el bloque central amontona ocho fichas en cuatro minutos. Elegid cuatro o cinco y dejad que cada una respire, como hiciste con «de cada tres tardes, casi una vuelve». En el examen cruzado, antes de aceptar un criterio del rival, reformúlalo en vuestros términos (por ejemplo: «lo que sabe sin ella, y también lo que gana el sistema con el tiempo del profesor»). Aceptarlo tal cual le dio al rival la vara para todo el debate.\n\nJavier Serrano: muy buena estructura con la «pregunta de claustro» (quién lo paga, quién lo forma, cuándo), y la réplica a los manguitos («nadie deja al niño solo») es eficaz. «Nadie cerró la imprenta. Se abrieron escuelas» es la mejor frase de tu turno. Corregiste el error con elegancia. A mejorar: revisa la ficha antes de describirla, porque PNAS eran sesiones en el instituto y no deberes en casa, y el rival lo recordó varias veces. Usa menos citas seguidas. Cuando el rival concede un beneficio, sopésalo de forma explícita frente a su daño en lugar de solo anotarlo.\n\nLaura Pérez: la oradora más completa de vuestro lado. Lucía convierte la estadística en una persona, el polideportivo le da la vuelta a la metáfora del rival y respondiste a las interpelaciones con evidencia (Stanford) sin perder el hilo. A mejorar: en la refutación cruzada citaste seis fichas en 90 segundos, y en ese turno el jurado necesita una idea por choque. El argumento de Stanford es vuestra mejor arma contra la vara del rival: dilo pronto y sin rodeos («esos alumnos nunca tocaron la IA y aprendieron más: pasan vuestra prueba»).\n\nÓscar Román: gran cierre. Volviste a la fotocopiadora y la escena de Lucía, Hugo y Aitana se recuerda. «Esperar sin hacer nada es un ojalá. Formar al profesor que ya está en el aula es un plan» es un giro excelente. Tu interpelación («¿placebo o saldo positivo?») fue de las mejores preguntas del debate. A mejorar: no vuelvas a aceptar en la conclusión la vara del rival, reformúlala. Recupera tu propia interpelación para sopesar el tiempo del profesor frente a la ilusión de aprendizaje, que fue el punto en el que el rival os apretó.\n\n**Isabel Garrigós (jueza principal):** **En equipo.** El caso es sólido y muy bien estructurado: tiempo, refuerzo e implantación, con un criterio claro (la prueba del lunes) y evidencias variadas y de peso (Inglaterra, Gallup, Banco Mundial, Stanford, EsadeEcPol, TALIS). Supisteis sacar concesiones en los exámenes cruzados y en las interpelaciones y volver a ellas en cada turno. Tenéis tres cosas que mejorar. (1) Acabasteis debatiendo dentro de la metáfora del rival (la piscina): si traéis una imagen propia (el taco de fotocopias, que era muy buena), mantenedla viva en las refutaciones. (2) Vuestra mejor respuesta al «es un ojalá» era que el ahorro de tiempo docente es de hoy y no necesita formación especial (Inglaterra: solo ChatGPT y una guía). Apareció en el examen cruzado y luego desapareció. (3) La carta habla de evaluación, de normativa europea y de protección de datos de menores, y teníais fichas para eso ([3612], [3614]) que no usasteis.\n\n**Noelia Cano (introductora).** El comienzo es excelente: resignificar la portada (lo que uniforma es la fotocopia, no el chatbot) contextualiza y engancha a la vez. Las definiciones son precisas y el criterio es claro, y las respuestas del examen cruzado fueron honestas y con evidencia («Hoy, Julia», y separar mitigación de mejora). A mejorar: cuando os pregunten por la vara, respondedla sin entregarla del todo. Algo como «las dos cosas: lo que sabe sin ella y lo que aprende con ella guiado» os habría evitado que el rival construyera todo su caso con vuestras palabras.\n\n**Javier Serrano (refutador 1).** Muy buen giro de los manguitos (al lado siempre hay alguien mirando), gran uso de las concesiones y una estructura memorable: quién lo paga, quién lo forma y cuándo. A mejorar, y es lo más importante: no adornéis nunca una evidencia. Lo de «solo en casa» no estaba en el estudio, y la corrección en directo os costó credibilidad justo en vuestra respuesta a la prueba central del rival. Antes de describir el contexto de un estudio (dónde, quién, cómo), comprobadlo en la ficha. Supiste rectificar con elegancia, y eso está bien.\n\n**Laura Pérez (refutadora 2 y de la refutación cruzada).** La interpelación sobre Stanford es de lo mejor del debate: corta, cerrada y con una concesión que pesó. Recorriste los choques en orden, devolviste la pregunta de Valeria y Lucía funciona como relato. A mejorar: cuando el rival ataca una cifra (los 9 $ marginales), contestad con la cifra completa, que también está en vuestra ficha: 48 $ por alumno en el piloto frente al coste de una academia. «No han dado ninguna cifra» traslada la carga. Y en la refutación cruzada no recortéis la precisión («por alumno adicional»), porque ahí es donde más se nota.\n\n**Óscar Román (conclusor).** Buena pregunta en el examen cruzado (prohibir no quita la herramienta) y un final muy visual y emotivo: tres fichas, la madre de Aitana, Lucía en junio. Cerraste el círculo con el taco. A mejorar: pondera de forma explícita contra el marco del rival. Si os dicen «beneficios de piloto», contestad que PNAS también es un experimento y que Inglaterra y Gallup son uso real. Apoyarse en «el rival no propone nada» rinde poco, porque el en contra no necesita plan. Lo que convence es demostrar por qué el saldo ya es positivo hoy."}]}, {"nombre": "Tomás Lledó", "equipo": "Kairós", "puesto": "refutador1", "puntos": 2, "nominaciones": 1, "notas": [4.3], "media": 4.3, "slug": "tomas-lledo", "puesto_txt": "Refutación 1", "intervenciones": [{"ronda": "Ronda 1", "sala": "Sala 1", "enlace": "rondas/R1/R1D1/visor.html", "fase": "Examen cruzado a Brújula (a favor)", "n": 2, "nota": null, "turnos": [{"nombre": "Marcos Peris", "tipo": "pregunta", "texto": "Vuestra prueba del lunes, ¿mira lo que el alumno entrega con la inteligencia artificial delante o lo que sabe hacer cuando se la quitan?", "mio": false}, {"nombre": "Noelia Cano", "tipo": "respuesta", "texto": "Lo que sabe cuando se la quitan, Marcos. Por eso no defendemos el ChatGPT sin barreras. El ensayo de la Academia de Ciencias [3613] mide justo eso, y con un tutor que guía y un profesor detrás, el daño se mitiga en gran medida.", "mio": false}, {"nombre": "Julia Arnau", "tipo": "pregunta", "texto": "Si tres de cada cuatro profesores de secundaria dicen no saber enseñar con ella, ¿la inteligencia artificial es beneficiosa hoy en España o lo será cuando estén formados?", "mio": false}, {"nombre": "Noelia Cano", "tipo": "respuesta", "texto": "Hoy, Julia. En el ensayo inglés solo les dieron ChatGPT y una guía, y ya prepararon las clases en casi un tercio menos de tiempo [3601]. Formar al resto cuesta tres días [3610], no una generación. Beneficiosa hoy, y más cuando estén formados.", "mio": false}, {"nombre": "Tomás Lledó", "tipo": "pregunta", "texto": "En ese ensayo de la Academia de Ciencias, con el tutor diseñado, ¿el examen sin inteligencia artificial mejoró o solo se mitigó el daño?", "mio": true}, {"nombre": "Noelia Cano", "tipo": "respuesta", "texto": "Se mitigó, Tomás, y no os lo vendo como mejora. Ese estudio prueba que decide el diseño, porque sin barreras hay daño y con tutor se frena en gran medida [3613]. La mejora la mide el Banco Mundial en Nigeria, año y medio en seis semanas [3604].", "mio": false}, {"nombre": "Valeria Domínguez", "tipo": "pregunta", "texto": "Noelia, la tutoría de Nigeria que citáis, ¿era el ChatGPT que el alumno ya lleva en el móvil o un programa diseñado y supervisado a propósito?", "mio": false}, {"nombre": "Noelia Cano", "tipo": "respuesta", "texto": "Supervisado a propósito, Valeria, y eso es justo nuestra tesis. Los chavales iban a sesiones con un profesor formado en tres días que guiaba y vigilaba el uso [3610]. No defendemos el móvil a solas, sino eso, que cuesta nueve dólares por alumno adicional [3605].", "mio": false}]}, {"ronda": "Ronda 1", "sala": "Sala 1", "enlace": "rondas/R1/R1D1/visor.html", "fase": "Primera refutación de Kairós (en contra)", "n": 6, "nota": 4.3, "turnos": [{"nombre": "Tomás Lledó", "tipo": "discurso", "texto": "Javier nos ha dicho que a un niño con manguitos nadie lo deja solo, que al lado siempre hay alguien mirando. Tiene razón. Pero fijaos en qué hace ese alguien. El socorrista no te enseña a nadar, vigila que no te ahogues. Y eso, exactamente eso, es lo que Brújula nos ha ofrecido esta tarde.\n\nOs propongo tres paradas. Primero, el socorrista, es decir, su tutor bien diseñado. Después, el refuerzo de Nigeria y quién hace hoy de socorrista en España. Y al final, por qué el manguito sigue intacto.\n\nEmpiezo por el socorrista. Javier dice que con un tutor que guía el daño se mitiga. Mitiga, no mejora. Se lo pregunté a Noelia y me respondió con una honestidad que le agradezco, «se mitigó, Tomás, y no os lo vendo como mejora». El ensayo de PNAS, el mismo que citó Noelia, lo confirma. Los del tutor diseñado no rindieron mejor que quienes nunca lo tuvieron, y aun así creyeron que sí [3853].\n\nY ahora medidlo con su propia vara. Javier dice que nadie le va a quitar la herramienta al alumno. Se la quita cada examen, y Noelia aceptó que eso es lo que cuenta. Pues en su mejor versión, con barreras y en un aula, el examen sin la herramienta no mejora. Y una herramienta que, bien diseñada, te deja igual y encima te convence de que has mejorado no es beneficiosa. Es un placebo con wifi. Y como esto os toca de lleno, Brújula, os dejo la palabra.", "mio": true}, {"nombre": "Laura Pérez", "tipo": "interpelacion", "texto": "Tomás, dices que con barreras el examen no mejora. En Nigeria, con un profesor guiando, ¿los alumnos se quedaron igual o avanzaron lo de año y medio de escuela?", "mio": false}, {"nombre": "Tomás Lledó", "tipo": "respuesta", "texto": "Avanzaron, Laura, no lo discuto. Con un profesor que guiaba y vigilaba, como dijo Noelia. Eso es una clase con monitor, no el manguito del bolsillo. ¿Y dónde está hoy ese monitor en España?", "mio": true}, {"nombre": "Tomás Lledó", "tipo": "discurso", "texto": "Y Laura me lleva a la segunda parada, el refuerzo, que Javier nos echaba en cara. Noelia nos pidió pensar en lo que cuesta una hora de academia. Pensémoslo. La academia cuesta porque alguien se sienta a tu lado y no te deja copiar. Lo gratis, lo que el chaval sin academia tiene esta noche, no es el programa de Nigeria. Es la aplicación del móvil. Y según la OCDE, casi uno de cada tres alumnos europeos, españoles incluidos, le pide la solución completa [3864]. Un profesor particular que te hace los deberes no es un profesor. Es un primo listo.\n\n¿Y quién hace hoy de monitor en España? Javier le contestó a Valeria que el profesor que ya está en el aula. Pero ese profesor nos dice que todavía no sabe nadar en esta piscina. Según TALIS 2024, la falta de conocimientos es su primera barrera, y en primaria la señalan más de ocho de cada diez [3861]. ¿Y quién garantiza que lo formen? Europa no, porque su reglamento, reformado este julio, se conforma con promover la alfabetización, sin garantizar ningún nivel [3863].\n\nJavier decía que nadie cerró la imprenta, que se abrieron escuelas. Exacto, Javier. Primero las escuelas. Lo que nos pedís es aplaudir la imprenta con la escuela todavía en obras. Y como sé que aquí tenéis algo que decir, Brújula, os escucho.", "mio": true}, {"nombre": "Óscar Román", "tipo": "interpelacion", "text
