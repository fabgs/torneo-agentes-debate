o": "Tomás, si con el tutor diseñado el alumno queda igual en el examen y el profesor recupera casi una de cada tres tardes, ¿eso es un placebo o un saldo positivo?", "mio": false}, {"nombre": "Tomás Lledó", "tipo": "respuesta", "texto": "Placebo, Óscar. No queda igual: queda igual y convencido de que ha mejorado [3853], y quien cree que ya sabe no pide ayuda. Una tarde libre no compensa un error que nadie ve.", "mio": true}, {"nombre": "Tomás Lledó", "tipo": "discurso", "texto": "Y eso me lleva a la última parada, por qué el manguito sigue intacto. Javier no negó el dato de Valeria, dijo que no es su herramienta. Con ChatGPT practicaban mejor y, cuando se lo quitaron, sacaron un diecisiete por ciento menos que quienes nunca lo tuvieron [3852]. Y no en casa, sino en un instituto, como Julia le recordó a Javier. Ese ChatGPT no es una caricatura, es el que casi uno de cada tres usa para pedir la solución completa [3864]. Su tutor diseñado es de piloto. Lo que hay el lunes es el manguito.\n\nRecapitulo. El socorrista frena el daño, pero no enseña. El refuerzo gratis es un primo listo. Y el monitor prometido dice hoy que le falta formación.\n\nBrújula nos ha demostrado lo bien que flota un alumno con inteligencia artificial. No se lo discutimos. Pero nadie se examina con manguitos. Y el día que se los quitan, flotar no es nadar. Por eso, no.", "mio": true}]}, {"ronda": "Ronda 1", "sala": "Sala 1", "enlace": "rondas/R1/R1D1/visor.html", "fase": "Segunda refutación de Brújula (a favor)", "n": 7, "nota": null, "turnos": [{"nombre": "Laura Pérez", "tipo": "discurso", "texto": "Tomás ha cerrado diciendo que nadie se examina con manguitos. Tiene razón. Pero cualquiera que haya apuntado a un crío a natación en el polideportivo sabe que el primer mes va con manguitos y con un monitor al lado, y que al final del verano nada solo. Esa es nuestra piscina, y Tomás la ha descrito mejor que yo. Cuando le pregunté por Nigeria, me contestó «avanzaron, Laura, no lo discuto», y añadió «eso es una clase con monitor». Exacto, Tomás, eso defendemos desde el principio.\n\nQuedan tres choques abiertos. Primero, si la herramienta enseña o solo hace flotar. Segundo, quién paga el refuerzo de la chica de segundo de la ESO sin academia. Y tercero, quién hace hoy de monitor en España.\n\nEmpiezo por el primero, el placebo con wifi. Kairós dice que el tutor diseñado mitiga, pero no mejora, y Noelia nunca os lo vendió de otra manera. Pero fijaos en lo que prueba ese ensayo de PNAS [3613]. No prueba si la inteligencia artificial sirve, sino que importa cuál entra en clase. Con un ChatGPT sin barreras, el alumno se hunde, y con un tutor que guía, ese daño se frena en gran medida. La mejora la mide otro estudio, el del Banco Mundial en Nigeria [3604], donde con un profesor guiando los chavales avanzaron en seis semanas lo de año y medio o dos de escuela normal. Un placebo es una pastilla de azúcar, y con azúcar nadie avanza año y medio. Y aquí, Kairós, acepto vuestra primera pregunta.", "mio": false}, {"nombre": "Valeria Domínguez", "tipo": "interpelacion", "texto": "Si en PNAS el tutor diseñado no mejoró el examen y en Nigeria sí, ¿no es el profesor que guiaba en Nigeria, y no la máquina, lo que marca la diferencia?", "mio": false}, {"nombre": "Laura Pérez", "tipo": "respuesta", "texto": "Las dos cosas, Valeria, y por eso decimos herramienta. En Stanford todos tenían un tutor de carne y hueso, y aquellos cuyo tutor usaba además la inteligencia artificial dominaron más temas [3606]. El profesor marca la diferencia y la herramienta la multiplica.", "mio": false}, {"nombre": "Laura Pérez", "tipo": "discurso", "texto": "Y fijaos en la pregunta de Valeria, porque nos da la razón. Si lo que marca la diferencia es el profesor que guía, no dejemos la herramienta sola en el bolsillo, pongámosla en sus manos. Y lo mismo vale para lo que decía Tomás, que el alumno sale convencido de haber mejorado. ¿Quién lo baja de esa nube? Su profesora, con un examen sin la máquina delante.\n\nPaso al segundo choque, el del primo listo. Os presento a Lucía. Está en segundo de la ESO, las fracciones se le atragantan y en su casa no llega para academia. Tomás tiene razón en una cosa, la academia funciona porque alguien se sienta a tu lado. Pero ¿qué le ofrece Kairós a Lucía esta noche? No vienen a prohibir, así que le dejan justo el primo listo, el móvil a solas. Nosotros le ofrecemos lo contrario, un tutor en el instituto con su profesora al lado, como en Nigeria, donde costó nueve dólares por cada alumno adicional [3605]. Comparadlo con la academia que hoy pagan casi la mitad de las familias [3607]. A los nueve dólares, Tomás no ha dicho ni una palabra. Porque el primo listo no es nuestro modelo, es lo que le queda a Lucía cuando nadie le ofrece otra cosa. Y aquí, Kairós, os concedo vuestra segunda pregunta.", "mio": false}, {"nombre": "Tomás Lledó", "tipo": "interpelacion", "texto": "En Stanford, quien usaba la inteligencia artificial era el tutor humano, no el alumno. ¿Eso no prueba que ayuda al profesor, no que enseñe al alumno?", "mio": true}, {"nombre": "Laura Pérez", "tipo": "respuesta", "texto": "Prueba justo lo que defendemos, Tomás, una herramienta en manos del profesor. Pero en Nigeria la usaban los propios alumnos, con un profesor guiando [3604], y tú mismo concediste que avanzaron. Ayuda a los dos.", "mio": false}, {"nombre": "Laura Pérez", "tipo": "discurso", "texto": "Y eso me lleva al último choque, quién hace hoy de monitor. Tomás nos dice que ese profesor «todavía no sabe nadar en esta piscina» y que la escuela sigue en obras. Pero esas obras no se terminan esperando, se terminan formando. Según TALIS, solo uno de cada diez docentes la tiene prohibida [3609]. Eso no es una piscina cerrada, es un monitor que espera su cursillo, y en Nigeria bastaron tres días [3610]. Y mientras esperamos, Lucía sigue esta noche sola con el móvil.\n\nRecapitulo los tres choques. La herramienta enseña cuando alguien guía, y Tomás concedió que en Nigeria avanzaron. El refuerzo cuesta nueve dólares, no una academia, y nadie lo ha discutido. Y el monitor se forma en días, no en generaciones.\n\nVolvamos al polideportivo. Primero manguitos y monitor, y al final del verano Lucía nada sola, sin academia y sin la misma fotocopia que los otros veintinueve. Por eso, sí.", "mio": false}]}], "feedbacks": [{"ronda": "Ronda 1", "sala": "Sala 1", "enlace": "rondas/R1/R1D1/visor.html", "contexto": "en contra, contra Brújula", "jueces": [{"juez": "Carmen Llorens", "titulo": "jueza de fondo", "texto": "Tomás Lledó."}, {"juez": "Álex Moreno", "titulo": "juez de forma", "texto": "Tomás Lledó: los mejores giros retóricos del debate. «El socorrista no te enseña a nadar, vigila que no te ahogues», «placebo con wifi», «primo listo», «primero las escuelas». Hoja de ruta clara y recapitulación limpia. A mejorar: «No queda igual: queda igual y convencido…» suena contradictorio. Ensaya la frase para que la idea llegue a la primera. La etiqueta de placebo era vulnerable a Nigeria, que tú mismo concediste: anticipa esa objeción antes de lanzarla."}, {"juez": "Isabel Garrigós", "titulo": "jueza principal", "texto": "Tomás Lledó (refutador 1). Gran pregunta en el examen cruzado (¿mitigó o mejoró?), muy buenas fórmulas («placebo con wifi», «primo listo») y una estructura en tres paradas fácil de seguir. A mejorar: ante la interpelación sobre Nigeria concediste sin tener lista la objeción de fondo (era un programa entero, no se sabe qué parte pone la máquina), que llegó después con Julia. Llevad esa respuesta preparada desde la primera refutación. Y «una tarde libre no compensa un error que nadie ve» necesita un mecanismo que la conecte con el aprendizaje del alumno."}], "equipo": "**Carmen Llorens (jueza de fondo):** **Equipo.** Caso muy coherente, con una imagen central (manguitos) que acabó organizando todo el debate, un estribillo memorable y una lectura precisa de vuestras fichas de PNAS, TALIS y el Ómnibus. Usasteis muy bien la carta («deja de lado la intervención humana») y el marco español. Puntos a mejorar: (1) Las metáforas no pueden cargar con el peso de la inferencia: «placebo», «primo listo» y «ojalá» necesitan un dato debajo. (2) Concedisteis Nigeria, Stanford y el tiempo docente sin tener preparada una ponderación probada de por qué pesan menos. (3) Si exigís datos de España y no de pilotos, aplicad la misma exigencia a vuestro estudio estrella. (4) La repetición del estribillo os quitó tiempo para argumentar.\n\n**Valeria Domínguez.** Exordio excelente, y tomar la respuesta de Noelia como vara común fue una jugada estratégica de primer nivel. Usaste los datos con precisión. A mejorar: «El manguito no es el mal uso. Es el uso» generaliza a todos lo que hace un 31%, y tu propia ficha dice que los usos más comunes son informarse y que les expliquen conceptos. El GPS es una analogía: preséntala como tal y apóyala en evidencia directa sobre IA. En el examen cruzado, conceder el tiempo docente como beneficio sin una respuesta probada de por qué es «solo un medio» os dejó expuestos toda la tarde. El argumento de los detectores se perdió por el camino: si lo traes, que alguien lo recoja.\n\n**Tomás Lledó.** Convertir al socorrista en alguien que «vigila, no enseña» fue un gran giro, y «mitiga, no mejora» va a la raíz de la ficha. Estructura en tres paradas muy clara. A mejorar: «placebo con wifi» exagera, porque un placebo no hace nada y ese tutor mejoró la práctica y no dañó el examen. «Quien cree que ya sabe no pide ayuda» es plausible, pero no lo probaste. Antes de conceder Nigeria sin matices, prepara las distinciones: el contexto de partida, que la prueba incluía conocimientos de IA y que en inglés el efecto fue menor.\n\n**Julia Arnau.** La refutación más técnica del debate: la distinción entre coste marginal y coste de montaje, y el problema de que Nigeria mezcla programa y herramienta, son exactos. Tu interpelación pilló un error de caracterización del rival. A mejorar: dijiste que la máquina «multiplica por uno» y en la misma intervención concediste Stanford, que es justo una comparación con y sin IA manteniendo al humano. Si te retiras a «la usaba el tutor», necesitas un argumento de por qué los beneficios del docente no cuentan para el sistema. En la refutación cruzada, «no hace falta la cifra» es lógicamente correcto: desarróllalo con el dato y no con la frase.\n\n**Marcos Peris.** Tu pregunta en el examen cruzado marcó el debate. La conclusión tuvo una estructura de ponderación clara («¿por qué pesa más lo nuestro?») y un cierre emotivo muy logrado («una mano que sabe cuándo soltarte»). A mejorar: «sus beneficios son de piloto y nuestros daños, del uso que hay el lunes» no se sostiene del todo, porque vuestro PNAS es también un experimento de campo y el ahorro de tiempo docente no dependía de ningún programa. Despachar ese beneficio como «un medio» exigía una prueba de que ese tiempo se pierde.\n\n**Álex Moreno (juez de forma):** Equipo: el marco más coherente de la tarde. Los manguitos atraviesan las cuatro voces, cada orador cita con precisión lo que concedió el rival y el cierre «Flotar no es nadar. Por eso, no» da unidad. A mejorar: el estribillo «la pregunta no es qué hace por el alumno, sino qué sabe cuando se la quitan» sonó demasiadas veces, y repetido deja de cortar. Más allá del diagnóstico, no ofrecisteis una alternativa para el alumno que ya usa la IA en casa, y el rival lo explotó. No respondisteis a la norma de centro [3603] ni sopesasteis de verdad el tiempo del profesor que concedisteis.\n\nValeria Domínguez: apertura excelente. Los manguitos se entienden al instante y «Manguitos hay para todos. Socorristas, todavía no» es de esos finales que se recuerdan. Capturaste en el acto el criterio que concedió el rival, con mucha agilidad. A mejorar: «El manguito no es el mal uso. Es el uso» convierte un 31 % en la norma. Di «uno de cada tres» y deja que la cifra pese sola. En el examen cruzado, cuando concedas un beneficio, sopésalo en la misma respuesta. «Es un medio» se quedó corto y el rival lo usó todo el debate.\n\nTomás Lledó: los mejores giros retóricos del debate. «El socorrista no te enseña a nadar, vigila que no te ahogues», «placebo con wifi», «primo listo», «primero las escuelas». Hoja de ruta clara y recapitulación limpia. A mejorar: «No queda igual: queda igual y convencido…» suena contradictorio. Ensaya la frase para que la idea llegue a la primera. La etiqueta de placebo era vulnerable a Nigeria, que tú mismo concediste: anticipa esa objeción antes de lanzarla.\n\nJulia Arnau: tu interpelación sobre «en casa» fue precisa y cambió el tono del choque. Leer los 9 $ como coste marginal y plantear el problema de atribución en Nigeria fueron argumentos finos. A mejorar: usaste el estribillo cuatro veces en dos turnos; guárdalo para el último golpe. «Multiplicar por uno» choca con Stanford: allí los alumnos aprendieron más sin tocar la herramienta. Respóndelo con tu propia vara en lugar de desplazarte a «la usaba el tutor».\n\nMarcos Peris: tu pregunta del examen cruzado marcó el criterio de todo el debate, y la conclusión tiene la imagen más emotiva de la tarde («una mano que sabe cuándo soltarte», «un manguito que no se desinfla nunca»). La ponderación también es clara (piloto frente a lunes, el daño que no se nota). A mejorar: «sus beneficios son de piloto» deja un flanco abierto, porque PNAS también es un experimento controlado. Anticípalo. Y dedica una frase a explicar por qué el tiempo del profesor pesa menos, en lugar de solo recordar que es un medio.\n\n**Isabel Garrigós (jueza principal):** **En equipo.** Tenéis un sistema de imágenes muy cohesionado (manguitos, GPS, imprenta, socorrista) que todo el equipo mantuvo y que marcó el terreno del debate. Usasteis con inteligencia la definición de la carta («deja de lado la intervención humana») y supisteis fijar el criterio desde el examen cruzado. Las evidencias son fieles a las fichas. Tenéis tres cosas que mejorar. (1) Dependéis mucho de una sola ficha ([3853]): diversificad, porque si os la neutralizan os quedáis sin caso. (2) Restringir el debate a «la IA tal como entra hoy» (el móvil a solas) necesita más justificación: la carta describe también centros que la integran de forma guiada. (3) Algunos saltos lógicos os dejaron expuestos: «multiplicar por uno», «el manguito es el uso» a partir de un 31 %, o «la tarde se pierde si el alumno copia».\n\n**Valeria Domínguez (introductora).** Un comienzo de los que se recuerdan, con los manguitos y una pregunta directa al jurado. Buen aprovechamiento de la carta y de las respuestas del examen cruzado, y tres pasos claros con evidencia bien elegida. A mejorar: en el examen cruzado concediste «es un beneficio» sin un marco preparado, y el rival lo usó todo el debate. Preparad cómo conceder conteniendo, por ejemplo «beneficio para el docente que no llega al alumno sin X». Y cuando generalicéis a partir de una encuesta, anticipad la objeción: la misma ficha de la OCDE dice que la mayoría la usa para informarse y que le expliquen conceptos.\n\n**Tomás Lledó (refutador 1).** Gran pregunta en el examen cruzado (¿mitigó o mejoró?), muy buenas fórmulas («placebo con wifi», «primo listo») y una estructura en tres paradas fácil de seguir. A mejorar: ante la interpelación sobre Nigeria concediste sin tener lista la objeción de fondo (era un programa entero, no se sabe qué parte pone la máquina), que llegó después con Julia. Llevad esa respuesta preparada desde la primera refutación. Y «una tarde libre no compensa un error que nadie ve» necesita un mecanismo que la conecte con el aprendizaje del alumno.\n\n**Julia Arnau (refutadora 2 y de la refutación cruzada).** La interpelación que destapó el «en casa» fue precisa y oportuna, y la lectura de los 9 $ como coste marginal fue de lo más sólido de vuestro caso. La refutación cruzada fue limpia, con la imagen del «ojalá». A mejorar: «multiplicar por uno» mezclaba el tutor de PNAS sin docente con el docente que usa la herramienta, y la pregunta sobre Stanford lo desmontó. Si concedéis que la herramienta funciona en manos del profesor, explicad por qué eso no cuenta como beneficio para el sistema, porque la pregunta habla del sistema y no solo del alumno.\n\n**Marcos Peris (conclusor).** La pregunta que fijó la vara fue estratégica y muy bien formulada. La conclusión pondera de forma explícita (daños del lunes frente a beneficios de piloto, el daño que el alumno no nota) y el cierre de la mano que sabe cuándo soltarte es contundente. A mejorar: «sus beneficios son de piloto» es vulnerable, porque vuestro estudio estrella también es un experimento y algunas pruebas del rival (Inglaterra, Gallup) son uso real. Y afirmar que PNAS es el único sitio donde se midió con y sin la máquina exagera la evidencia: un rival atento os lo habría devuelto."}]}, {"nombre": "Marcos Peris", "equipo": "Kairós", "puesto": "conclusor", "puntos": 1, "nominaciones": 1, "notas": [4.7], "media": 4.7, "slug": "marcos-peris", "puesto_txt": "Conclusión", "intervenciones": [{"ronda": "Ronda 1", "sala": "Sala 1", "enlace": "rondas/R1/R1D1/visor.html", "fase": "Examen cruzado a Brújula (a favor)", "n": 2, "nota": null, "turnos": [{"nombre": "Marcos Peris", "tipo": "pregunta", "texto": "Vuestra prueba del lunes, ¿mira lo que el alumno entrega con la inteligencia artificial delante o lo que sabe hacer cuando se la quitan?", "mio": true}, {"nombre": "Noelia Cano", "tipo": "respuesta", "texto": "Lo que sabe cuando se la quitan, Marcos. Por eso no defendemos el ChatGPT sin barreras. El ensayo de la Academia de Ciencias [3613] mide justo eso, y con un tutor que guía y un profesor detrás, el daño se mitiga en gran medida.", "mio": false}, {"nombre": "Julia Arnau", "tipo": "pregunta", "texto": "Si tres de cada cuatro profesores de secundaria dicen no saber enseñar con ella, ¿la inteligencia artificial es beneficiosa hoy en España o lo será cuando estén formados?", "mio": false}, {"nombre": "Noelia Cano", "tipo": "respuesta", "texto": "Hoy, Julia. En el ensayo inglés solo les dieron ChatGPT y una guía, y ya prepararon las clases en casi un tercio menos de tiempo [3601]. Formar al resto cuesta tres días [3610], no una generación. Beneficiosa hoy, y más cuando estén formados.", "mio": false}, {"nombre": "Tomás Lledó", "tipo": "pregunta", "texto": "En ese ensayo de la Academia de Ciencias, con el tutor diseñado, ¿el examen sin inteligencia artificial mejoró o solo se mitigó el daño?", "mio": false}, {"nombre": "Noelia Cano", "tipo": "respuesta", "texto": "Se mitigó, Tomás, y no os lo vendo como mejora. Ese estudio prueba que decide el diseño, porque sin barreras hay daño y con tutor se frena en gran medida [3613]. La mejora la mide el Banco Mundial en Nigeria, año y medio en seis semanas [3604].", "mio": false}, {"nombre": "Valeria Domínguez", "tipo": "pregunta", "texto": "Noelia, la tutoría de Nigeria que citáis, ¿era el ChatGPT que el alumno ya lleva en el móvil o un programa diseñado y supervisado a propósito?", "mio": false}, {"nombre": "Noelia Cano", "tipo": "respuesta", "texto": "Supervisado a propósito, Valeria, y eso es justo nuestra tesis. Los chavales iban a sesiones con un profesor formado en tres días que guiaba y vigilaba el uso [3610]. No defendemos el móvil a solas, sino eso, que cuesta nueve dólares por alumno adicional [3605].", "mio": false}]}, {"ronda": "Ronda 1", "sala": "Sala 1", "enlace": "rondas/R1/R1D1/visor.html", "fase": "Conclusión de Kairós (en contra)", "n": 11, "nota": 4.7, "turnos": [{"nombre": "Marcos Peris", "tipo": "discurso", "texto": "Laura ha cerrado diciendo que la elección es monitor o soledad. Lo firmamos. El problema es que hoy, en el sistema educativo español, el monitor todavía no ha llegado. Y eso decide el debate.\n\nLa vara no la elegimos solos. Cuando le pregunté a Noelia qué miraba su prueba del lunes, me contestó «lo que sabe cuando se la quitan». Con esa regla, nuestra tesis sigue en pie. La inteligencia artificial, tal como entra hoy en las aulas, es un manguito que hace flotar el ejercicio y hunde el aprendizaje.\n\nEl primer choque era si enseña o solo hace flotar. Brújula trajo Nigeria y Stanford, y los concedimos. Pero en Stanford la usaba el tutor, que ya sabe nadar, como la calculadora en manos de quien ya sabe sumar. Y en Nigeria, como reconoció Laura, el profesor marca la diferencia. El único sitio donde se midió al alumno con la máquina y sin ella fue el ensayo de PNAS, y allí ni el tutor diseñado mejoró el examen, aunque creyeron que sí [3853]. Noelia fue honesta, «no os lo vendo como mejora». Su mejor prueba de la herramienta es una prueba del monitor.\n\nEl segundo choque era la alternativa real, y la frase decisiva no es nuestra, es de Laura. «Lucía sigue esta noche sola con el móvil.» Ese es el sistema de hoy. El sí de Brújula necesita un profesor que guíe, y ese profesor dice que le faltan conocimientos, más de ocho de cada diez en primaria [3861]. Y un sí que depende de que llegue el socorrista no es un sí. Es un ojalá.\n\nEl tercero era el tiempo del profesor. Valeria lo concedió, es un beneficio, pero es un medio. El sistema se mide en lo que sabe el alumno.\n\n¿Y por qué pesa más lo nuestro? Porque sus beneficios son de piloto y nuestros daños, del uso que hay el lunes. Y porque nuestro daño no lo nota ni el propio alumno, y lo que nadie nota, nadie lo corrige. ¿Quién paga ese ojalá? Lucía.\n\nAl principio, Valeria sacó estos manguitos y os preguntó cómo aprendisteis a nadar. Nos pasó a todos. Hubo un día en que alguien, en el momento justo, os soltó la mano. Os dio miedo, tragasteis agua y, al tercer intento, nadasteis. Eso es el sistema educativo, una mano que sabe cuándo soltarte. La inteligencia artificial, tal como ha llegado a las aulas, es un manguito que no se desinfla nunca. Nunca te suelta, y por eso nunca te enseña.\n\nNo os pedimos que tiréis los manguitos al fondo de la piscina. Os pedimos que no confundáis flotar con nadar. Porque el día que nuestros alumnos salgan del sistema, nadie les preguntará qué entregaron. Les quitarán los manguitos y mirarán si nadan. Flotar no es nadar. Por eso, no.", "mio": true}]}], "feedbacks": [{"ronda": "Ronda 1", "sala": "Sala 1", "enlace": "rondas/R1/R1D1/visor.html", "contexto": "en contra, contra Brújula", "jueces": [{"juez": "Carmen Llorens", "titulo": "jueza de fondo", "texto": "Marcos Peris."}, {"juez": "Álex Moreno", "titulo": "juez de forma", "texto": "Marcos Peris: tu pregunta del examen cruzado marcó el criterio de todo el debate, y la conclusión tiene la imagen más emotiva de la tarde («una mano que sabe cuándo soltarte», «un manguito que no se desinfla nunca»). La ponderación también es clara (piloto frente a lunes, el daño que no se nota). A mejorar: «sus beneficios son de piloto» deja un flanco abierto, porque PNAS también es un experimento controlado. Anticípalo. Y dedica una frase a explicar por qué el tiempo del profesor pesa menos, en lugar de solo recordar que es un medio."}, {"juez": "Isabel Garrigós", "titulo": "jueza principal", "texto": "Marcos Peris (conclusor). La pregunta que fijó la vara fue estratégica y muy bien formulada. La conclusión pondera de forma explícita (daños del lunes frente a beneficios de piloto, el daño que el alumno no nota) y el cierre de la mano que sabe cuándo soltarte es contundente. A mejorar: «sus beneficios son de piloto» es vulnerable, porque vuestro estudio estrella también es un experimento y algunas pruebas del rival (Inglaterra, Gallup) son uso real. Y afirmar que PNAS es el único sitio donde se midió con y sin la máquina exagera la evidencia: un rival atento os lo habría devuelto."}], "equipo": "**Carmen Llorens (jueza de fondo):** **Equipo.** Caso muy coherente, con una imagen central (manguitos) que acabó organizando todo el debate, un estribillo memorable y una lectura precisa de vuestras fichas de PNAS, TALIS y el Ómnibus. Usasteis muy bien la carta («deja de lado la intervención humana») y el marco español. Puntos a mejorar: (1) Las metáforas no pueden cargar con el peso de la inferencia: «placebo», «primo listo» y «ojalá» necesitan un dato debajo. (2) Concedisteis Nigeria, Stanford y el tiempo docente sin tener preparada una ponderación probada de por qué pesan menos. (3) Si exigís datos de España y no de pilotos, aplicad la misma exigencia a vuestro estudio estrella. (4) La repetición del estribillo os quitó tiempo para argumentar.\n\n**Valeria Domínguez.** Exordio excelente, y tomar la respuesta de Noelia como vara común fue una jugada estratégica de primer nivel. Usaste los datos con precisión. A mejorar: «El manguito no es el mal uso. Es el uso» generaliza a todos lo que hace un 31%, y tu propia ficha dice que los usos más comunes son informarse y que les expliquen conceptos. El GPS es una analogía: preséntala como tal y apóyala en evidencia directa sobre IA. En el examen cruzado, conceder el tiempo docente como beneficio sin una respuesta probada de por qué es «solo un medio» os dejó expuestos toda la tarde. El argumento de los detectores se perdió por el camino: si lo traes, que alguien lo recoja.\n\n**Tomás Lledó.** Convertir al socorrista en alguien que «vigila, no enseña» fue un gran giro, y «mitiga, no mejora» va a la raíz de la ficha. Estructura en tres paradas muy clara. A mejorar: «placebo con wifi» exagera, porque un placebo no hace nada y ese tutor mejoró la práctica y no dañó el examen. «Quien cree que ya sabe no pide ayuda» es plausible, pero no lo probaste. Antes de conceder Nigeria sin matices, prepara las distinciones: el contexto de partida, que la prueba incluía conocimientos de IA y que en inglés el efecto fue menor.\n\n**Julia Arnau.** La refutación más técnica del debate: la distinción entre coste marginal y coste de montaje, y el problema de que Nigeria mezcla programa y herramienta, son exactos. Tu interpelación pilló un error de caracterización del rival. A mejorar: dijiste que la máquina «multiplica por uno» y en la misma intervención concediste Stanford, qu la herramienta funciona en manos del profesor, explicad por qué eso no cuenta como beneficio para el sistema, porque la pregunta habla del sistema y no solo del alumno.\n\n**Marcos Peris (conclusor).** La pregunta que fijó la vara fue estratégica y muy bien formulada. La conclusión pondera de forma explícita (daños del lunes frente a beneficios de piloto, el daño que el alumno no nota) y el cierre de la mano que sabe cuándo soltarte es contundente. A mejorar: «sus beneficios son de piloto» es vulnerable, porque vuestro estudio estrella también es un experimento y algunas pruebas del rival (Inglaterra, Gallup) son uso real. Y afirmar que PNAS es el único sitio donde se midió con y sin la máquina exagera la evidencia: un rival atento os lo habría devuelto."}]}, {"nombre": "Valeria Domínguez", "equipo": "Kairós", "puesto": "introductor", "puntos": 1, "nominaciones": 1, "notas": [4.7, 3.7], "media": 4.2, "slug": "valeria-dominguez", "puesto_txt": "Introducción", "intervenciones": [{"ronda": "Ronda 1", "sala": "Sala 1", "enlace": "rondas/R1/R1D1/visor.html", "fase": "Examen cruzado a Brújula (a favor)", "n": 2, "nota": null, "turnos": [{"nombre": "Marcos Peris", "tipo": "pregunta", "texto": "Vuestra prueba del lunes, ¿mira lo que el alumno entrega con la inteligencia artificial delante o lo que sabe hacer cuando se la quitan?", "mio": false}, {"nombre": "Noelia Cano", "tipo": "respuesta", "texto": "Lo que sabe cuando se la quitan, Marcos. Por eso no defendemos el ChatGPT sin barreras. El ensayo de la Academia de Ciencias [3613] mide justo eso, y con un tutor que guía y un profesor detrás, el daño se mitiga en gran medida.", "mio": false}, {"nombre": "Julia Arnau", "tipo": "pregunta", "texto": "Si tres de cada cuatro profesores de secundaria dicen no saber enseñar con ella, ¿la inteligencia artificial es beneficiosa hoy en España o lo será cuando estén formados?", "mio": false}, {"nombre": "Noelia Cano", "tipo": "respuesta", "texto": "Hoy, Julia. En el ensayo inglés solo
