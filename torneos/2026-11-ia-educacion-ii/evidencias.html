ucción en el mercado, la puesta en servicio para este fin específico o el uso de sistemas de IA para inferir las emociones de una persona física en los lugares de trabajo y en los centros educativos, excepto cuando el sistema de IA esté destinado a ser instalado o introducido en el mercado por motivos médicos o de seguridad; [...] Artículo 113: [...] a) los capítulos I y II serán aplicables a partir del 2 de febrero de 2025.", "cita_original": "", "pagina": 51, "localizada": true, "origen": "Ficha de Brújula", "usos": [], "incidencias": [], "favor": 0, "contra": 0, "total": 0}, {"id": "3614", "postura": "favor", "tipo": "dato oficial", "fecha": "2026", "tag": "Protección de menores al día: desde el 2 de diciembre de 2026 la UE prohíbe la IA que genera desnudos falsos de personas identificables sin consentimiento; y las obligaciones de alto riesgo en educación (anexo III) se aplazan al 2 de diciembre de 2027", "fuente": "Reglamento (UE) 2026/1744 del Parlamento Europeo y del Consejo, de 8 de julio de 2026, por el que se modifican los Reglamentos (UE) 2024/1689, (UE) 2018/1139 y (UE) 2023/1230 (Ómnibus digital sobre IA). DOUE L, 24.7.2026. Artículo 1, puntos 7 (nuevo art. 5.1 b bis) y 40 (art. 113 del Reglamento de IA).", "url": "https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=OJ:L_202601744", "cita": "7) El artículo 5 se modifica como sigue: a) en el apartado 1, párrafo primero, se insertan las letras siguientes: «b bis) la introducción en el mercado, la puesta en servicio o la utilización de un sistema de IA que genere o manipule imágenes, vídeos o audios realistas o material similar de las partes íntimas de una persona física identificable, o de una persona física identificable que participe en actividades sexualmente explícitas, sin el consentimiento libre, específico, informado e inequívoco y explícito de dicha persona para tal generación o manipulación; [...]» [...] 40) En el artículo 113, el párrafo tercero se modifica como sigue: a) la letra a) se sustituye por el texto siguiente: «a) los capítulos I y II serán aplicables a partir del 2 de febrero de 2025, a excepción del artículo 5, apartado 1, párrafo primero, letras b bis) y b ter), y el artículo 5, apartado 1 bis, y apartado 1 ter, que serán aplicables a partir del 2 de diciembre de 2026;» ; b) la letra c) se sustituye por el texto siguiente: «c) el capítulo III, secciones 1, 2 y 3, con excepción de su artículo 6, apartado 5, será aplicable a partir del: i) 2 de diciembre de 2027 en lo que respecta a los sistemas de IA clasificados como de alto riesgo en virtud del artículo 6, apartado 2, y el anexo III [...]", "cita_original": "", "pagina": 18, "localizada": true, "origen": "Ficha de Brújula", "usos": [], "incidencias": [], "favor": 0, "contra": 0, "total": 0}, {"id": "3851", "postura": "contra", "tipo": "informe", "fecha": "2026", "tag": "La OCDE lo resume: la IA generalista sube la nota del ejercicio, pero cuando se retira, el alumno rinde un 17 % peor; mejora la tarea, no el aprendizaje", "fuente": "OCDE (2026). OECD Digital Education Outlook 2026: Exploring Effective Uses of Generative AI in Education. OECD Publishing, París.", "url": "https://www.oecd.org/content/dam/oecd/en/publications/reports/2026/01/oecd-digital-education-outlook-2026_940e0dd8/062a7394-en.pdf", "cita": "Sin embargo, la evidencia muestra que la dependencia excesiva de herramientas de IA generativa que dan respuestas directas puede reducir la implicación activa del alumnado, mejorando el rendimiento en la tarea sin las correspondientes ganancias de aprendizaje. Cuando se usa como atajo y no como herramienta de aprendizaje, la IA generativa puede desplazar el esfuerzo cognitivo y debilitar las habilidades que sustentan el aprendizaje profundo. Por ejemplo, un experimento de campo en Turquía halló que, aunque el acceso a GPT-4 mejoró el rendimiento a corto plazo —un 48 % con la interfaz estándar y un 127 % con una versión tutora diseñada para apoyar el aprendizaje—, los alumnos rindieron un 17 % peor una vez retirado el acceso, lo que muestra que la IA generativa puede socavar el aprendizaje salvo que esté diseñada expresamente para apoyar la adquisición de habilidades.", "cita_original": "However, evidence shows that overreliance on generative AI tools that provide direct answers can reduce students' active engagement, improving task performance without corresponding learning gains. When used as a shortcut rather than a learning tool, generative AI can displace cognitive effort and weaken the skills that underpin deep learning. For example, a field experiment in Türkiye found that while access to GPT-4 improved short-term performance – by 48% with the standard interface, and by 127% with a tutoring version designed to support learning – students performed 17% worse once access was removed, showing that generative AI can undermine learning unless explicitly designed to support skill acquisition.", "pagina": 5, "localizada": true, "origen": "Ficha de Kairós", "usos": [], "incidencias": [], "favor": 0, "contra": 0, "total": 0}, {"id": "3854", "postura": "contra", "tipo": "estudio", "fecha": "2025", "tag": "Escribes con ChatGPT y a los minutos no sabes citar tu propio texto: el 83,3 % del grupo con IA no pudo, frente al 11,1 % de quienes escribieron solos o con buscador (MIT)", "fuente": "Kosmyna, N., Hauptmann, E., Yuan, Y. T., Situ, J., Liao, X.-H., Beresnitzky, A. V., Braunstein, I. y Maes, P. (2025). Your Brain on ChatGPT: Accumulation of Cognitive Debt when Using an AI Assistant for Essay Writing Task. MIT Media Lab, preprint arXiv:2506.08872 (en revisión).", "url": "https://arxiv.org/pdf/2506.08872", "cita": "La precisión al citar fue significativamente distinta entre condiciones experimentales (Figura 6). En el grupo asistido por LLM, el 83,3 % de los participantes (15/18) no logró aportar una cita correcta, mientras que solo el 11,1 % (2/18) de los grupos de buscador y de solo cerebro tuvo la misma dificultad. [...] Estos resultados indican que depender de un LLM perjudicó sustancialmente la capacidad de los participantes para producir citas precisas.", "cita_original": "Quoting accuracy was significantly different across experimental conditions (Figure 6). In the LLM-assisted group, 83.3% of participants (15/18) failed to provide a correct quotation, whereas only 11.1% (2/18) in both the Search-Engine and Brain-Only groups encountered the same difficulty. [...] These results indicate that reliance on an LLM substantially impaired participants' ability to produce accurate quotes,", "pagina": 1, "localizada": true, "origen": "Ficha de Kairós", "usos": [], "incidencias": [], "favor": 0, "contra": 0, "total": 0}, {"id": "3856", "postura": "contra", "tipo": "estudio", "fecha": "2025", "tag": "Cuanto más se confía en la IA, menos se piensa críticamente (encuesta Microsoft Research y Carnegie Mellon a 319 profesionales, CHI 2025)", "fuente": "Lee, H.-P., Sarkar, A., Tankelevitch, L., Drosos, I., Rintel, S., Banks, R. y Wilson, N. (2025). The Impact of Generative AI on Critical Thinking: Self-Reported Reductions in Cognitive Effort and Confidence Effects From a Survey of Knowledge Workers. CHI '25, ACM.", "url": "https://www.microsoft.com/en-us/research/wp-content/uploads/2025/01/lee_2025_ai_critical_thinking_survey.pdf", "cita": "Cuantitativamente, teniendo en cuenta factores de la tarea y del usuario, la autoconfianza del usuario en la tarea y su confianza en la IA generativa predicen si se ejerce el pensamiento crítico y el esfuerzo que supone hacerlo en tareas asistidas por IA generativa. En concreto, una mayor confianza en la IA generativa se asocia con menos pensamiento crítico, mientras que una mayor autoconfianza se asocia con más pensamiento crítico.", "cita_original": "Quantitatively, when considering both task- and user-specific factors, a user's task-specific self-confidence and confidence in GenAI are predictive of whether critical thinking is enacted and the effort of doing so in GenAI-assisted tasks. Specifically, higher confidence in GenAI is associated with less critical thinking, while higher self-confidence is associated with more critical thinking.", "pagina": 1, "localizada": true, "origen": "Ficha de Kairós", "usos": [], "incidencias": [], "favor": 0, "contra": 0, "total": 0}, {"id": "3857", "postura": "contra", "tipo": "experto", "fecha": "2025", "tag": "Respuesta a «también se temió a la imprenta y a la calculadora»: los propios investigadores de Microsoft dicen que esta vez la preocupación no es infundada; automatizar lo rutinario atrofia el juicio", "fuente": "Lee, H.-P., Sarkar, A., Tankelevitch, L., Drosos, I., Rintel, S., Banks, R. y Wilson, N. (2025). The Impact of Generative AI on Critical Thinking: Self-Reported Reductions in Cognitive Effort and Confidence Effects From a Survey of Knowledge Workers. CHI '25, ACM.", "url": "https://www.microsoft.com/en-us/research/wp-content/uploads/2025/01/lee_2025_ai_critical_thinking_survey.pdf", "cita": "Las herramientas de IA generativa [...] son las últimas de una larga serie de tecnologías que suscitan dudas sobre su impacto en la calidad del pensamiento humano, una serie que incluye la escritura (objetada por Sócrates), la imprenta (objetada por Tritemio), las calculadoras (objetadas por los profesores de aritmética) e internet. Esa inquietud no es infundada. Usadas de forma inadecuada, las tecnologías pueden provocar, y provocan, el deterioro de facultades cognitivas que deberían preservarse. Como señaló Bainbridge, una ironía clave de la automatización es que, al mecanizar las tareas rutinarias y dejar al usuario humano la gestión de las excepciones, se le priva de las oportunidades rutinarias de ejercitar su juicio y fortalecer su musculatura cognitiva, dejándola atrofiada y sin preparación cuando las excepciones llegan.", "cita_original": "Generative AI (GenAI) tools, [...] are the latest in a long line of technologies that raise questions about their impact on the quality of human thought, a line that includes writing (objected to by Socrates), printing (objected to by Trithemius), calculators (objected to by teachers of arithmetic), and the Internet. Such consternation is not unfounded. Used improperly, technologies can and do result in the deterioration of cognitive faculties that ought to be preserved. As Bainbridge [7] noted, a key irony of automation is that by mechanising routine tasks and leaving exception-handling to the human user, you deprive the user of the routine opportunities to practice their judgement and strengthen their cognitive musculature, leaving them atrophied and unprepared when the exceptions do arise.", "pagina": 1, "localizada": false, "origen": "Ficha de Kairós", "usos": [], "incidencias": [], "favor": 0, "contra": 0, "total": 0}, {"id": "3858", "postura": "contra", "tipo": "caso", "fecha": "2025", "tag": "Caso Terranova (Canadá): el plan educativo a 10 años, que pedía enseñar ética de la IA, citaba al menos 15 fuentes inexistentes, presuntamente inventadas por IA", "fuente": "Butler, P. (2025, 12 de septiembre). N.L.'s 10-year education action plan cites sources that don't exist. CBC News / Radio-Canada.", "url": "https://www.cbc.ca/news/canada/newfoundland-labrador/education-accord-nl-sources-dont-exist-1.7631364", "cita": "Publicado el mes pasado, el informe final de Education Accord NL, una hoja de ruta a 10 años para mejorar las escuelas públicas y las instituciones postsecundarias de la provincia, incluye al menos 15 citas de artículos y documentos inexistentes. [...] «Los errores ocurren. Las citas inventadas son algo totalmente distinto: básicamente demuelen la fiabilidad del material», dijo Josh Lepawsky [...]. Una de las 110 llamadas a la acción del informe establece que el gobierno de Terranova y Labrador debería «proporcionar a alumnos y docentes conocimientos esenciales sobre IA, incluidos ética, privacidad de datos y uso responsable de la tecnología».", "cita_original": "Released last month, the Education Accord NL final report, a 10-year roadmap for improving the province's public schools and post-secondary institutions, includes at least 15 citations for non-existent journal articles and documents. [...] \"Errors happen. Made-up citations are a totally different thing where you essentially demolish the trustworthiness of the material,\" said Josh Lepawsky [...]. One of the report's 110 calls to action states the Newfoundland and Labrador government should \"provide learners and educators with essential AI knowledge, including ethics, data privacy, and responsible technology use.\"", "pagina": 3, "localizada": true, "origen": "Ficha de Kairós", "usos": [], "incidencias": [], "favor": 0, "contra": 0, "total": 0}, {"id": "3859", "postura": "contra", "tipo": "estudio", "fecha": "2025", "tag": "La Wikipedia que se inventa la bibliografía: en 2025, GPT-4o inventó 1 de cada 5 referencias y casi dos tercios eran falsas o erróneas; peor cuanto más especializado el tema", "fuente": "Linardon, J. et al. (2025). Influence of Topic Familiarity and Prompt Specificity on Citation Fabrication in Mental Health Research Using Large Language Models: Experimental Study. JMIR Mental Health, 12, e80371.", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC12658395/", "cita": "En las 6 revisiones, GPT-4o generó 176 citas; 35 (19,9 %) eran inventadas. De las 141 citas reales, 64 (45,4 %) contenían errores, sobre todo identificadores DOI incorrectos o no válidos. [...] La invención de citas y los errores bibliográficos siguen siendo comunes en los resultados de GPT-4o: casi dos tercios de las citas son inventadas o inexactas. La fiabilidad varió sistemáticamente según lo conocido del trastorno y la especificidad de la instrucción, con mayores riesgos en temas de salud mental menos visibles o más especializados.", "cita_original": "Across the 6 reviews, GPT-4o generated 176 citations; 35 (19.9%) were fabricated. Among the 141 real citations, 64 (45.4%) contained errors, most frequently incorrect or invalid digital object identifiers. [...] Citation fabrication and bibliographic errors remain common in GPT-4o outputs, with nearly two-thirds of citations being fabricated or inaccurate. Reliability systematically varied by disorder familiarity and prompt specificity, with greater risks in less visible or specialized mental health topics.", "pagina": 1, "localizada": true, "origen": "Ficha de Kairós", "usos": [], "incidencias": [], "favor": 0, "contra": 0, "total": 0}, {"id": "3860", "postura": "contra", "tipo": "dato oficial", "fecha": "2025", "tag": "TALIS 2024 España: el profesorado español es más crítico que la media internacional con los riesgos de la IA, sobre todo plagio y contenidos inapropiados (OCDE: 72 % teme el plagio)", "fuente": "Ministerio de Educación, Formación Profesional y Deportes – INEE (2025). TALIS 2024. Estudio internacional de la enseñanza y del aprendizaje. Informe español. Madrid.", "url": "https://www.libreria.educacion.gob.es/ebook/186474/free_download", "cita": "el riesgo más señalado es el plagio facilitado por la IA, con un promedio del 72 % en la OCDE-27, seguido por la recomendación de contenidos inapropiados (66 %) y la amplificación de sesgos (42 %). [...] En primer lugar, el profesorado español muestra una percepción crítica ante los riesgos asociados al uso de la inteligencia artificial, especialmente en lo relativo al plagio y a la recomendación de contenidos inapropiados, con porcentajes que se sitúan por encima de los promedios internacionales.", "cita_original": "", "pagina": 1, "localizada": true, "origen": "Ficha de Kairós", "usos": [], "incidencias": [], "favor": 0, "contra": 0, "total": 0}], "volver": "torneo.html"}</script>
<script>
(function () {
  'use strict';
  var D = JSON.parse(document.getElementById('datos').textContent);
  var $ = function (id) { return document.getElementById(id); };
  if (D.volver) $('volver').href = D.volver;
  var F = D.fichas, POR_ID = {}, TITULO = document.title;
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function norm(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
  F.forEach(function (f) {
    POR_ID[f.id] = f;
    f._txt = norm([f.id, f.tag, f.fuente, f.cita, f.cita_original, f.tipo, f.origen, f.fecha].join(' '));
  });
  var POST = { favor: ['A favor', 'pf'], contra: ['En contra', 'pc'], neutral: ['Neutral', 'pn'] };
  var LADO = { favor: 'a favor', contra: 'en contra' };
  var ACCION = { pregunta: 'pregunta', respuesta: 'responde', interpelacion: 'interpela', nota: 'nota escrita a su compañero' };
  function badge(p) { var x = POST[p] || ['Sin postura', 'pn']; return '<span class="postura ' + x[1] + '">' + x[0] + '</span>'; }
  function veces(n) { return n + (n === 1 ? ' vez' : ' veces'); }
  function usosTxt(f) {
    if (!f.total) return 'sin citar';
    var r = [f.favor ? f.favor + ' a favor' : '', f.contra ? f.contra + ' en contra' : ''].filter(Boolean).join(' · ');
    return 'citada ' + veces(f.total) + (r ? ' (' + r + ')' : '');
  }

  // ---------- Filtros ----------
  var S = { q: '', postura: '', tipo: '', origen: '', uso: '', orden: 'citas' };
  function contar(clave) { var c = {}; F.forEach(function (f) { c[f[clave]] = (c[f[clave]] || 0) + 1; }); return c; }
  var cp = contar('postura');
  $('fPostura').innerHTML = [['', 'Todas', F.length]].concat(['favor', 'contra', 'neutral'].filter(function (p) { return cp[p]; }).map(function (p) { return [p, POST[p][0], cp[p]]; }))
    .map(function (x) { return '<button type=button data-v="' + x[0] + '" aria-pressed="' + (x[0] === '' ? 'true' : 'false') + '">' + x[1] + ' <small>' + x[2] + '</small></button>'; }).join('');
  var ct = contar('tipo');
  $('fTipo').innerHTML = '<option value="">Todos</option>' + Object.keys(ct).filter(Boolean).sort().map(function (t) { return '<option value="' + esc(t) + '">' + esc(t) + ' (' + ct[t] + ')</option>'; }).join('');
  var co = contar('origen');
  $('fOrigen').innerHTML = '<option value="">Todos</option>' + Object.keys(co).sort(function (a, b) { return a === 'Biblioteca común' ? -1 : b === 'Biblioteca común' ? 1 : a.localeCompare(b); })
    .map(function (o) { return '<option value="' + esc(o) + '">' + esc(o) + ' (' + co[o] + ')</option>'; }).join('');

  function pasa(f) {
    if (S.postura && f.postura !== S.postura) return false;
    if (S.tipo && f.tipo !== S.tipo) return false;
    if (S.origen && f.origen !== S.origen) return false;
    if (S.uso === 'citadas' && !f.total) return false;
    if (S.uso === 'sin' && f.total) return false;
    if (S.uso === 'favor' && !f.favor) return false;
    if (S.uso === 'contra' && !f.contra) return false;
    if (S.uso === 'incidencias' && !f.incidencias.length) return false;
    if (S.q) { var ws = norm(S.q).split(/\s+/).filter(Boolean); for (var i = 0; i < ws.length; i++) if (f._txt.indexOf(ws[i].replace(/^\[|\]$/g, '')) < 0) return false; }
    return true;
  }
  function ordenar(xs) {
    var por = {
      citas: function (a, b) { return b.total - a.total || a.id.localeCompare(b.id, 'es', { numeric: true }); },
      id: function (a, b) { return a.id.localeCompare(b.id, 'es', { numeric: true }); },
      fecha: function (a, b) { return String(b.fecha).localeCompare(String(a.fecha)) || b.total - a.total; }
    };
    return xs.slice().sort(por[S.orden] || por.citas);
  }
  function corto(s, n) { s = String(s || ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; }
  function tarjeta(f) {
    return '<a class=tarjeta href="#' + esc(f.id) + '"><div class=fila1><code>[' + esc(f.id) + ']</code>' + badge(f.postura) +
      (f.tipo ? '<span class=tipo>' + esc(f.tipo) + '</span>' : '') + (f.fecha ? '<span class=muted>' + esc(f.fecha) + '</span>' : '') +
      '<span class=usos>' + usosTxt(f) + '</span></div><p class=tag>' + esc(f.tag) + '</p><p class=fuente>' + esc(corto(f.fuente, 170)) + ' · ' + esc(f.origen) + '</p></a>';
  }
  function lista() {
    var xs = ordenar(F.filter(pasa));
    return '<p class=cuenta>' + xs.length + ' de ' + F.length + ' fichas' + (xs.length < F.length ? ' con estos filtros' : '') + '</p>' +
      (xs.length ? xs.map(tarjeta).join('') : '<p class=muted>Ninguna ficha cumple estos filtros.</p>');
  }

  // ---------- Ficha ----------
  function frase(t, yo) {
    return esc(t).replace(/\[(\d{3,5})\]/g, function (m, id) { return POR_ID[id] ? '<a class="ev' + (id === yo ? ' yo' : '') + '" href="#' + id + '">[' + id + ']</a>' : m; });
  }
  function detalle(f) {
    var h = '<p style="margin:0"><a class=atras href="#">← Volver al banco</a></p><article class=detalle>' +
      '<div class=fila1><code>[' + esc(f.id) + ']</code>' + badge(f.postura) + (f.tipo ? '<span class=tipo>' + esc(f.tipo) + '</span>' : '') +
      (f.fecha ? '<span class=muted>' + esc(f.fecha) + '</span>' : '') + '<span class=muted>' + esc(f.origen) + '</span></div>' +
      '<h2>' + esc(f.tag) + '</h2><p class=fuente>' + esc(f.fuente) + (f.pagina ? ' · pág. ' + esc(f.pagina) : '') + '</p>' +
      '<p class=saltos><span>' + usosTxt(f) + '</span>' +
      (f.incidencias.length ? '<button type=button data-salto=incidencias>' + f.incidencias.length + (f.incidencias.length === 1 ? ' incidencia' : ' incidencias') + ' del jurado ↓</button>' : '') +
      (f.usos.length ? '<button type=button data-salto=usos>Cada frase en que se usó ↓</button>' : '') + '</p>';
    if (f.cita) h += '<blockquote>' + esc(f.cita) + '</blockquote>';
    if (f.cita_original && f.cita_original !== f.cita) h += '<details><summary>Texto original</summary><blockquote class=orig>' + esc(f.cita_original) + '</blockquote></details>';
    if (f.localizada === true) h += '<p class=ok>✓ La cita se encontró literal en el documento descargado.</p>';
    else if (f.localizada === false) h += '<p class=aviso>⚠ No se encontró la cita en el documento descargado (a veces la web bloquea la descarga): compruébala en la fuente.</p>';
    var en = [];
    if (f.url) en.push('<a href="' + esc(f.url) + '" target=_blank rel=noopener>Fuente original ↗</a>');
    if (f.local) en.push('<a href="' + esc(f.local) + '" target=_blank>Documento descargado ↗</a>');
    if (en.length) h += '<p class=enlaces>' + en.join('') + '</p>';
    h += '</article>';
    if (f.incidencias.length) {
      h += '<section class=bloque id=incidencias><h3>Incidencias del jurado</h3>' + f.incidencias.map(function (x) {
        return '<div class=inc><span class=muted>' + esc(x.ronda) + ' · ' + esc(x.sala) + ' · <a href="' + esc(x.enlace) + '">ver la sala</a></span><br>' + frase(x.problema, f.id) + '</div>';
      }).join('') + '</section>';
    }
    h += '<section class=bloque id=usos><h3>Cómo se usó <span class=muted>· ' + usosTxt(f) + '</span></h3>';
    if (f.total) h += '<div class=reparto title="' + f.favor + ' a favor, ' + f.contra + ' en contra"><i class=f style="width:' + (100 * f.favor / f.total) + '%"></i><i class=c style="width:' + (100 * f.contra / f.total) + '%"></i></div>';
    if (!f.usos.length) h += '<p class=muted>Nadie la citó en este torneo.</p>';
    var ultimo = null;
    f.usos.forEach(function (u) {
      if (u.debate !== ultimo) {
        ultimo = u.debate;
        h += '<p class=deb><b>' + esc(u.ronda) + ' · ' + esc(u.sala) + '</b> · ' + esc(u.cruce) + ' · <a href="' + esc(u.enlace) + '">ver la sala</a></p>';
      }
      h += '<div class="uso ' + u.lado + '"><span class=who><b>' + esc(u.quien) + '</b> · ' + esc(u.equipo) + ' (' + LADO[u.lado] + ')' +
        (ACCION[u.tipo] ? ' · ' + ACCION[u.tipo] : '') + ' · ' + esc(u.fase) + (u.veces > 1 ? ' · ' + veces(u.veces) : '') + '</span>' + frase(u.frase, f.id) + '</div>';
    });
    return h + '</section>';
  }

  // ---------- Navegación ----------
  var scrollLista = 0, enFicha = false;
  function pinta() {
    var id = decodeURIComponent(location.hash.slice(1)), f = POR_ID[id];
    if (f) {
      if (!enFicha) scrollLista = window.scrollY;
      enFicha = true;
      $('main').innerHTML = detalle(f); document.body.classList.add('en-ficha');
      document.title = '[' + f.id + '] ' + corto(f.tag, 60) + ' · Evidencias';
      window.scrollTo(0, 0);
    } else {
      var volvia = enFicha;
      enFicha = false;
      $('main').innerHTML = lista(); document.body.classList.remove('en-ficha'); document.title = TITULO;
      if (volvia) window.scrollTo(0, scrollLista);
    }
  }
  function cambio() {
    if (enFicha) { history.pushState(null, '', location.pathname + location.search); enFicha = false; scrollLista = 0; }
    $('main').innerHTML = lista(); document.body.classList.remove('en-ficha'); document.title = TITULO;
  }
  // los saltos no usan el hash, que es la dirección de la ficha
  $('main').addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('button[data-salto]');
    if (b && $(b.dataset.salto)) $(b.dataset.salto).scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  $('q').addEventListener('input', function () { S.q = this.value; cambio(); });
  $('fPostura').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    S.postura = b.dataset.v;
    Array.prototype.forEach.call(this.children, function (x) { x.setAttribute('aria-pressed', String(x === b)); });
    cambio();
  });
  [['fTipo', 'tipo'], ['fOrigen', 'origen'], ['fUso', 'uso'], ['fOrden', 'orden']].forEach(function (x) {
    $(x[0]).addEventListener('change', function () { S[x[1]] = this.value; cambio(); });
  });
  $('limpiar').addEventListener('click', function () {
