<!doctype html><html lang=es><head><meta charset=utf-8><meta name=viewport content="width=device-width, initial-scale=1">
<title>Evidencias · II Torneo de Agentes de Debate</title>
<link rel=stylesheet href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Pixelify+Sans:wght@500;700&display=swap">
<style>
/* Banco de evidencias de un torneo: filtros a la izquierda, lista o ficha a la derecha. Mismo mundo visual que las demás páginas del torneo. */
:root{--bg:#15121c;--panel:#201b2a;--panel2:#2a2337;--line:#3a3149;--ink:#efe9f7;--muted:#a89ebb;--accent:#bb86fc;--a:#5b8cff;--b:#ff6b8b;--ok:#2ecc71;--warn:#f1c40f;color-scheme:dark}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 Inter,system-ui,sans-serif;padding:20px max(16px,env(safe-area-inset-left,0px)) 48px max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,270px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.wrap{grid-template-columns:minmax(0,1fr)} body.en-ficha .filtros{display:none}}
h1,h2,h3{font-family:"Pixelify Sans",ui-monospace,monospace;font-weight:700;margin:0} h1{font-size:30px} h2{font-size:21px;line-height:1.25} h3{font-size:16px;font-weight:500;margin-bottom:8px}
header{grid-column:1/-1;display:grid;gap:6px} .volver{justify-self:start;font-family:"Pixelify Sans",monospace;color:var(--ink);text-decoration:none;background:var(--panel2);padding:6px 10px}
.muted{color:var(--muted);font-size:13.5px} a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.filtros{background:var(--panel);padding:14px;display:grid;gap:12px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;box-sizing:border-box}
@media (max-width:820px){.filtros{position:static;max-height:none}}
.campo{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.campo input,.campo select{font:inherit;font-size:14px;color:var(--ink);background:var(--panel2);border:1px solid var(--line);padding:7px 9px;min-width:0;width:100%;box-sizing:border-box}
.grupo{display:grid;gap:6px;font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chips button,.limpiar{font:inherit;font-size:13px;color:var(--ink);background:var(--panel2);border:0;padding:5px 9px;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--accent);color:#1c1925;font-weight:600}
.limpiar{justify-self:start;color:var(--muted)}
main{display:grid;gap:10px;min-width:0}
.cuenta{margin:0;color:var(--muted);font-size:13.5px}
.tarjeta{display:block;background:var(--panel);padding:12px 14px;text-decoration:none;color:var(--ink);border-left:3px solid transparent}
.tarjeta:hover{background:#262033;border-left-color:var(--accent)}
.fila1{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:13px}
.fila1 code{font-size:13.5px;color:var(--ink)}
.usos{margin-left:auto;color:var(--muted)}
.tag{margin:6px 0 2px;font-size:14.5px}
.fuente{margin:0;font-size:12.5px;color:var(--muted)}
.postura{font-size:12px;font-weight:600;padding:1px 6px;border-radius:3px;white-space:nowrap}
.pf{background:#5b8cff2e;color:#b8ccff} .pc{background:#ff6b8b2e;color:#ffc1cf} .pn{background:#a89ebb26;color:var(--muted)}
.tipo{font-size:12px;color:var(--muted);border:1px solid var(--line);padding:0 6px;border-radius:3px}
.atras{font-family:"Pixelify Sans",monospace;text-decoration:none;color:var(--ink);background:var(--panel2);padding:6px 10px;display:inline-block}
.detalle,.bloque{background:var(--panel);padding:16px 18px}
.detalle h2{margin:8px 0 6px;font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:19px;line-height:1.4;max-width:80ch}
.saltos{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin:10px 0 0;font-size:13.5px}
.saltos button{font:inherit;font-size:13px;color:var(--ink);background:var(--panel2);border:0;padding:5px 9px;cursor:pointer}
.saltos button:hover{background:#352c45}
.detalle .fuente{font-size:13.5px}
blockquote{margin:12px 0;padding-left:12px;border-left:3px solid var(--accent);color:#ddd5ea;max-width:80ch}
blockquote.orig{border-left-color:var(--line);color:var(--muted);font-size:14px}
summary{cursor:pointer;color:var(--accent);font-size:13.5px}
.ok{color:var(--ok);font-size:13.5px;margin:6px 0} .aviso{color:var(--warn);font-size:13.5px;margin:6px 0}
.enlaces{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;margin:10px 0 0}
.deb{margin:14px 0 6px;font-size:13.5px;border-top:1px solid var(--line);padding-top:10px}
.deb:first-of-type{border-top:0;padding-top:0}
.uso{margin:6px 0;padding-left:10px;border-left:3px solid var(--line);max-width:82ch;font-size:14.5px}
.uso.favor{border-left-color:var(--a)} .uso.contra{border-left-color:var(--b)}
.uso .who{display:block;font-size:12.5px;font-weight:600;color:var(--muted)}
.uso.favor .who b{color:#b8ccff} .uso.contra .who b{color:#ffc1cf}
a.ev{font-family:ui-monospace,monospace;font-size:13px;text-decoration:none;background:#ffffff14;padding:0 3px}
a.ev.yo{background:var(--accent);color:#1c1925}
.inc{margin:6px 0;padding-left:10px;border-left:3px solid var(--warn);font-size:14px}
.reparto{display:flex;height:8px;margin:8px 0 2px;max-width:340px;background:var(--panel2)}
.reparto i{display:block;height:100%} .reparto .f{background:var(--a)} .reparto .c{background:var(--b)}
@media (max-width:820px){
  body{padding-top:14px} .wrap{gap:12px} h1{font-size:26px}
  .filtros{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px 8px;padding:12px}
  .filtros .ancho{grid-column:1/-1}
  .campo input,.campo select{font-size:16px;padding:8px}
  .chips button{padding:8px 10px} .limpiar{padding:8px 10px} .volver,.atras{padding:9px 12px}
  .tarjeta{padding:12px} .detalle,.bloque{padding:14px 12px} .detalle h2{font-size:17px}
  .usos{margin-left:0;flex-basis:100%}
}
</style></head><body>

airós (en contra)", "lado": "contra", "equipo": "Kairós", "quien": "Julia Arnau", "tipo": "discurso", "fase": "Segunda refutación de Kairós (en contra)", "veces": 1, "frase": "Pero cuando se midió la herramienta frente a quienes no la tenían, en el ensayo de PNAS, ni el tutor diseñado para guiar mejoró el examen [3853]."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "contra", "equipo": "Kairós", "quien": "Julia Arnau", "tipo": "discurso", "fase": "Segunda refutación de Kairós (en contra)", "veces": 1, "frase": "Era ese tutor de PNAS, que dejó el examen igual y al alumno convencido de haber mejorado [3853]."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "contra", "equipo": "Kairós", "quien": "Julia Arnau", "tipo": "respuesta", "fase": "Segunda refutación de Kairós (en contra)", "veces": 1, "frase": "Donde se comparó con y sin ella, en PNAS, el tutor diseñado no mejoró el examen [3853]."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "contra", "equipo": "Kairós", "quien": "Julia Arnau", "tipo": "respuesta", "fase": "Segunda refutación de Kairós (en contra)", "veces": 1, "frase": "Con el manguito en el brazo del alumno, en PNAS, el examen no mejoró [3853]."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "contra", "equipo": "Kairós", "quien": "Tomás Lledó", "tipo": "nota", "fase": "Segunda refutación de Kairós (en contra)", "veces": 1, "frase": "Su «al final del verano nada solo» no tiene prueba: el PNAS dice que no mejoró [3853]."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "contra", "equipo": "Kairós", "quien": "Julia Arnau", "tipo": "discurso", "fase": "Refutación cruzada de Kairós (en contra)", "veces": 1, "frase": "Y donde se comparó al alumno con manguito y sin él, en PNAS, ni el tutor diseñado mejoró el examen, y encima creyeron que sí [3853]."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "contra", "equipo": "Kairós", "quien": "Marcos Peris", "tipo": "discurso", "fase": "Conclusión de Kairós (en contra)", "veces": 1, "frase": "El único sitio donde se midió al alumno con la máquina y sin ella fue el ensayo de PNAS, y allí ni el tutor diseñado mejoró el examen, aunque creyeron que sí [3853]."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "contra", "equipo": "Kairós", "quien": "Julia Arnau", "tipo": "nota", "fase": "Conclusión de Kairós (en contra)", "veces": 1, "frase": "Nadie de Brújula ha probado mejora sin la máquina delante (en PNAS, solo se mitiga [3853])."}], "incidencias": [{"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "problema": "Lo comprobé. La ficha dice exactamente que el grupo GPT Tutor no rindió mejor que el control y percibió que sí. Kairós la usó con exactitud. Es la ficha que decide el choque sobre la vara."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "problema": "Comprobada, y Kairós la usa con fidelidad en todo el debate: el GPT Tutor no mejoró el examen frente al control, y los alumnos creyeron haber rendido mejor. Marcos Peris dice en la conclusión que PNAS es «el único sitio donde se midió al alumno con la máquina y sin ella». Es una exageración argumental: Nigeria [3604] fue un ensayo aleatorizado con grupo de control y Stanford [3606] asignó el acceso al azar. No se penaliza como dato."}], "favor": 0, "contra": 13, "total": 13}, {"id": "3613", "postura": "favor", "tipo": "estudio", "fecha": "2025", "tag": "Respuesta a «la IA destruye el pensamiento»: el daño viene del ChatGPT sin barreras (-17% en notas cuando se retira), y un tutor diseñado para guiar lo mitiga en gran medida; decide el diseño, no la tecnología", "fuente": "Bastani, H., Bastani, O., Sungu, A., Ge, H., Kabakcı, Ö. y Mariman, R. (2025). Generative AI without guardrails can harm learning: Evidence from high school mathematics. Proceedings of the National Academy of Sciences (PNAS), 122(26), e2422633122. DOI 10.1073/pnas.2422633122. Resumen consultado en RePEc/IDEAS.", "url": "https://ideas.repec.org/a/nas/journl/v122y2025pe2422633122.html", "cita": "Estudiamos esta cuestión mediante un experimento de campo en el que damos acceso a tutores de IA generativa a casi mil estudiantes de matemáticas de secundaria. Para entender el impacto diferencial del diseño de la herramienta en el aprendizaje, desplegamos dos tutores de IA generativa: uno que imita una interfaz estándar de ChatGPT («GPT Base») y otro con instrucciones diseñadas para salvaguardar el aprendizaje («GPT Tutor»). En línea con trabajos previos, nuestros resultados muestran que tener acceso a GPT-4 mientras se resuelven problemas mejora significativamente el rendimiento (un 48 % de mejora en las notas con GPT Base y un 127 % con GPT Tutor). Sin embargo, encontramos además que, cuando después se retira el acceso, los estudiantes rinden en realidad peor que quienes nunca lo tuvieron (un 17 % menos en las notas con GPT Base), es decir, el acceso sin restricciones a GPT-4 puede perjudicar los resultados educativos. Estos efectos negativos sobre el aprendizaje quedan en gran medida mitigados por las salvaguardas de GPT Tutor. Sin barreras, los estudiantes intentan usar GPT-4 como una «muleta» durante las sesiones de práctica y después rinden peor por su cuenta.", "cita_original": "We study this question via a field experiment where we provide nearly a thousand high school math students with access to generative AI tutors. To understand the differential impact of tool design on learning, we deploy two generative AI tutors: one that mimics a standard ChatGPT interface (“GPT Base”) and one with prompts designed to safeguard learning (“GPT Tutor”). Consistent with prior work, our results show that having GPT-4 access while solving problems significantly improves performance (48% improvement in grades for GPT Base and 127% for GPT Tutor). However, we additionally find that when access is subsequently taken away, students actually perform worse than those who never had access (17% reduction in grades for GPT Base)—i.e., unfettered access to GPT-4 can harm educational outcomes. These negative learning effects are largely mitigated by the safeguards in GPT Tutor. Without guardrails, students attempt to use GPT-4 as a “crutch” during practice problem sessions, and subsequently perform worse on their own.", "pagina": 9, "localizada": true, "origen": "Ficha de Brújula", "usos": [{"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "favor", "equipo": "Brújula", "quien": "Noelia Cano", "tipo": "discurso", "fase": "Exposición inicial de Brújula (a favor)", "veces": 1, "frase": "Lo demuestra un ensayo con casi mil alumnos, publicado en la revista de la Academia de Ciencias de Estados Unidos [3613]."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "favor", "equipo": "Brújula", "quien": "Noelia Cano", "tipo": "respuesta", "fase": "Examen cruzado a Brújula (a favor)", "veces": 1, "frase": "El ensayo de la Academia de Ciencias [3613] mide justo eso, y con un tutor que guía y un profesor detrás, el daño se mitiga en gran medida."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "favor", "equipo": "Brújula", "quien": "Noelia Cano", "tipo": "respuesta", "fase": "Examen cruzado a Brújula (a favor)", "veces": 1, "frase": "Ese estudio prueba que decide el diseño, porque sin barreras hay daño y con tutor se frena en gran medida [3613]."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "contra", "equipo": "Kairós", "quien": "Tomás Lledó", "tipo": "nota", "fase": "Exposición inicial de Kairós (en contra)", "veces": 1, "frase": "Noelia ha concedido que con el tutor diseñado el daño solo «se mitigó», no hubo mejora [3613]: úsalo."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "favor", "equipo": "Brújula", "quien": "Javier Serrano", "tipo": "discurso", "fase": "Primera refutación de Brújula (a favor)", "veces": 1, "frase": "Ese diecisiete por ciento menos del ensayo de PNAS [3613] sale del ChatGPT sin barreras, el del alumno solo en casa, el que nosotros no defendemos."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "favor", "equipo": "Brújula", "quien": "Javier Serrano", "tipo": "respuesta", "fase": "Primera refutación de Brújula (a favor)", "veces": 1, "frase": "Con un tutor que guía, el daño se mitiga en gran medida [3613]."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "favor", "equipo": "Brújula", "quien": "Noelia Cano", "tipo": "nota", "fase": "Primera refutación de Brújula (a favor)", "veces": 1, "frase": "Ojo, no digas que el tutor mejoró el examen [3613]."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "favor", "equipo": "Brújula", "quien": "Laura Pérez", "tipo": "discurso", "fase": "Segunda refutación de Brújula (a favor)", "veces": 1, "frase": "Pero fijaos en lo que prueba ese ensayo de PNAS [3613]."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "favor", "equipo": "Brújula", "quien": "Laura Pérez", "tipo": "discurso", "fase": "Refutación cruzada de Brújula (a favor)", "veces": 1, "frase": "Su prueba estrella, PNAS, dice que sin barreras el alumno se hunde y que con un tutor que guía el daño se frena [3613]."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "favor", "equipo": "Brújula", "quien": "Óscar Román", "tipo": "discurso", "fase": "Conclusión de Brújula (a favor)", "veces": 1, "frase": "Hasta el estudio de PNAS dice que sin barreras el alumno se hunde y con un tutor que guía el daño se frena [3613]."}], "incidencias": [{"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "problema": "Javier Serrano dice que el -17% sale del «alumno solo en casa». La ficha (y la 3852) habla de sesiones de práctica de matemáticas en secundaria, no de deberes en casa. Lo rectifica cuando le interpelan. El resto del uso que hace Brújula de esta ficha es fiel: el tutor con barreras «mitiga en gran medida» el daño (largely mitigated)."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "problema": "Javier Serrano dijo que el -17 % salía del 'alumno solo en casa'. La ficha habla de sesiones de práctica de matemáticas en el instituto. Corrigió el error al ser interpelado. El resto de usos de la ficha ('el daño se mitiga en gran medida') es literal y correcto."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "problema": "Javier Serrano (fase 5) dice que el -17 % es «el del alumno solo en casa». La ficha dice que el ChatGPT sin barreras se usó en sesiones de práctica, y el estudio se hizo en institutos. Es falso, y el orador lo corrige tras la interpelación. Se anota falta leve. El resto de usos de [3613] (el daño sin barreras queda «en gran medida mitigado» con GPT Tutor) es fiel a la ficha."}], "favor": 9, "contra": 1, "total": 10}, {"id": "3861", "postura": "contra", "tipo": "dato oficial", "fecha": "2025", "tag": "La imprenta sin alfabetizar: en España la falta de formación es la principal barrera para la IA en el aula, por encima del 80 % en primaria; casi 6 de cada 10 docentes de la UE creen que no debería usarse en la enseñanza", "fuente": "Ministerio de Educación, Formación Profesional y Deportes – INEE (2025). TALIS 2024. Estudio internacional de la enseñanza y del aprendizaje. Informe español. Madrid.", "url": "https://www.libreria.educacion.gob.es/ebook/186474/free_download", "cita": "Por ejemplo, prácticamente la mitad del profesorado en la OCDE-27 y casi seis de cada diez en la UE-22 opinan que la IA no debería usarse en la enseñanza. [...] En primer lugar, el profesorado español identifica la falta de conocimientos como la principal barrera para integrar la IA en el aula, en línea con los promedios internacionales, aunque con mayor incidencia en educación primaria, donde se supera el 80 %.", "cita_original": "", "pagina": 1, "localizada": true, "origen": "Ficha de Kairós", "usos": [{"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "contra", "equipo": "Kairós", "quien": "Valeria Domínguez", "tipo": "discurso", "fase": "Exposición inicial de Kairós (en contra)", "veces": 1, "frase": "En España la herramienta ha llegado antes que la formación, porque según TALIS 2024 la falta de conocimientos es la primera barrera docente, y en primaria la señalan más de ocho de cada diez [3861]."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "contra", "equipo": "Kairós", "quien": "Valeria Domínguez", "tipo": "respuesta", "fase": "Examen cruzado a Kairós (en contra)", "veces": 1, "frase": "Y en primaria, más de ocho de cada diez docentes señalan que les faltan conocimientos [3861]."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "contra", "equipo": "Kairós", "quien": "Tomás Lledó", "tipo": "discurso", "fase": "Primera refutación de Kairós (en contra)", "veces": 1, "frase": "Según TALIS 2024, la falta de conocimientos es su primera barrera, y en primaria la señalan más de ocho de cada diez [3861]."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "contra", "equipo": "Kairós", "quien": "Julia Arnau", "tipo": "discurso", "fase": "Segunda refutación de Kairós (en contra)", "veces": 1, "frase": "Montar el programa es otra cuenta, y en España está sin hacer, porque el profesor dice que su primera barrera es la falta de conocimientos [3861]."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "contra", "equipo": "Kairós", "quien": "Julia Arnau", "tipo": "discurso", "fase": "Segunda refutación de Kairós (en contra)", "veces": 1, "frase": "Que casi nadie la tenga prohibida no significa saber usarla, y en primaria más de ocho de cada diez docentes dicen que les faltan conocimientos [3861]."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "contra", "equipo": "Kairós", "quien": "Julia Arnau", "tipo": "discurso", "fase": "Refutación cruzada de Kairós (en contra)", "veces": 1, "frase": "Basta con demostrar que hoy ese monitor no está, y en primaria más de ocho de cada diez docentes dicen que les faltan conocimientos [3861]."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "contra", "equipo": "Kairós", "quien": "Marcos Peris", "tipo": "nota", "fase": "Refutación cruzada de Kairós (en contra)", "veces": 1, "frase": "Laura dice que no damos cifra del montaje: no hace falta, lo que tenemos que probar es que hoy no lo hay (TALIS, 8 de cada 10 [3861])."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "contra", "equipo": "Kairós", "quien": "Marcos Peris", "tipo": "discurso", "fase": "Conclusión de Kairós (en contra)", "veces": 1, "frase": "El sí de Brújula necesita un profesor que guíe, y ese profesor dice que le faltan conocimientos, más de ocho de cada diez en primaria [3861]."}], "incidencias": [{"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "problema": "Lo comprobé: 'principal barrera' y más del 80 % en primaria. Kairós la usó de forma correcta y constante."}], "favor": 0, "contra": 8, "total": 8}, {"id": "3604", "postura": "favor", "tipo": "estudio", "fecha": "2025", "tag": "Ensayo aleatorizado del Banco Mundial: seis semanas de tutoría con IA en institutos públicos equivalen a 1,5-2 años de escolarización normal, entre los programas más coste-eficaces", "fuente": "De Simone, M., Tiberti, F., Barron Rodriguez, M., Manolio, F., Mosuro, W. y Dikoru, E. J. (2025). From Chalkboards to Chatbots: Evaluating the Impact of Generative AI on Learning Outcomes in Nigeria. Policy Research Working Paper 11125, Banco Mundial (versión actualizada en diciembre de 2025).", "url": "https://documents.worldbank.org/curated/en/099548105192529324/pdf/IDU-c09f40d8-9ff8-42dc-b315-591157499be7.pdf", "cita": "La intervención mostró una mejora significativa de 0,31 desviaciones típicas en una evaluación que incluía contenidos de inglés alineados con el currículo nigeriano, conocimientos de inteligencia artificial y competencias digitales. El efecto en inglés, el resultado principal, fue de 0,23 desviaciones típicas. El análisis coste-efectividad reveló ganancias de aprendizaje sustanciales, equivalentes a 1,5-2 años de escolarización 'normal', lo que sitúa la intervención entre algunos de los programas más coste-eficaces para mejorar los resultados de aprendizaje.", "cita_original": "The intervention demonstrated a significant improvement of 0.31 standard deviation on an assessment that included English topics aligned with the Nigerian curriculum, knowledge of artificial intelligence and digital skills. The effect on English, the main outcome of interest, was of 0.23 standard deviations. Cost-effectiveness analysis revealed substantial learning gains, equating to 1.5 to 2 years of 'business-as-usual' schooling, situating the intervention among some of the most cost-effective programs to improve learning outcomes.", "pagina": 2, "localizada": true, "origen": "Ficha de Brújula", "usos": [{"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "favor", "equipo": "Brújula", "quien": "Noelia Cano", "tipo": "discurso", "fase": "Exposición inicial de Brújula (a favor)", "veces": 1, "frase": "El Banco Mundial probó en institutos públicos de Nigeria seis semanas de tutoría con inteligencia artificial, con un profesor guiando [3604], y esos chavales avanzaron lo que otros en año y medio o dos de escuela normal."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "favor", "equipo": "Brújula", "quien": "Noelia Cano", "tipo": "respuesta", "fase": "Examen cruzado a Brújula (a favor)", "veces": 1, "frase": "La mejora la mide el Banco Mundial en Nigeria, año y medio en seis semanas [3604]."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "favor", "equipo": "Brújula", "quien": "Javier Serrano", "tipo": "discurso", "fase": "Primera refutación de Brújula (a favor)", "veces": 1, "frase": "En Nigeria, con un profesor guiando, seis semanas valieron por año y medio o dos de escuela normal [3604]."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "favor", "equipo": "Brújula", "quien": "Laura Pérez", "tipo": "discurso", "fase": "Segunda refutación de Brújula (a favor)", "veces": 1, "frase": "La mejora la mide otro estudio, el del Banco Mundial en Nigeria [3604], donde con un profesor guiando los chavales avanzaron en seis semanas lo de año y medio o dos de escuela normal."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "favor", "equipo": "Brújula", "quien": "Laura Pérez", "tipo": "respuesta", "fase": "Segunda refutación de Brújula (a favor)", "veces": 1, "frase": "Pero en Nigeria la usaban los propios alumnos, con un profesor guiando [3604], y tú mismo concediste que avanzaron."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "favor", "equipo": "Brújula", "quien": "Laura Pérez", "tipo": "discurso", "fase": "Refutación cruzada de Brújula (a favor)", "veces": 1, "frase": "Y Tomás concedió Nigeria, «avanzaron, Laura» [3604]."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "favor", "equipo": "Brújula", "quien": "Óscar Román", "tipo": "discurso", "fase": "Conclusión de Brújula (a favor)", "veces": 1, "frase": "Tomás, que en Nigeria los chavales avanzaron año y medio de escuela [3604]."}], "incidencias": [{"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "problema": "Uso aceptable pero simplificado. El 0,31 DE corresponde a una prueba que incluía conocimientos de IA y competencias digitales (en inglés, el resultado principal, fue 0,23 DE), y la equivalencia de 1,5-2 años sale del análisis coste-efectividad. Nadie lo cuestionó."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "problema": "'Avanzaron lo que otros en año y medio o dos de escuela normal' simplifica algo la ficha. La equivalencia de 1,5-2 años sale del análisis coste-efectividad (efecto de 0,31 DT, y 0,23 en inglés). Es aceptable y no es falso, pero conviene presentarlo como equivalencia."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "problema": "Comprobada: 1,5-2 años de escolarización normal, ensayo del Banco Mundial en Nigeria. Las dos partes la usan bien. La objeción de Julia Arnau (el efecto no se puede atribuir solo a la máquina porque fue un programa completo) es una lectura legítima."}], "favor": 7, "contra": 0, "total": 7}, {"id": "3610", "postura": "favor", "tipo": "estudio", "fecha": "2025", "tag": "Lo que funciona es IA guiada por el docente: en el piloto del Banco Mundial bastó una formación de tres días para que el profesorado supervisara y orientara su uso", "fuente": "De Simone, M. et al. (2025). From Chalkboards to Chatbots: Evaluating the Impact of Generative AI on Learning Outcomes in Nigeria. Policy Research Working Paper 11125, Banco Mundial.", "url": "https://documents.worldbank.org/curated/en/099548105192529324/pdf/IDU-c09f40d8-9ff8-42dc-b315-591157499be7.pdf", "cita": "Los docentes, que desempeñaron un papel fundamental guiando al alumnado pero sin impartir instrucción directa, participaron en un único programa de formación de tres días con una cohorte. Esta formación les dio a conocer las funcionalidades del modelo de lenguaje y les dotó de técnicas pedagógicas para garantizar su uso responsable y supervisar al alumnado durante las sesiones. También les hizo conscientes de los riesgos potenciales del modelo, como las alucinaciones y los sesgos.", "cita_original": "Teachers, who played a critical role in guiding the students but did not provide direct instruction, participated in a single three-day training program with one cohort. This training introduced teachers to the functionalities of the LLM and equipped them with pedagogical techniques to ensure their responsible use and supervise students during the sessions. It also made them aware of potential risks, such as hallucinations and biases, that the LLM could have.", "pagina": 9, "localizada": true, "origen": "Ficha de Brújula", "usos": [{"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "favor", "equipo": "Brújula", "quien": "Noelia Cano", "tipo": "discurso", "fase": "Exposición inicial de Brújula (a favor)", "veces": 1, "frase": "Eso no se arregla con un candado, sino con formación, y en Nigeria bastaron tres días [3610]."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "favor", "equipo": "Brújula", "quien": "Noelia Cano", "tipo": "respuesta", "fase": "Examen cruzado a Brújula (a favor)", "veces": 1, "frase": "Formar al resto cuesta tres días [3610], no una generación."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "favor", "equipo": "Brújula", "quien": "Noelia Cano", "tipo": "respuesta", "fase": "Examen cruzado a Brújula (a favor)", "veces": 1, "frase": "Los chavales iban a sesiones con un profesor formado en tres días que guiaba y vigilaba el uso [3610]."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "favor", "equipo": "Brújula", "quien": "Javier Serrano", "tipo": "respuesta", "fase": "Primera refutación de Brújula (a favor)", "veces": 1, "frase": "Que diga que le falta formación no es motivo para cerrar la piscina, sino para formarlo, y en Nigeria bastaron tres días [3610]."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "favor", "equipo": "Brújula", "quien": "Laura Pérez", "tipo": "discurso", "fase": "Segunda refutación de Brújula (a favor)", "veces": 1, "frase": "Eso no es una piscina cerrada, es un monitor que espera su cursillo, y en Nigeria bastaron tres días [3610]."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "favor", "equipo": "Brújula", "quien": "Laura Pérez", "tipo": "discurso", "fase": "Refutación cruzada de Brújula (a favor)", "veces": 1, "frase": "Nosotros le ponemos a su profesora al lado, formada en tres días [3610], por nueve dólares por alumno [3605]."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "favor", "equipo": "Brújula", "quien": "Óscar Román", "tipo": "discurso", "fase": "Conclusión de Brújula (a favor)", "veces": 1, "frase": "El nuestro le pone a su profesora al lado, formada en días [3610], a nueve dólares por alumno adicional [3605], cuando hoy la academia la paga casi la mitad de las familias [3607]."}], "incidencias": [{"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "problema": "La ficha dice que los docentes «no impartieron instrucción directa». Ese dato desmonta el argumento de Kairós de que en Nigeria «el profesor marca la diferencia», pero Brújula no lo usó, y Laura Pérez llegó a conceder que el profesor marca la diferencia."}], "favor": 7, "contra": 0, "total": 7}, {"id": "3605", "postura": "favor", "tipo": "estudio", "fecha": "2025", "tag": "Coste real de la tutoría con IA: unos 48 dólares por alumno en el piloto y 9 dólares de coste marginal por alumno adicional", "fuente": "De Simone, M. et al. (2025). From Chalkboards to Chatbots: Evaluating the Impact of Generative AI on Learning Outcomes in Nigeria. Policy Research Working Paper 11125, Banco Mundial, sección 4.1 Cost-Effectiveness.", "url": "https://documents.worldbank.org/curated/en/099548105192529324/pdf/IDU-c09f40d8-9ff8-42dc-b315-591157499be7.pdf", "cita": "Implementar el piloto de 6 semanas para 657 estudiantes supuso un coste por alumno de aproximadamente 48 dólares, y el coste marginal se estima en 9 dólares. Además, extender el piloto a los cuatro trimestres académicos costaría 124 dólares por alumno.", "cita_original": "Implementing the 6-week pilot for 657 students, had a per-pupil cost of approximately $48, and the marginal cost is estimated at $9. Furthermore, extending the pilot over the four academic quarters would cost $124 per pupil", "pagina": 19, "localizada": true, "origen": "Ficha de Brújula", "usos": [{"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "favor", "equipo": "Brújula", "quien": "Noelia Cano", "tipo": "discurso", "fase": "Exposición inicial de Brújula (a favor)", "veces": 1, "frase": "Nueve dólares por cada alumno adicional [3605]."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "favor", "equipo": "Brújula", "quien": "Noelia Cano", "tipo": "respuesta", "fase": "Examen cruzado a Brújula (a favor)", "veces": 1, "frase": "No defendemos el móvil a solas, sino eso, que cuesta nueve dólares por alumno adicional [3605]."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "favor", "equipo": "Brújula", "quien": "Javier Serrano", "tipo": "discurso", "fase": "Primera refutación de Brújula (a favor)", "veces": 1, "frase": "La administración, a nueve dólares por alumno adicional [3605], frente a la academia que hoy pagan casi la mitad de las familias [3607]."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "favor", "equipo": "Brújula", "quien": "Laura Pérez", "tipo": "discurso", "fase": "Segunda refutación de Brújula (a favor)", "veces": 1, "frase": "Nosotros le ofrecemos lo contrario, un tutor en el instituto con su profesora al lado, como en Nigeria, donde costó nueve dólares por cada alumno adicional [3605]."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "favor", "equipo": "Brújula", "quien": "Laura Pérez", "tipo": "discurso", "fase": "Refutación cruzada de Brújula (a favor)", "veces": 1, "frase": "Nosotros le ponemos a su profesora al lado, formada en tres días [3610], por nueve dólares por alumno [3605]."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "favor", "equipo": "Brújula", "quien": "Óscar Román", "tipo": "discurso", "fase": "Conclusión de Brújula (a favor)", "veces": 1, "frase": "El nuestro le pone a su profesora al lado, formada en días [3610], a nueve dólares por alumno adicional [3605], cuando hoy la academia la paga casi la mitad de las familias [3607]."}], "incidencias": [{"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "problema": "Uso selectivo. Brújula repite siempre los 9 dólares de coste marginal por alumno adicional, pero la misma ficha da unos 48 dólares por alumno en el piloto y 124 dólares para un curso completo. Cuando Julia Arnau señala que es un coste marginal, Laura Pérez responde que «Kairós no ha dado ninguna cifra», cuando la cifra estaba en su propia ficha. No es un dato falso, pero es incompleto, y además desplaza la carga de la prueba."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "problema": "La ficha da dos cifras: 48 $ por alumno en el piloto y 9 $ de coste marginal. Brújula usó casi siempre 'por alumno adicional', pero en la refutación cruzada Laura dijo 'nueve dólares por alumno'. Julia Arnau señaló con acierto que es un coste marginal. Ningún equipo mencionó los 48 $ del piloto, que eran precisamente la cifra de montaje que Laura reclamaba."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "problema": "En la refutación cruzada, Laura Pérez dice «por nueve dólares por alumno». La ficha da 9 $ como coste marginal por alumno adicional, mientras que el piloto costó unos 48 $ por alumno. Se omite «adicional» justo cuando Kairós había atacado esa cifra. Es impreciso pero no falso, porque reconoce acto seguido que «montarlo cuesta más». Sin penalización. El resto de oradores de Brújula la citaron bien."}], "favor": 6, "contra": 0, "total": 6}, {"id": "3607", "postura": "favor", "tipo": "informe", "fecha": "2026", "tag": "En España casi la mitad de las familias con escolares paga clases particulares: 2.782 millones de euros al año; el refuerzo hoy depende del bolsillo", "fuente": "Gortazar, L. y Moreno, J. M. (2026). El mercado de las clases particulares en España entre 2020 y 2024: la nueva geografía social, territorial y lingüística de la Educación en la Sombra. EsadeEcPol Insight, junio de 2026 (a partir de la EGHE 2023/24 del INE).", "url": "https://www.esade.edu/ecpol/wp-content/uploads/2026/06/Shadow_III_Brief.pdf", "cita": "Encontramos que el gasto agregado en clases particulares en 2023/24 fue de 2.782M de euros, con casi la mitad de los estudiantes recibiendo clases. [...] La participación se mantiene estable entre 2019-2020 y 2023-2024, reforzando la idea de continuidad: el 47 % de hogares con escolares consume clases particulares. Ahora bien: esta aparente estabilidad esconde una importante heterogeneidad por etapa escolar, nivel de renta del hogar, así como por comunidad autónoma.", "cita_original": "", "pagina": 3, "localizada": true, "origen": "Ficha de Brújula", "usos": [{"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "favor", "equipo": "Brújula", "quien": "Noelia Cano", "tipo": "discurso", "fase": "Exposición inicial de Brújula (a favor)", "veces": 1, "frase": "En España, casi la mitad de las familias con escolares paga clases particulares, según EsadeEcPol [3607]."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "favor", "equipo": "Brújula", "quien": "Javier Serrano", "tipo": "discurso", "fase": "Primera refutación de Brújula (a favor)", "veces": 1, "frase": "La administración, a nueve dólares por alumno adicional [3605], frente a la academia que hoy pagan casi la mitad de las familias [3607]."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "favor", "equipo": "Brújula", "quien": "Laura Pérez", "tipo": "discurso", "fase": "Segunda refutación de Brújula (a favor)", "veces": 1, "frase": "Comparadlo con la academia que hoy pagan casi la mitad de las familias [3607]."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "favor", "equipo": "Brújula", "quien": "Laura Pérez", "tipo": "discurso", "fase": "Refutación cruzada de Brújula (a favor)", "veces": 1, "frase": "Kairós no ha dado ninguna cifra, y la academia la paga casi la mitad de las familias [3607]."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "favor", "equipo": "Brújula", "quien": "Óscar Román", "tipo": "discurso", "fase": "Conclusión de Brújula (a favor)", "veces": 1, "frase": "El nuestro le pone a su profesora al lado, formada en días [3610], a nueve dólares por alumno adicional [3605], cuando hoy la academia la paga casi la mitad de las familias [3607]."}], "incidencias": [], "favor": 5, "contra": 0, "total": 5}, {"id": "3864", "postura": "contra", "tipo": "informe", "fecha": "2026", "tag": "Así se usa de verdad: en una encuesta europea a más de 7.000 alumnos de 12 a 17 años (España incluida), casi 1 de cada 3 usa la IA para que le dé la solución completa de la tarea y solo 1 de cada 5 para organizar su aprendizaje; el motivo es la comodidad, no aprender (OCDE 2026)", "fuente": "OCDE (2026). OECD Digital Education Outlook 2026: Exploring Effective Uses of Generative AI in Education. OECD Publishing, París.", "url": "https://www.oecd.org/content/dam/oecd/en/publications/reports/2026/01/oecd-digital-education-outlook-2026_940e0dd8/062a7394-en.pdf", "cita": "Más allá de los estudios de caso nacionales, una encuesta europea a más de 7 000 jóvenes de 12 a 17 años de siete países (Alemania, Grecia, Portugal, Rumanía, España, Turquía y Reino Unido) observó un uso elevado de la IA generativa por parte del alumnado. [...] Muchos alumnos recurren claramente a las herramientas de IA generativa con fines académicos. Sin embargo, sus motivaciones principales suelen centrarse en la comodidad y la eficiencia más que en un aprendizaje más profundo. [...] De forma parecida, en la encuesta europea de siete países mencionada antes, los usos de aprendizaje más comunes fuera de la escuela y sin indicación del profesorado son obtener información (56 %) y que les expliquen términos y conceptos (45 %). Casi un tercio (31 %) declara usar la IA para que le dé las soluciones completas de las tareas, mientras que menos (20 %) la usan para funciones de autorregulación, como estructurar planes de aprendizaje personalizados o seguir su progreso.", "cita_original": "Beyond national case studies, a cross-country European survey of more than 7 000 12-17 year-olds across seven countries (Germany, Greece, Portugal, Romania, Spain, Türkiye, and United Kingdom) saw high use of Generative AI by students. [...] Many students are clearly turning to GenAI tools for academic purposes. However, their primary motivations often center on convenience and efficiency rather than deeper learning. [...] Similarly, in the seven-country European survey mentioned earlier, the most common out-of-school, non-instructed learning uses are obtaining information (56%) and getting explanations of terms and concepts (45%). Nearly one-third (31%) report using AI to provide complete solutions to tasks, while fewer (20%) use it for self-regulatory functions such as structuring personalised learning plans or tracking progress (Figure 1.2).", "pagina": 1, "localizada": true, "origen": "Ficha de Kairós", "usos": [{"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "contra", "equipo": "Kairós", "quien": "Valeria Domínguez", "tipo": "discurso", "fase": "Exposición inicial de Kairós (en contra)", "veces": 1, "frase": "Según la OCDE, casi uno de cada tres alumnos europeos, españoles incluidos, le pide la solución completa [3864]."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "contra", "equipo": "Kairós", "quien": "Valeria Domínguez", "tipo": "respuesta", "fase": "Examen cruzado a Kairós (en contra)", "veces": 1, "frase": "La tarde que gana el profesor se pierde si su alumno, en casa, le pide la solución completa, como uno de cada tres [3864]."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "contra", "equipo": "Kairós", "quien": "Tomás Lledó", "tipo": "discurso", "fase": "Primera refutación de Kairós (en contra)", "veces": 1, "frase": "Y según la OCDE, casi uno de cada tres alumnos europeos, españoles incluidos, le pide la solución completa [3864]."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "contra", "equipo": "Kairós", "quien": "Tomás Lledó", "tipo": "discurso", "fase": "Primera refutación de Kairós (en contra)", "veces": 1, "frase": "Ese ChatGPT no es una caricatura, es el que casi uno de cada tres usa para pedir la solución completa [3864]."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "contra", "equipo": "Kairós", "quien": "Julia Arnau", "tipo": "discurso", "fase": "Segunda refutación de Kairós (en contra)", "veces": 1, "frase": "El primo listo ya está en su móvil, como dijo Noelia, y casi uno de cada tres alumnos europeos le pide la solución completa [3864]."}], "incidencias": [{"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "problema": "La cita es exacta (31% pide la solución completa, España incluida), pero «El manguito no es el mal uso. Es el uso» generaliza a todos lo que hace un 31%. La misma ficha dice que los usos más comunes son obtener información (56%) y que les expliquen conceptos (45%). Además, la encuesta mide usos fuera de la escuela y sin indicación del profesor, y no mide resultados de aprendizaje."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "problema": "La ficha es correcta: 31 % de 7 países, España incluida. Pero se refiere a usos 'fuera de la escuela y sin indicación del profesorado'. Valeria lo amplió a 'El manguito no es el mal uso. Es el uso', lo que estira un tercio hasta presentarlo como la norma. Además, el contexto de la ficha apoya el 'con profesor o sin él' de Brújula, y Brújula no lo aprovechó."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "problema": "Es fiel a la ficha: el 31 % pide la solución completa, en una encuesta de siete países que incluye España. Pero Kairós saca de ahí que «el manguito no es el mal uso, es el uso», y la misma ficha dice que los usos más comunes son obtener información (56 %) y que les expliquen conceptos (45 %). Es una generalización discutible, no un dato falso."}], "favor": 0, "contra": 5, "total": 5}, {"id": "3606", "postura": "favor", "tipo": "estudio", "fecha": "2025", "tag": "La IA como copiloto del docente novel: +9 puntos de dominio para los alumnos de los tutores peor valorados, por 20 dólares al año por tutor", "fuente": "Wang, R. E., Ribeiro, A. T., Robinson, C. D., Loeb, S. y Demszky, D. (2025). Tutor CoPilot: A Human-AI Approach for Scaling Real-Time Expertise. Stanford University, arXiv:2410.03017v2.", "url": "https://arxiv.org/pdf/2410.03017v2", "cita": "Este estudio presenta el primer ensayo controlado aleatorizado de un sistema humano-IA en tutoría en directo, con 900 tutores y 1.800 alumnos de primaria y secundaria de comunidades históricamente desatendidas. Siguiendo un plan de análisis prerregistrado, encontramos que los alumnos que trabajan matemáticas con tutores asignados al azar a tener acceso a Tutor CoPilot tienen 4 puntos porcentuales más de probabilidad de dominar los temas (p<0,01). En particular, los alumnos de los tutores peor valorados fueron los más beneficiados, mejorando el dominio en 9 puntos porcentuales respecto al grupo de control. Encontramos que Tutor CoPilot cuesta solo 20 dólares por tutor al año, según el uso de los tutores durante el estudio.", "cita_original": "This study presents the first randomized controlled trial of a Human-AI system in live tutoring, involving 900 tutors and 1,800 K-12 students from historically under-served communities. Following a preregistered analysis plan, we find that students working on mathematics with tutors randomly assigned to have access to Tutor CoPilot are 4 percentage points (p.p.) more likely to master topics (p<0.01). Notably, students of lower-rated tutors experienced the greatest benefit, improving mastery by 9 p.p. relative to the control group. We find that Tutor CoPilot costs only $20 per-tutor annually, based on the tutors' usage during the study.", "pagina": 1, "localizada": true, "origen": "Ficha de Brújula", "usos": [{"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "favor", "equipo": "Brújula", "quien": "Javier Serrano", "tipo": "discurso", "fase": "Primera refutación de Brújula (a favor)", "veces": 1, "frase": "Y en un ensayo de Stanford, con un copiloto de inteligencia artificial para tutores de carne y hueso, ganaron más los alumnos de los tutores más flojos [3606]."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "favor", "equipo": "Brújula", "quien": "Laura Pérez", "tipo": "respuesta", "fase": "Segunda refutación de Brújula (a favor)", "veces": 1, "frase": "En Stanford todos tenían un tutor de carne y hueso, y aquellos cuyo tutor usaba además la inteligencia artificial dominaron más temas [3606]."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "favor", "equipo": "Brújula", "quien": "Laura Pérez", "tipo": "discurso", "fase": "Refutación cruzada de Brújula (a favor)", "veces": 1, "frase": "Con el mismo tutor humano usando inteligencia artificial, sus alumnos dominaron más temas [3606]."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "favor", "equipo": "Brújula", "quien": "Óscar Román", "tipo": "discurso", "fase": "Conclusión de Brújula (a favor)", "veces": 1, "frase": "Y Julia, que en Stanford los alumnos dominaron más temas [3606]."}], "incidencias": [{"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "problema": "Lo comprobé. Los alumnos de tutores con Tutor CoPilot tienen 4 puntos más de dominio, y 9 más con los tutores peor valorados. Laura y Óscar la usaron con exactitud. Kairós la concedió."}], "favor": 4, "contra": 0, "total": 4}, {"id": "3609", "postura": "favor", "tipo": "dato oficial", "fecha": "2025", "tag": "El freno en España es de formación, no de prohibición: el 75% del profesorado de secundaria dice no saber enseñar con IA y solo el 11% lo tiene prohibido", "fuente": "Ministerio de Educación, Formación Profesional y Deportes / INEE (2025). TALIS 2024. Informe español. Apartado 2.7.2.4, Obstáculos y barreras para el uso de la inteligencia artificial.", "url": "https://www.libreria.educacion.gob.es/ebook/186474/free_download/", "cita": "En el caso de España, el profesorado de secundaria se sitúa en línea con los promedios internacionales en la mayoría de los indicadores. El 75 % declara no tener los conocimientos necesarios para enseñar con IA, el 55 % expresa reservas ideológicas y el 30 % se siente abrumado por la integración de nuevas tecnologías. La falta de infraestructura (33 %) y la prohibición institucional (11 %) son menos frecuentes, aunque presentes.", "cita_original": "", "pagina": 2, "localizada": true, "origen": "Ficha de Brújula", "usos": [{"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "favor", "equipo": "Brújula", "quien": "Noelia Cano", "tipo": "discurso", "fase": "Exposición inicial de Brújula (a favor)", "veces": 1, "frase": "Y en España el freno no es una prohibición, sino que tres de cada cuatro profesores de secundaria dicen no saber enseñar con ella, según TALIS [3609]."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "favor", "equipo": "Brújula", "quien": "Javier Serrano", "tipo": "discurso", "fase": "Primera refutación de Brújula (a favor)", "veces": 1, "frase": "Según TALIS, solo uno de cada diez docentes dice que se la prohíben [3609]."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "favor", "equipo": "Brújula", "quien": "Laura Pérez", "tipo": "discurso", "fase": "Segunda refutación de Brújula (a favor)", "veces": 1, "frase": "Según TALIS, solo uno de cada diez docentes la tiene prohibida [3609]."}], "incidencias": [], "favor": 3, "contra": 0, "total": 3}, {"id": "3863", "postura": "contra", "tipo": "norma", "fecha": "2026", "tag": "La herramienta llega antes que las reglas: el Ómnibus de julio de 2026 aplazó al 2 de diciembre de 2027 las obligaciones de los sistemas de alto riesgo del anexo III (donde están los usos educativos) y rebajó la alfabetización en IA a «apoyar su promoción», sin garantizar ningún nivel", "fuente": "Reglamento (UE) 2026/1744 del Parlamento Europeo y del Consejo, de 8 de julio de 2026, por el que se modifican los Reglamentos (UE) 2024/1689, (UE) 2018/1139 y (UE) 2023/1230 en lo que respecta a la simplificación de la aplicación de normas armonizadas en materia de inteligencia artificial (Ómnibus digital sobre IA). DOUE, Serie L, 24.7.2026.", "url": "https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=OJ:L_202601744", "cita": "«Artículo 4 Alfabetización en materia de IA 1. Los proveedores y responsables del despliegue de sistemas de IA adoptarán medidas para apoyar la promoción de la alfabetización en materia de IA de su personal y demás personas que se encarguen en su nombre del funcionamiento y la utilización de sistemas de IA, [...]. Esta obligación no exige que los proveedores o los responsables del despliegue garanticen un nivel específico de alfabetización en materia de IA de ninguna persona en particular. [...]» [...] «c) el capítulo III, secciones 1, 2 y 3, con excepción de su artículo 6, apartado 5, será aplicable a partir del: i) 2 de diciembre de 2027 en lo que respecta a los sistemas de IA clasificados como de alto riesgo en virtud del artículo 6, apartado 2, y el anexo III, y ii) 2 de agosto de 2028 en lo que respecta a los sistemas de IA clasificados como de alto riesgo en virtud del artículo 6, apartado 1, y al anexo I;»", "cita_original": "", "pagina": 16, "localizada": true, "origen": "Ficha de Kairós", "usos": [{"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "contra", "equipo": "Kairós", "quien": "Valeria Domínguez", "tipo": "discurso", "fase": "Exposición inicial de Kairós (en contra)", "veces": 1, "frase": "Y antes que las reglas, porque Europa ha aplazado a diciembre de 2027 las obligaciones de la inteligencia artificial que evalúa a los alumnos [3863]."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "contra", "equipo": "Kairós", "quien": "Tomás Lledó", "tipo": "discurso", "fase": "Primera refutación de Kairós (en contra)", "veces": 1, "frase": "Europa no, porque su reglamento, reformado este julio, se conforma con promover la alfabetización, sin garantizar ningún nivel [3863]."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "contra", "equipo": "Kairós", "quien": "Julia Arnau", "tipo": "discurso", "fase": "Segunda refutación de Kairós (en contra)", "veces": 1, "frase": "Aquí no hay programa, y Europa no garantiza ningún nivel de formación [3863]."}], "incidencias": [], "favor": 0, "contra": 3, "total": 3}, {"id": "3601", "postura": "favor", "tipo": "estudio", "fecha": "2025", "tag": "Ensayo aleatorizado en Inglaterra: con ChatGPT y una guía, los profesores recortan un 31% el tiempo de preparar clases sin que baje la calidad de los materiales", "fuente": "NFER / Education Endowment Foundation (2025). Teacher Choices Trial Summaries: Using ChatGPT in lesson preparation. National Foundation for Educational Research.", "url": "https://nfer.ac.uk/media/fn0p4nvb/nfer-classroom-chatgpt-for-lesson-planning-summary.pdf", "cita": "Recogimos ejemplos de los recursos didácticos que los docentes habían elaborado durante el ensayo. Un panel de profesores de ciencias, que no conocía el propósito del proyecto, los clasificó. Al analizarlos, no encontramos indicios de diferencia en la calidad de los recursos entre los dos grupos. [...] Los docentes que usaron ChatGPT en el ensayo redujeron el tiempo de planificación de clases un 31 %, de media. Este ahorro se logró con un uso relativamente modesto: normalmente para preparar una sola actividad o aspecto en un tercio de las clases.", "cita_original": "We collected examples of the lesson resources that teachers had produced during the trial. These were ranked by a panel of science teachers, who were not aware of the project's purpose. When we analysed these, we found no evidence of a difference in lesson resource quality between the two groups. [...] Teachers using ChatGPT in the trial cut lesson planning time by 31%, on average. This time saving was achieved with relatively modest use typically to prepare for a single activity or aspect within a third of lessons.", "pagina": 5, "localizada": true, "origen": "Ficha de Brújula", "usos": [{"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "favor", "equipo": "Brújula", "quien": "Noelia Cano", "tipo": "discurso", "fase": "Exposición inicial de Brújula (a favor)", "veces": 1, "frase": "En Inglaterra dieron ChatGPT y una guía a profesores elegidos al azar [3601], y prepararon sus clases en casi un tercio menos de tiempo, sin que bajara la calidad."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "favor", "equipo": "Brújula", "quien": "Noelia Cano", "tipo": "respuesta", "fase": "Examen cruzado a Brújula (a favor)", "veces": 1, "frase": "En el ensayo inglés solo les dieron ChatGPT y una guía, y ya prepararon las clases en casi un tercio menos de tiempo [3601]."}], "incidencias": [{"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "problema": "«De cada tres tardes, casi una vuelve» estira el dato. La ficha habla de un 31% menos de tiempo de planificación, con un uso modesto (una actividad en un tercio de las clases), no de tardes. La paráfrasis es admisible, pero conviene ceñirse al dato."}], "favor": 2, "contra": 0, "total": 2}, {"id": "3602", "postura": "favor", "tipo": "dato oficial", "fecha": "2025", "tag": "Los docentes que usan IA cada semana ahorran 5,9 horas semanales (seis semanas por curso) y las dedican a mejor feedback, clases individualizadas y familias", "fuente": "Gallup y Walton Family Foundation (2025). Teaching for Tomorrow: Unlocking Six Weeks a Year With AI. Encuesta a 2.232 docentes de escuelas públicas K-12 de EE. UU.", "url": "https://nextgeninsights.waltonfamilyfoundation.org/wp-content/uploads/2025/06/Teachers_AI_Report.pdf", "cita": "Los docentes que usan herramientas de IA al menos una vez por semana estiman que ahorran 5,9 horas semanales de media. A lo largo de un curso escolar, este ahorro suma seis semanas adicionales, que los docentes pueden reinvertir en otras áreas. Los datos cualitativos de la encuesta muestran que los docentes dedican el tiempo que ahorran con la IA a cosas como dar un feedback más matizado al alumnado, crear clases individualizadas, escribir correos a las familias y llegar a casa con los suyos a una hora más razonable.", "cita_original": "Teachers who use AI tools at least weekly estimate saving 5.9 hours per week on average. Over the course of a school year, these time savings add up to an additional six weeks, which teachers can then reinvest in other areas. Qualitative data from the survey show that teachers use the time they save with AI on things like providing more nuanced student feedback, creating individualized lessons, writing emails to parents and getting home to their families at a more reasonable time.", "pagina": 8, "localizada": true, "origen": "Ficha de Brújula", "usos": [{"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "favor", "equipo": "Brújula", "quien": "Noelia Cano", "tipo": "discurso", "fase": "Exposición inicial de Brújula (a favor)", "veces": 1, "frase": "Y en Estados Unidos, quienes la usan cada semana calculan que ganan seis semanas por curso, según Gallup [3602], para corregir mejor y hablar con las familias."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "favor", "equipo": "Brújula", "quien": "Javier Serrano", "tipo": "discurso", "fase": "Primera refutación de Brújula (a favor)", "veces": 1, "frase": "Eso cuentan los docentes en la encuesta de Gallup, seis semanas por curso para atender mejor a cada alumno y a las familias [3602]."}], "incidencias": [], "favor": 2, "contra": 0, "total": 2}, {"id": "3852", "postura": "contra", "tipo": "estudio", "fecha": "2025", "tag": "Efecto muleta (ensayo con casi 1.000 alumnos de secundaria): con ChatGPT sin barreras el alumno copia la solución y luego, solo, saca un 17 % menos que quien nunca lo tuvo", "fuente": "Bastani, H., Bastani, O., Sungu, A., Ge, H., Kabakcı, Ö. y Mariman, R. (2025). Generative AI without guardrails can harm learning: Evidence from high school mathematics. PNAS, 122(26), e2422633122.", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC12232635/", "cita": "Sin embargo, además encontramos que cuando después se les retira el acceso, los alumnos rinden peor que quienes nunca lo tuvieron (reducción del 17 % en las notas con GPT Base); es decir, el acceso sin restricciones a GPT-4 puede perjudicar los resultados educativos. [...] Sin barreras, los alumnos intentan usar GPT-4 como una «muleta» durante las sesiones de práctica y después rinden peor por su cuenta.", "cita_original": "However, we additionally find that when access is subsequently taken away, students actually perform worse than those who never had access (17% reduction in grades for GPT Base)—i.e., unfettered access to GPT-4 can harm educational outcomes. [...] Without guardrails, students attempt to use GPT-4 as a “crutch” during practice problem sessions, and subsequently perform worse on their own.", "pagina": 1, "localizada": true, "origen": "Ficha de Kairós", "usos": [{"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "contra", "equipo": "Kairós", "quien": "Valeria Domínguez", "tipo": "discurso", "fase": "Exposición inicial de Kairós (en contra)", "veces": 1, "frase": "Un ensayo de PNAS de 2025 con casi mil alumnos de instituto lo midió [3852]."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "contra", "equipo": "Kairós", "quien": "Tomás Lledó", "tipo": "discurso", "fase": "Primera refutación de Kairós (en contra)", "veces": 1, "frase": "Con ChatGPT practicaban mejor y, cuando se lo quitaron, sacaron un diecisiete por ciento menos que quienes nunca lo tuvieron [3852]."}], "incidencias": [{"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "problema": "El dato es correcto, pero Kairós lo usa con doble vara. En la conclusión llama a los beneficios de Brújula «de piloto» frente a «nuestros daños, del uso que hay el lunes», cuando el -17% sale también de un experimento de campo (en Turquía, con GPT-4 en sesiones controladas), no del uso real en España."}], "favor": 0, "contra": 2, "total": 2}, {"id": "3855", "postura": "contra", "tipo": "estudio", "fecha": "2020", "tag": "El precedente del GPS: quien más delega la orientación peor se orienta sin él, y en tres años su memoria espacial cae más; delegar una habilidad la atrofia", "fuente": "Dahmani, L. y Bohbot, V. D. (2020). Habitual use of GPS negatively impacts spatial memory during self-guided navigation. Scientific Reports, 10, 6310.", "url": "https://www.nature.com/articles/s41598-020-62877-0.pdf", "cita": "Primero presentamos resultados transversales que muestran que las personas con mayor experiencia acumulada con el GPS tienen peor memoria espacial durante la navegación autoguiada, es decir, cuando deben orientarse sin GPS. [...] observamos un efecto importante del uso del GPS a lo largo del tiempo, de modo que un mayor uso del GPS desde la primera evaluación se asoció con un declive más pronunciado de la memoria espacial dependiente del hipocampo. Es importante señalar que quienes más usaban el GPS no lo hacían porque sintieran que tenían mal sentido de la orientación, lo que sugiere que el uso intensivo del GPS provocó un declive de la memoria espacial y no al revés.", "cita_original": "We first present cross-sectional results that show that people with greater lifetime GPS experience have worse spatial memory during self-guided navigation, i.e. when they are required to navigate without GPS. [...] we observed an important effect of GPS use over time, whereby greater GPS use since initial testing was associated with a steeper decline in hippocampal-dependent spatial memory. Importantly, we found that those who used GPS more did not do so because they felt they had a poor sense of direction, suggesting that extensive GPS use led to a decline in spatial memory rather than the other way around.", "pagina": 1, "localizada": false, "origen": "Ficha de Kairós", "usos": [{"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "contra", "equipo": "Kairós", "quien": "Valeria Domínguez", "tipo": "discurso", "fase": "Exposición inicial de Kairós (en contra)", "veces": 1, "frase": "Según Scientific Reports, quien más usa el GPS peor se orienta sin él, y con los años su memoria espacial cae más [3855]."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "contra", "equipo": "Kairós", "quien": "Valeria Domínguez", "tipo": "respuesta", "fase": "Examen cruzado a Kairós (en contra)", "veces": 1, "frase": "El GPS también está en todos los móviles, y quien más lo usa peor se orienta sin él [3855]."}], "incidencias": [{"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "problema": "cita_localizada: false, aunque el contenido coincide con el tag. El estudio trata del GPS y la memoria espacial. «Con el pensamiento pasa igual» es una inferencia por analogía que la ficha no prueba. Sirve como ilustración, no como prueba del daño cognitivo de la IA."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "problema": "Tiene cita_localizada: false. El contenido es coherente con el estudio de Dahmani y Bohbot y parece una traducción. Se usó como analogía y Brújula no la discutió."}, {"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "problema": "Tiene cita_localizada: false, pero la traducción coincide con la cita original de la ficha. Se usa correctamente (más uso del GPS, peor memoria espacial sin él)."}], "favor": 0, "contra": 2, "total": 2}, {"id": "3603", "postura": "favor", "tipo": "dato oficial", "fecha": "2025", "tag": "La clave es la política de centro: los colegios con normas claras sobre IA obtienen un 26% más de horas ahorradas por docente", "fuente": "Gallup y Walton Family Foundation (2025). Teaching for Tomorrow: Unlocking Six Weeks a Year With AI.", "url": "https://nextgeninsights.waltonfamilyfoundation.org/wp-content/uploads/2025/06/Teachers_AI_Report.pdf", "cita": "Los docentes de centros con políticas sobre IA tienen más probabilidades de haber usado IA en el último año (70 % frente a 60 %), y eso se traduce en un mejor dividendo de la IA para esos centros. Con más docentes usando herramientas de IA, los centros con una política de IA obtienen un dividendo un 26 % mayor que los centros sin ella (2,3 frente a 1,7 horas ahorradas por semana y docente).", "cita_original": "Teachers at schools with AI policies are more likely to have used AI in the past year (70% vs. 60%), and this translates to a better AI dividend for those schools. With more teachers using AI tools, schools with an AI policy are earning an AI dividend that is 26% greater than schools without an AI policy (2.3 vs. 1.7 hours saved per week per teacher).", "pagina": 20, "localizada": true, "origen": "Ficha de Brújula", "usos": [{"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "favor", "equipo": "Brújula", "quien": "Javier Serrano", "tipo": "discurso", "fase": "Primera refutación de Brújula (a favor)", "veces": 1, "frase": "Y con una norma de centro clara, que no cuesta un euro, el ahorro crece una cuarta parte [3603]."}], "incidencias": [], "favor": 1, "contra": 0, "total": 1}, {"id": "3862", "postura": "contra", "tipo": "estudio", "fecha": "2023", "tag": "Respuesta a «basta con detectar el uso de IA»: los detectores marcaron como IA el 61,3 % de redacciones reales de estudiantes no nativos; vigilar la IA castiga a los más vulnerables", "fuente": "Liang, W., Yuksekgonul, M., Mao, Y., Wu, E. y Zou, J. (2023). GPT detectors are biased against non-native English writers. Patterns, 4(7), 100779.", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC10382961/", "cita": "Aunque los detectores clasificaron con precisión las redacciones de los alumnos estadounidenses, etiquetaron incorrectamente como «generadas por IA» más de la mitad de las redacciones del TOEFL (tasa media de falsos positivos: 61,3 %). Todos los detectores identificaron por unanimidad el 19,8 % de las redacciones del TOEFL escritas por humanos como obra de IA, y al menos un detector marcó el 97,8 % de las redacciones del TOEFL como generadas por IA.", "cita_original": "While the detectors accurately classified the US student essays, they incorrectly labeled more than half of the TOEFL essays as \"AI-generated\" (average false-positive rate: 61.3%). All detectors unanimously identified 19.8% of the human-written TOEFL essays as AI authored, and at least one detector flagged 97.8% of TOEFL essays as AI generated.", "pagina": 7, "localizada": true, "origen": "Ficha de Kairós", "usos": [{"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "lado": "contra", "equipo": "Kairós", "quien": "Valeria Domínguez", "tipo": "discurso", "fase": "Exposición inicial de Kairós (en contra)", "veces": 1, "frase": "Antes que una evaluación fiable, porque según Stanford los detectores tomaron por texto de máquina seis de cada diez redacciones reales de alumnos no nativos [3862]."}], "incidencias": [{"ronda": "Ronda 1", "sala": "Sala 1", "debate": "R1D1", "enlace": "rondas/R1/R1D1/visor.html", "cruce": "Brújula (a favor) contra Kairós (en contra)", "problema": "Valeria Domínguez atribuye el estudio a «Stanford». La ficha (Liang et al., Patterns) no nombra la institución. El dato (61,3 % de falsos positivos con redacciones de no nativos, «seis de cada diez») sí es fiel a la ficha. No se penaliza: es una atribución, no un dato."}], "favor": 0, "contra": 1, "total": 1}, {"id": "3608", "postura": "favor", "tipo": "informe", "fecha": "2026", "tag": "Los propios analistas de las clases particulares apuntan a la IA generativa como posible alternativa o sustituto del refuerzo de pago en la ESO", "fuente": "Gortazar, L. y Moreno, J. M. (2026). El mercado de las clases particulares en España entre 2020 y 2024. EsadeEcPol Insight, junio de 2026.", "url": "https://www.esade.edu/ecpol/wp-content/uploads/2026/06/Shadow_III_Brief.pdf", "cita": "Una explicación posible de la caída del gasto en la ESO podría tener que ver con el impacto de la Inteligencia Artificial generativa como alternativa o incluso como reemplazo potencial de clases particulares.", "cita_original": "", "pagina": 3, "localizada": true, "origen": "Ficha de Brújula", "usos": [], "incidencias": [], "favor": 0, "contra": 0, "total": 0}, {"id": "3611", "postura": "favor", "tipo": "estudio", "fecha": "2026", "tag": "Respuesta a «la IA dispara las trampas»: tras año y medio de chatbots, la tasa de copia en institutos sigue estable en su nivel histórico (72%)", "fuente": "Chen, R., Lee, V. R., Kuo, A. C., Pope, D. C. y Miles, S. (2026). Cheating in the second year of generative AI chatbots: a follow-up study on high school student cheating behaviors. Educational Technology Research and Development (Springer), acceso abierto.", "url": "https://link.springer.com/content/pdf/10.1007/s11423-026-10587-1.pdf", "cita": "Mediante una encuesta exhaustiva a estudiantes de seis centros (N = 4.354) de Estados Unidos, investigamos las conductas de copia autodeclaradas, los patrones de uso de IA en distintas tareas escolares y las opiniones del alumnado sobre el uso adecuado de la IA en el ámbito académico. Nuestros resultados revelan que las tasas globales de copia se mantienen estables en el 72,06 %, en línea con las referencias históricas y estudios previos, lo que sugiere que la disponibilidad de la IA no ha cambiado la prevalencia global de la copia en secundaria. Además, más estudiantes declararon usar chatbots de IA para tareas de apoyo como la explicación de conceptos y la generación de ideas.", "cita_original": "Through a comprehensive survey of students across six schools (N = 4,354) in the United States, we investigated students' self-reported cheating behaviors, patterns of AI use across different school-related tasks, and student perspectives on appropriate AI use in academic settings. Our findings revealed that overall cheating rates remain stable at 72.06%, consistent with historical baselines and prior studies, suggesting that AI availability has not changed overall cheating prevalence in high school. Additionally, more students reported using AI chatbots for support tasks like concept explanation and idea generation.", "pagina": 1, "localizada": false, "origen": "Ficha de Brújula", "usos": [], "incidencias": [], "favor": 0, "contra": 0, "total": 0}, {"id": "3612", "postura": "favor", "tipo": "dato oficial", "fecha": "2024", "tag": "Respuesta a la privacidad de los menores: el uso más intrusivo ya está prohibido; desde el 2 de febrero de 2025 la UE veta la IA que infiere emociones en los centros educativos", "fuente": "Reglamento (UE) 2024/1689 del Parlamento Europeo y del Consejo, de 13 de junio de 2024, de Inteligencia Artificial. DOUE L, 12.7.2024. Artículo 5.1.f) y artículo 113.a).", "url": "https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R1689", "cita": "[Quedan prohibidas las siguientes prácticas de IA:] f) la introd
